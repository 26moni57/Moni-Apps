<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickNote</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff8df;
    color: #252525;
}

.app {
    max-width: 420px;
    min-height: 100vh;
    margin: auto;
    padding-bottom: 100px;
}

/* Header */

.header {
    padding: 28px 20px 20px;
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 27px;
    font-weight: 800;
}

.count {
    background: #252525;
    color: white;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12px;
}

/* Search */

.search {
    margin-top: 20px;
    position: relative;
}

.search input {
    width: 100%;
    border: none;
    outline: none;
    background: white;
    border-radius: 17px;
    padding: 15px 18px 15px 45px;
    font-size: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.search-icon {
    position: absolute;
    left: 17px;
    top: 14px;
    font-size: 18px;
}

/* Notes */

.notes {
    padding: 0 20px;
}

.note {
    background: white;
    padding: 18px;
    border-radius: 21px;
    margin-bottom: 14px;
    box-shadow: 0 5px 18px rgba(0,0,0,.06);
}

.note-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 8px;
}

.note-text {
    color: #626262;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
}

.note-footer {
    margin-top: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.note-date {
    color: #999;
    font-size: 11px;
}

.delete {
    border: none;
    background: #fff0f0;
    color: #e74c3c;
    border-radius: 10px;
    padding: 8px 10px;
    cursor: pointer;
}

/* Empty */

.empty {
    text-align: center;
    padding: 70px 25px;
    color: #8d8d8d;
}

.empty-icon {
    font-size: 55px;
    margin-bottom: 10px;
}

/* Floating button */

.add {
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 60px;
    height: 60px;
    border: none;
    border-radius: 20px;
    background: #252525;
    color: white;
    font-size: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,.25);
    cursor: pointer;
}

/* Modal */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: flex-end;
    justify-content: center;
}

.overlay.show {
    display: flex;
}

.modal {
    width: min(420px,100%);
    background: white;
    border-radius: 28px 28px 0 0;
    padding: 24px 20px 30px;
}

.modal h2 {
    margin-top: 0;
}

.modal input,
.modal textarea {
    width: 100%;
    border: 1px solid #ddd;
    outline: none;
    border-radius: 14px;
    padding: 14px;
    font-family: inherit;
    font-size: 15px;
    margin-bottom: 12px;
}

.modal textarea {
    height: 150px;
    resize: none;
}

.save {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: #252525;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

.cancel {
    width: 100%;
    padding: 14px;
    border: none;
    background: transparent;
    margin-top: 5px;
    color: #777;
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="header-top">

            <div class="logo">
                📝 QuickNote
            </div>

            <div
                class="count"
                id="count"
            >
                0 notes
            </div>

        </div>

        <div class="search">

            <span class="search-icon">
                🔍
            </span>

            <input
                id="search"
                type="text"
                placeholder="Search your notes..."
                oninput="renderNotes()"
            >

        </div>

    </header>


    <main
        class="notes"
        id="notes"
    ></main>

</div>


<!-- Add Button -->

<button
    class="add"
    onclick="openModal()"
>
    +
</button>


<!-- Modal -->

<div
    class="overlay"
    id="overlay"
>

    <div class="modal">

        <h2>New Note ✨</h2>

        <input
            id="title"
            type="text"
            placeholder="Note title"
        >

        <textarea
            id="text"
            placeholder="Write your note..."
        ></textarea>

        <button
            class="save"
            onclick="saveNote()"
        >
            Save Note
        </button>

        <button
            class="cancel"
            onclick="closeModal()"
        >
            Cancel
        </button>

    </div>

</div>


<script>

/*
    QuickNote
    Local-storage notes application
*/

let noteList =
    JSON.parse(
        localStorage.getItem("quickNotes")
    ) || [];


/* Open modal */

function openModal() {

    document
        .getElementById("overlay")
        .classList.add("show");

    document
        .getElementById("title")
        .focus();
}


/* Close modal */

function closeModal() {

    document
        .getElementById("overlay")
        .classList.remove("show");

    document.getElementById("title").value = "";

    document.getElementById("text").value = "";
}


/* Save note */

function saveNote() {

    const title =
        document.getElementById("title").value.trim();

    const text =
        document.getElementById("text").value.trim();

    if (!title && !text) {

        alert("Please write something first.");

        return;
    }

    const note = {

        id: Date.now(),

        title: title || "Untitled Note",

        text: text,

        date: new Date().toLocaleString()

    };

    noteList.unshift(note);

    saveToStorage();

    closeModal();

    renderNotes();
}


/* Delete note */

function deleteNote(id) {

    noteList =
        noteList.filter(
            note => note.id !== id
        );

    saveToStorage();

    renderNotes();
}


/* Save local storage */

function saveToStorage() {

    localStorage.setItem(
        "quickNotes",
        JSON.stringify(noteList)
    );
}


/* Render notes */

function renderNotes() {

    const container =
        document.getElementById("notes");

    const query =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    const filtered =
        noteList.filter(note =>

            note.title
                .toLowerCase()
                .includes(query)

            ||

            note.text
                .toLowerCase()
                .includes(query)

        );


    document.getElementById("count").innerText =
        noteList.length +
        (noteList.length === 1 ? " note" : " notes");


    if (filtered.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📝
                </div>

                <h3>
                    No notes yet
                </h3>

                <p>
                    Tap + to create your first note.
                </p>

            </div>

        `;

        return;
    }


    container.innerHTML =
        filtered.map(note => `

            <article class="note">

                <div class="note-title">
                    ${escapeHTML(note.title)}
                </div>

                <div class="note-text">
                    ${escapeHTML(note.text)}
                </div>

                <div class="note-footer">

                    <span class="note-date">
                        ${escapeHTML(note.date)}
                    </span>

                    <button
                        class="delete"
                        onclick="deleteNote(${note.id})"
                    >
                        🗑️
                    </button>

                </div>

            </article>

        `).join("");
}


/* Protect displayed text */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* Close modal when tapping outside */

document
    .getElementById("overlay")
    .addEventListener("click", function(event) {

        if (event.target === this) {

            closeModal();

        }

    });


/* Start */

renderNotes();

</script>

</body>
</html>
