<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#dc2626">
<title>Tomato Pomodoro Core</title>

<style>
/* BRAND NEW CSS PALETTE: Deep Crimson Tomato Red & Clean Pure Snow White Look */
:root{
--bg:#dc2626;
--card:#ffffff;
--text:#27272a;
--muted:#71717a;
--line:#f4f4f5;
--primary:#dc2626;
--primary2:#ef4444;
--soft:#fee2e2;
--green:#16a34a;
--green-soft:#dcfce7;
--shadow:0 15px 35px rgba(0,0,0,0.12)
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text);
transition:background 0.3s ease
}

button,input{font:inherit}
button{cursor:pointer}

.app{
width:100%;
max-width:430px;
min-height:100vh;
margin:auto;
overflow:hidden
}

/* HEADER - CLEAN CRIMSOM INVERSION HEAD */
.header{
position:relative;
padding:24px 18px 28px;
color:white;
background:transparent
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:9px
}

.brand-icon{
width:41px;
height:41px;
display:grid;
place-items:center;
border-radius:50%;
background:rgba(255,255,255,.2);
border:1px solid rgba(255,255,255,.3);
font-size:20px
}

.brand-name{
font-size:21px;
font-weight:900;
letter-spacing:-.5px
}

.theme{
width:40px;
height:40px;
border:0;
border-radius:50%;
background:rgba(255,255,255,.2);
color:#fff
}

.hero{
margin-top:20px
}

.hero h1{
margin:0;
font-size:28px;
line-height:1.1;
letter-spacing:-0.5px
}

.hero p{
margin:6px 0 0;
font-size:13px;
color:rgba(255,255,255,.85)
}

/* CONTENT CONTAINER */
.content{padding:18px}

.card{
padding:20px;
margin-bottom:16px;
background:var(--card);
border:1px solid var(--line);
border-radius:28px;
box-shadow:var(--shadow)
}

.title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px
}

.title h2{
margin:0;
font-size:14px;
text-transform:uppercase;
font-weight:800;
letter-spacing:0.5px;
color:var(--muted)
}

/* TIMER BLOCK DISPLAY */
.timer-panel {
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:20px 0
}

.session-badge {
display:inline-block;
padding:6px 14px;
border-radius:20px;
font-size:11px;
font-weight:800;
text-transform:uppercase;
letter-spacing:0.8px;
background:var(--soft);
color:var(--primary)
}

.countdown-digits {
font-size:64px;
font-weight:900;
font-family:"Courier New",Courier,monospace;
margin:14px 0 2px;
color:var(--text);
letter-spacing:1px
}

/* CONTROLLER HORIZONTAL SYSTEM KEYS */
.controls-row{
display:flex;
gap:10px;
margin-top:5px
}

.btn-control-node {
flex:1;
padding:14px;
border:0;
border-radius:16px;
font-weight:800;
font-size:14px;
transition:all 0.15s ease
}
.btn-control-node:active { transform:scale(0.97); opacity:0.9 }

.btn-start-run { background:var(--primary); color:white; }
.btn-pause-run { background:var(--text); color:white; }
.btn-reset-run { background:var(--line); color:var(--text); }

/* STATS REPORT INDEX SPLIT */
.stats-split-row {
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.stat-node-box {
padding:14px;
background:var(--line);
border-radius:18px;
text-align:center
}

.stat-node-box strong {
display:block;
font-size:22px;
font-weight:900;
color:var(--primary)
}

.stat-node-box span {
display:block;
margin-top:4px;
font-size:9px;
color:var(--muted);
text-transform:uppercase;
font-weight:750
}

/* TOAST COMPLETION METRICS POPUP PANEL */
.toast{
position:fixed;
left:50%;
bottom:40px;
z-index:50;
transform:translate(-50%,20px);
opacity:0;
padding:11px 16px;
border-radius:14px;
background:var(--text);
color:white;
font-size:11.5px;
font-weight:700;
white-space:nowrap;
transition:.25s;
pointer-events:none;
box-shadow:0 10px 25px rgba(0,0,0,0.2)
}

.toast.show{
opacity:1;
transform:translate(-50%,0)
}

/* ALTERNATIVE CYCLE SECTOR BACKGROUND OVERRIDES */
body.break-state-active {
--bg:#16a34a;
--primary:#16a34a;
--soft:#eaf8ee
}
</style>
</head>

<body>

<div class="app">

<header class="header">
<div class="topbar">
<div class="brand">
<div class="brand-icon">🍅</div>
<div class="brand-name">TomatoCore</div>
</div>
<button class="theme" id="themeBtn" onclick="toggleCustomReset()">🔄</button>
</div>

<div class="hero">
<h1>Pomodoro Boxing.<br>Focus Intervals.</h1>
<p>Block accountability sprints cleanly using standard localized interval countdown loops.</p>
</div>
</header>

<main class="content">

<!-- COUNTDOWN CHRONO CARD INTERFACE -->
<section class="card">
<div class="timer-panel">
<span id="lblSessionStatus" class="session-badge">💻 Focus Session</span>
<div class="countdown-digits" id="lblTimeDisplayDigits">25:00</div>
</div>
</section>

<!-- RUNTIME CONTROL ACTIONS -->
<section class="card">
<div class="controls-row">
<button id="btnStartPauseTrigger" class="btn-control-node btn-start-run" onclick="togglePomodoroEngineTrackingState()">Start Session</button>
<button class="btn-control-node btn-reset-run" onclick="resetPomodoroEngineState()">Reset</button>
</div>
</section>

<!-- REPORT HISTORICAL METRICS -->
<section class="card">
<div class="title">
<h2>📊 Session Summary Metrics</h2>
</div>
<div class="stats-split-row">
<div class="stat-node-box">
<strong id="lblRoundsCompleted">0</strong>
<span>Completed Rounds</span>
</div>
<div class="stat-node-box">
<strong id="lblMinutesLogged">0m</strong>
<span>Total Work Time</span>
</div>
</div>
</section>

</main>

<!-- COMPLETED ALERTS NOTIFICATION TOAST -->
<div class="toast" id="toastPanelNode">Interval complete! Time to swap tracks.</div>

</div>

<script>
const TOTAL_WORK_SECONDS = 25 * 60; 
const TOTAL_BREAK_SECONDS = 5 * 60;   

let clockIntervalTimerId = null;
let currentRemainingSecondsCount = TOTAL_WORK_SECONDS;
let isClockEngineActive = false;
let isCurrentIntervalWorkMode = true;

let roundsCompletedCount = parseInt(localStorage.getItem("tomato_core_rounds")) || 0;
let minutesLoggedCount = parseInt(localStorage.getItem("tomato_core_minutes")) || 0;

function updateUIDisplayMetrics() {
    const minPart = Math.floor(currentRemainingSecondsCount / 60);
    const secPart = currentRemainingSecondsCount % 60;
    document.getElementById("lblTimeDisplayDigits").innerText = String(minPart).padStart(2, '0') + ":" + String(secPart).padStart(2, '0');
    
    document.getElementById("lblRoundsCompleted").innerText = roundsCompletedCount;
    document.getElementById("lblMinutesLogged").innerText = minutesLoggedCount + "m";
}

function togglePomodoroEngineTrackingState() {
    if (isClockEngineActive) {
        pausePomodoroCountdown();
    } else {
        launchPomodoroCountdown();
    }
}

function launchPomodoroCountdown() {
    isClockEngineActive = true;
    const btn = document.getElementById("btnStartPauseTrigger");
    btn.innerText = "Pause Session";
    btn.className = "btn-control-node btn-pause-run";

    clockIntervalTimerId = setInterval(() => {
        currentRemainingSecondsCount--;
        
        if (isCurrentIntervalWorkMode && currentRemainingSecondsCount % 60 === 0) {
            minutesLoggedCount++;
            localStorage.setItem("tomato_core_minutes", minutesLoggedCount);
            updateUIDisplayMetrics();
        }

        updateUIDisplayMetrics();

        if (currentRemainingSecondsCount <= 0) {
            clearInterval(clockIntervalTimerId);
            isClockEngineActive = false;
            handleIntervalCycleCompletion();
        }
    }, 1000);
}

function pausePomodoroCountdown() {
    isClockEngineActive = false;
    clearInterval(clockIntervalTimerId);
    const btn = document.getElementById("btnStartPauseTrigger");
    btn.innerText = "Resume Work";
    btn.className = "btn-control-node btn-start-run";
}

function resetPomodoroEngineState() {
    pausePomodoroCountdown();
    isCurrentIntervalWorkMode = true;
    currentRemainingSecondsCount = TOTAL_WORK_SECONDS;
    
    document.body.classList.remove("break-state-active");
    
    const label = document.getElementById("lblSessionStatus");
    label.innerText = "💻 Focus Session";
    
    const btn = document.getElementById("btnStartPauseTrigger");
    btn.innerText = "Start Session";
    
    updateUIDisplayMetrics();
}

function toggleCustomReset() {
    if(confirm("Completely wipe localized interval progress counters history values?")) {
        roundsCompletedCount = 0;
        minutesLoggedCount = 0;
        localStorage.removeItem("tomato_core_rounds");
        localStorage.removeItem("tomato_core_minutes");
        resetPomodoroEngineState();
    }
}

function handleIntervalCycleCompletion() {
    triggerAuditoryAlertChime();
    
    const toast = document.getElementById("toastPanelNode");
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 3000);

    const label = document.getElementById("lblSessionStatus");

    if (isCurrentIntervalWorkMode) {
        roundsCompletedCount++;
        localStorage.setItem("tomato_core_rounds", roundsCompletedCount);
        
        isCurrentIntervalWorkMode = false;
        currentRemainingSecondsCount = TOTAL_BREAK_SECONDS;
        document.body.classList.add("break-state-active");
        label.innerText = "🌴 Break Time";
    } else {
        isCurrentIntervalWorkMode = true;
        currentRemainingSecondsCount = TOTAL_WORK_SECONDS;
        document.body.classList.remove("break-state-active");
        label.innerText = "💻 Focus Session";
    }

    const btn = document.getElementById("btnStartPauseTrigger");
    btn.innerText = isCurrentIntervalWorkMode ? "Start Next Work" : "Trigger Break Rest";
    btn.className = "btn-control-node btn-start-run";
    
    updateUIDisplayMetrics();
}

function triggerAuditoryAlertChime() {
    if (window.AudioContext || window.webkitAudioContext) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
const gain = ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type = "sine";osc.frequency.setValueAtTime(523.25, ctx.currentTime);osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15);gain.gain.setValueAtTime(0.15, ctx.currentTime);osc.start();osc.stop(ctx.currentTime + 0.35);} catch (e) {}}}</script></body></html>
