<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>FormPocket Log</title>

<style>
/* UNIFORM MIDNIGHT OCEAN STYLE */
:root{
--bg:#0f172a;
--card:#1e293b;
--text:#f8fafc;
--muted:#94a3b8;
--line:#334155;
--primary:#2563eb;
--primary2:#3b82f6;
--soft:#1e3a8a;
--green:#10b981;
--green-soft:#064e3b;
--danger:#ef4444;
--shadow:0 10px 30px rgba(15,23,42,.4)
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text)
}

button,input,select{font:inherit}
button{cursor:pointer}

.app{
width:100%;
max-width:430px;
min-height:100vh;
margin:auto;
overflow:hidden
}

/* HEADER */
.header{
position:relative;
padding:21px 18px 31px;
color:white;
background:linear-gradient(145deg,#1e3a8a,#2563eb 55%,#0d9488);
border-radius:0 0 31px 31px;
overflow:hidden
}

.header:before{
content:"";
position:absolute;
width:190px;
height:190px;
right:-90px;
top:-105px;
border-radius:50%;
background:rgba(255,255,255,.08)
}

.topbar{
position:relative;
z-index:2;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:9px
}

.brand-icon{
width:41px;
height:41px;
display:grid;
place-items:center;
border-radius:13px;
background:rgba(255,255,255,.15);
font-size:22px
}

.brand-name{
font-size:21px;
font-weight:850;
letter-spacing:-.5px
}

.theme{
width:40px;
height:40px;
border:0;
border-radius:13px;
background:rgba(255,255,255,.15);
color:#fff
}

.hero{
position:relative;
z-index:2;
margin-top:25px
}

.hero h1{
margin:0;
font-size:30px;
line-height:1.08;
letter-spacing:-.8px
}

.hero p{
margin:8px 0 0;
font-size:13px;
color:rgba(255,255,255,.8)
}

/* CONTENT */
.content{padding:18px}

.card{
padding:17px;
margin-bottom:14px;
background:var(--card);
border:1px solid var(--line);
border-radius:21px;
box-shadow:var(--shadow)
}

.title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px
}

.title h2{
margin:0;
font-size:15px
}

.title span{
font-size:10px;
color:var(--muted)
}

/* FORMPOCKET ENTRIES FEED ROWS */
.entry-card {
padding:14px 0;
border-bottom:1px solid var(--line);
display:flex;
flex-direction:column;
gap:6px
}
.entry-card:last-child{border-bottom:0}

.entry-row-grid {
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.entry-node {
display:flex;
flex-direction:column;
gap:2px
}

.entry-label {
font-size:9px;
font-weight:800;
color:var(--muted);
text-transform:uppercase;
letter-spacing:0.3px
}

.entry-value {
font-size:13px;
font-weight:700;
color:var(--text);
word-wrap:break-word
}

.entry-footer {
display:flex;
justify-content:space-between;
align-items:center;
margin-top:4px
}

.entry-time {
font-size:9px;
color:var(--muted)
}

.btn-remove-entry {
background:transparent;
border:0;
color:var(--danger);
font-size:11px;
font-weight:700;
padding:2px 4px;
cursor:pointer
}

/* FLOATING TRIGGER FAB ACTUATOR */
.fab{
position:fixed;
right:max(22px,calc((100vw - 430px)/2 + 22px));
bottom:23px;
width:59px;
height:59px;
border:0;
border-radius:20px;
background:var(--primary);
color:white;
font-size:28px;
box-shadow:0 12px 28px rgba(37,99,235,.28);
z-index:10;
display:flex;
align-items:center;
justify-content:center
}

/* MODAL DROPDOWN PANEL OVERLAY SHEET */
.overlay{
position:fixed;
inset:0;
z-index:20;
display:none;
align-items:flex-end;
justify-content:center;
background:rgba(0,0,0,.6)
}
.overlay.show{display:flex}

.modal{
width:min(430px,100%);
max-height:92vh;
overflow:auto;
padding:23px 18px 30px;
background:var(--card);
border-radius:28px 28px 0 0;
border-top:1px solid var(--line)
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:17px
}

.modal-head h2{
margin:0;
font-size:19px
}

.close{
width:35px;
height:35px;
border:0;
border-radius:10px;
background:var(--bg);
color:var(--text)
}

.field{margin-bottom:12px}

.field label{
display:block;
margin-bottom:6px;
font-size:11px;
font-weight:750;
color:var(--muted)
}

.field input{
width:100%;
padding:13px;
border:1px solid var(--line);
border-radius:12px;
outline:none;
background:var(--bg);
color:var(--text)
}

.save{
width:100%;
padding:14px;
border:0;
border-radius:13px;
background:var(--primary);
color:white;
font-weight:800
}

.empty-state {
text-align:center;
padding:35px 15px;
color:var(--muted)
}
.empty-icon { font-size:40px; margin-bottom:6px; }

/* LIGHT SKIN OVERRIDE */
body.light-theme {
--bg:#f1f5f9;
--card:#ffffff;
--text:#0f172a;
--muted:#64748b;
--line:#cbd5e1;
--soft:#dbeafe;
--shadow:0 10px 30px rgba(51,65,85,0.06)
}
</style>
</head>

<body>

<div class="app">

<header class="header">
<div class="topbar">
<div class="brand">
<div class="brand-icon">📝</div>
<div class="brand-name">FormPocket</div>
</div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">☀️</button>
</div>

<div class="hero">
<h1>Custom Logging.<br>Structured Fields.</h1>
<p>Log entries on the go with persistent record counting lists parameters.</p>
</div>
</header>

<main class="content">

<!-- LOG DATA FEED PANEL -->
<section class="card">
<div class="title">
<h2>📊 Form Submissions Ledger</h2>
<span id="formsCountSpan">0 records</span>
</div>

<div id="formsSubmissionContainer">
<!-- Rendered dynamically by JavaScript -->
</div>
</section>

</main>

<!-- FLOATING FAB INJECTION ACTION -->
<button class="fab" onclick="openModal()">+</button>

<!-- INPUT FORM SHEET POPUP OVERLAY DRAW PANEL -->
<div class="overlay" id="overlay">
<div class="modal">
<div class="modal-head">
<h2>Submit New Form Log</h2>
<button class="close" onclick="closeModal()">✕</button>
</div>

<div class="field">
<label id="lblField1">DATA ELEMENT HEADER ONE</label>
<input type="text" id="valField1" placeholder="e.g., Client Name / Item Type">
</div>

<div class="field">
<label id="lblField2">DATA ELEMENT HEADER TWO</label>
<input type="text" id="valField2" placeholder="e.g., Project Cost / Task Weight">
</div>

<button class="save" onclick="commitPocketEntry()">Commit Entry to Pocket</button>
</div>
</div>

</div>

<script>
// Define dynamic hard structural keys defaults mappings parameters fields setup
const formLabelsConfig = { field1: "Primary Title / Entity", field2: "Metric Data / Reference" };

// Fetch data log matrix straight from local memory storage lists sandbox
let logRecords = JSON.parse(localStorage.getItem("form_pocket_records")) || [
    { id: 1, val1: "Nike Alpha Project Run", val2: "$12,450 Allocation", time: "Aug 27, 10:15" },
    { id: 2, val1: "Server Cluster Maintenance", val2: "Priority Alpha Verified", time: "Aug 27, 11:30" }
];

function toggleTheme() {
    document.body.classList.toggle("light-theme");
    const btn = document.getElementById("themeBtn");
    btn.innerText = document.body.classList.contains("light-theme") ? "🌙" : "☀️";
}

function openModal() {
    // Dynamically apply title indicators labels directly on panel initialization
    document.getElementById("lblField1").innerText = formLabelsConfig.field1.toUpperCase();
    document.getElementById("lblField2").innerText = formLabelsConfig.field2.toUpperCase();
    document.getElementById("overlay").classList.add("show");
}
function closeModal() { document.getElementById("overlay").classList.remove("show"); }

function commitPocketEntry() {
    const v1 = document.getElementById("valField1").value.trim();
    const v2 = document.getElementById("valField2").value.trim();

    if (!v1 || !v2) return alert("Please specify parameter values inside both active form inputs.");

    const options = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
    const timestampStr = new Date().toLocaleDateString('en-US', options);

    logRecords.unshift({ id: Date.now(), val1: v1, val2: v2, time: timestampStr });
    saveAndRender();
    closeModal();

    // Clean inputs placeholders values variables back to defaults configurations rules
    document.getElementById("valField1").value = "";
    document.getElementById("valField2").value = "";
}

function removePocketRecord(id) {
    logRecords = logRecords.filter(r => r.id !== id);
    saveAndRender();
}

function saveAndRender() {
    localStorage.setItem("form_pocket_records", JSON.stringify(logRecords));
    render();
}

function render() {
    const container = document.getElementById("formsSubmissionContainer");
    document.getElementById("formsCountSpan").innerText = logRecords.length + " records";

    if (logRecords.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📁</div>
                <h3>Form Logs Empty</h3>
                <p>Tap the action cross switch button below to submit your first form row data block.</p>
            </div>`;
        return;
    }

    container.innerHTML = logRecords.map(r => `
        <div class="entry-card">
            <div class="entry-row-grid">
                <div class="entry-node">
                    <span class="entry-label">${formLabelsConfig.field1}</span>
                    <span class="entry-value">${r.val1}</span>
                </div>
                <div class="entry-node">
                    <span class="entry-label">${formLabelsConfig.field2}</span>
                    <span class="entry-value">${r.val2}</span>
                </div>
            </div>
            <div class="entry-footer">
                <span class="entry-time">${r.time}</span>
                <button class="btn-remove-entry" onclick="removePocketRecord(${r.id})">Wipe</button>
            </div>
        </div>
    `).join("");
}

// Draw content metrics setup structural loops elements immediately on application boot setup
render();
</script>

</body>
</html>
