<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pantrykeeper</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f7f5;
    color: #2d3748;
}

.app {
    max-width: 420px;
    min-height: 100vh;
    margin: auto;
    padding-bottom: 90px;
}

/* Header */
.header {
    padding: 27px 20px 23px;
    background: linear-gradient(135deg, #0d9488, #0f766e);
    color: white;
    border-radius: 0 0 30px 30px;
}

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: 800;
}

.count {
    background: rgba(255,255,255,.2);
    padding: 7px 11px;
    border-radius: 20px;
    font-size: 12px;
}

.header h1 {
    margin: 28px 0 5px;
    font-size: 29px;
}

.header p {
    margin: 0;
    opacity: .85;
}

/* Content */
.content {
    padding: 20px;
}

/* Search */
.search {
    position: relative;
}

.search input {
    width: 100%;
    padding: 16px 18px 16px 46px;
    border: none;
    border-radius: 17px;
    background: white;
    box-shadow: 0 6px 20px rgba(13,148,136,.05);
    outline: none;
    font-size: 14px;
}

.search-icon {
    position: absolute;
    left: 17px;
    top: 15px;
    color: #a0aec0;
}

/* Filter Tags */
.filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 15px 0 4px;
}

.filter {
    white-space: nowrap;
    border: 0;
    padding: 10px 14px;
    border-radius: 13px;
    background: white;
    cursor: pointer;
    font-size: 13px;
    color: #4a5568;
}

.filter.active {
    background: #0d9488;
    color: white;
}

/* Pantry Item Card */
.item {
    background: white;
    border-radius: 21px;
    padding: 17px;
    margin-top: 12px;
    box-shadow: 0 6px 20px rgba(13,148,136,.04);
}

.item-top {
    display: flex;
    align-items: center;
    gap: 13px;
}

.item-icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    background: #ccfbf1;
    border-radius: 15px;
    font-size: 24px;
}

.item-info {
    flex: 1;
}

.item-info strong {
    display: block;
    font-size: 16px;
}

.item-info small {
    color: #a0aec0;
    font-size: 11px;
}

.status-btn {
    border: 0;
    background: none;
    font-size: 21px;
    cursor: pointer;
}

.details {
    margin-top: 13px;
    padding: 13px;
    background: #f0fdfa;
    border-radius: 13px;
    font-size: 14px;
    border-left: 3px solid #0d9488;
}

.details span {
    color: #718096;
    font-size: 11px;
    display: block;
    margin-bottom: 4px;
}

.item-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.item-actions button {
    flex: 1;
    border: 0;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 13px;
}

.edit {
    background: #ccfbf1;
    color: #0f766e;
}

.delete {
    background: #fee2e2;
    color: #ef4444;
}

/* Floating Action Button */
.add {
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 60px;
    height: 60px;
    border: 0;
    border-radius: 20px;
    background: #0d9488;
    color: white;
    font-size: 30px;
    box-shadow: 0 10px 25px rgba(13,148,136,.35);
    cursor: pointer;
}

/* Modal Bottom Sheet */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 1000;
}

.overlay.show {
    display: flex;
}

.modal {
    width: min(420px,100%);
    background: white;
    padding: 24px 20px 30px;
    border-radius: 28px 28px 0 0;
}

.modal h2 {
    margin-top: 0;
    font-size: 20px;
}

.modal input,
.modal select {
    width: 100%;
    padding: 14px;
    border: 1px solid #e2e8f0;
    border-radius: 13px;
    margin-bottom: 10px;
    outline: none;
}

.save {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 14px;
    background: #0d9488;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.cancel {
    width: 100%;
    border: 0;
    background: transparent;
    padding: 14px;
    color: #718096;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="app">

    <!-- Header Block -->
    <header class="header">
        <div class="header-top">
            <div class="logo">🍏 pantrykeeper</div>
            <div class="count" id="count">0 low stock</div>
        </div>
        <h1>Stock smart.</h1>
        <p>Monitor your ingredients and shopping essentials.</p>
    </header>

    <main class="content">
        <!-- Search -->
        <div class="search">
            <span class="search-icon">🔍</span>
            <input id="search" type="text" placeholder="Search ingredient or item..." oninput="renderPantry()">
        </div>

        <!-- Category Filters -->
        <div class="filters">
            <button class="filter active" onclick="setFilter('All', this)">All</button>
            <button class="filter" onclick="setFilter('Low Stock', this)">⚠️ Low Stock</button>
            <button class="filter" onclick="setFilter('Groceries', this)">🛒 Groceries</button>
            <button class="filter" onclick="setFilter('Spices', this)">🌶️ Spices</button>
            <button class="filter" onclick="setFilter('Snacks', this)">🍿 Snacks</button>
        </div>

        <!-- Render Target Grid -->
        <section id="pantryList"></section>
    </main>

</div>

<!-- Floating Action Button -->
<button class="add" onclick="openModal()">+</button>

<!-- Slide Up Form Sheet -->
<div class="overlay" id="overlay">
    <div class="modal">
        <h2 id="modalTitle">Track Pantry Item</h2>
        <input id="pantryName" type="text" placeholder="Item Name (e.g. Basmati Rice)">
        <input id="pantryStock" type="text" placeholder="Quantity/Stock Level (e.g. 2 kg remaining)">
        <select id="pantryCategory">
            <option value="Groceries">🛒 Groceries</option>
            <option value="Spices">🌶️ Spices</option>
            <option value="Snacks">🍿 Snacks</option>
        </select>
        <button class="save" onclick="savePantryItem()">Save Item</button>
        <button class="cancel" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
/*
    pantrykeeper
    App 55 - Kitchen Ingredient Memory Log
*/

const defaultPantry = [
    {
        id: 1,
        name: "Full Cream Milk",
        stock: "1 Litre left (Need to buy soon)",
        category: "Groceries",
        lowStock: true,
        date: "Today"
    },
    {
        id: 2,
        name: "Black Pepper",
        stock: "Fully stocked box",
        category: "Spices",
        lowStock: false,
        date: "Yesterday"
    }
];

let pantryItems = JSON.parse(localStorage.getItem("pantrykeeper_data")) || defaultPantry;
let activeFilter = "All";
let editingId = null;

function saveData() {
    localStorage.setItem("pantrykeeper_data", JSON.stringify(pantryItems));
}

function getIcon(category) {
    if (category === "Groceries") return "🛒";
    if (category === "Spices") return "🌶️";
    if (category === "Snacks") return "🍿";
    return "🍏";
}

function renderPantry() {
    const container = document.getElementById("pantryList");
    const query = document.getElementById("search").value.toLowerCase();
    
    let filtered = pantryItems.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(query) || 
                              item.stock.toLowerCase().includes(query);
        const matchesFilter = activeFilter === "All" || 
                              (activeFilter === "Low Stock" && item.lowStock) || 
                              item.category === activeFilter;
        return matchesSearch && matchesFilter;
    });

    const alertCount = pantryItems.filter(i => i.lowStock).length;
    document.getElementById("count").innerText = `${alertCount} low stock`;

    container.innerHTML = "";

    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="empty" style="text-align:center; padding:65px 20px; color:#a0aec0;">
                <div style="font-size:55px;">🪵</div>
                <p>No item matches this shelf view.</p>
            </div>`;
        return;
    }

    filtered.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
            <div class="item-top">
                <div class="item-icon">${getIcon(item.category)}</div>
                <div class="item-info">
                    <strong>${item.name}</strong>
                    <small>${item.category} • ${item.date}</small>
                </div>
                <button class="status-btn" onclick="toggleStockAlert(${item.id})">
                    ${item.lowStock ? "⚠️" : "✅"}
                </button>
            </div>
            <div class="details">
                <span>📊 STOCK QUANTITY STATUS</span>
                ${item.stock}
            </div>
            <div class="item-actions">
                <button class="edit" onclick="editPantryItem(${item.id})">Modify</button>
                <button class="delete" onclick="deletePantryItem(${item.id})">Remove</button>
            </div>
        `;
        container.appendChild(div);
    });
}

function setFilter(category, button) {
    activeFilter = category;
    document.querySelectorAll(".filter").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    renderPantry();
}

function toggleStockAlert(id) {
    pantryItems = pantryItems.map(i => i.id === id ? { ...i, lowStock: !i.lowStock } : i);
    saveData();
    renderPantry();
}

function deletePantryItem(id) {
    if (confirm("Remove this entry from the kitchen register?")) {
        pantryItems = pantryItems.filter(i => i.id !== id);
        saveData();
        renderPantry();
    }
}

function openModal() {
    editingId = null;
document.getElementById("modalTitle").innerText = "Track Pantry Item";document.getElementById("pantryName").value = "";document.getElementById("pantryStock").value = "";document.getElementById("pantryCategory").value = "Groceries";document.getElementById("overlay").classList.add("show");}function closeModal() {document.getElementById("overlay").classList.remove("show");}function editPantryItem(id) {const item = pantryItems.find(i => i.id === id);if (!item) return;editingId = id;document.getElementById("modalTitle").innerText = "Update Shelf Info";document.getElementById("pantryName").value = item.name;document.getElementById("pantryStock").value = item.stock;document.getElementById("pantryCategory").value = item.category;document.getElementById("overlay").classList.add("show");}function savePantryItem() {const name = document.getElementById("pantryName").value.trim();const stock = document.getElementById("pantryStock").value.trim();const category = document.getElementById("pantryCategory").value;if (!name || !stock) {alert("Please map both the ingredient name and its stock capacity.");return;}if (editingId !== null) {pantryItems = pantryItems.map(i => i.id === editingId ? { ...i, name, stock, category } : i);} else {const newItem = {id: Date.now(),name,stock,category,lowStock: false,date: "Today"};pantryItems.unshift(newItem);}saveData();closeModal();renderPantry();}renderPantry();</script></body></html>
