<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RemindMe</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f7fb;
    color: #292936;
}

.app {
    max-width: 420px;
    min-height: 100vh;
    margin: auto;
    padding-bottom: 100px;
}

/* HEADER */

.header {
    padding: 28px 20px 32px;
    color: white;
    background: linear-gradient(135deg, #ef4444, #f97316);
    border-radius: 0 0 32px 32px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.date {
    padding: 8px 11px;
    border-radius: 20px;
    background: rgba(255,255,255,.18);
    font-size: 10px;
}

.header h1 {
    margin: 28px 0 5px;
    font-size: 30px;
}

.header p {
    margin: 0;
    opacity: .85;
}

/* CONTENT */

.content {
    padding: 20px;
}

/* SEARCH */

.search {
    position: relative;
}

.search span {
    position: absolute;
    left: 15px;
    top: 13px;
}

.search input {
    width: 100%;
    padding: 15px 15px 15px 42px;
    border: 0;
    border-radius: 16px;
    outline: none;
    background: white;
    box-shadow: 0 5px 15px rgba(30,30,50,.06);
}

/* FILTERS */

.filters {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 15px 0 4px;
}

.filter {
    border: 0;
    white-space: nowrap;
    padding: 9px 13px;
    border-radius: 12px;
    background: white;
    color: #858591;
    cursor: pointer;
}

.filter.active {
    color: white;
    background: #ef4444;
}

/* REMINDER */

.reminder {
    margin-top: 11px;
    padding: 15px;
    background: white;
    border-radius: 19px;
    box-shadow: 0 5px 18px rgba(30,30,50,.06);
}

.reminder-top {
    display: flex;
    gap: 12px;
    align-items: flex-start;
}

.check {
    width: 25px;
    height: 25px;
    flex-shrink: 0;
    border: 2px solid #dddde5;
    border-radius: 8px;
    background: white;
    cursor: pointer;
}

.check.done {
    background: #ef4444;
    border-color: #ef4444;
    color: white;
}

.info {
    flex: 1;
    min-width: 0;
}

.title {
    font-size: 15px;
    font-weight: bold;
}

.done .title {
    text-decoration: line-through;
    color: #aaaab2;
}

.when {
    margin-top: 6px;
    color: #777784;
    font-size: 11px;
}

.countdown {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 8px;
    border-radius: 8px;
    background: #fff1ef;
    color: #e64a42;
    font-size: 9px;
    font-weight: bold;
}

.priority {
    display: inline-block;
    margin-top: 8px;
    margin-left: 4px;
    padding: 5px 8px;
    border-radius: 8px;
    font-size: 9px;
}

.high {
    background: #fff0ef;
    color: #e34b42;
}

.medium {
    background: #fff7df;
    color: #b78116;
}

.low {
    background: #eef8ff;
    color: #397eaf;
}

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 5px;
    margin-top: 12px;
}

.actions button {
    border: 0;
    background: #f7f7fa;
    padding: 7px 9px;
    border-radius: 9px;
    cursor: pointer;
}

/* EMPTY */

.empty {
    padding: 50px 20px;
    text-align: center;
    color: #8c8c98;
}

.empty-icon {
    font-size: 48px;
}

/* ADD */

.add {
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 60px;
    height: 60px;
    border: 0;
    border-radius: 20px;
    background: #ef4444;
    color: white;
    font-size: 30px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(239,68,68,.3);
}

/* MODAL */

.overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0,0,0,.45);
}

.overlay.show {
    display: flex;
}

.modal {
    width: min(420px,100%);
    max-height: 92vh;
    overflow-y: auto;
    padding: 24px 20px 30px;
    background: white;
    border-radius: 28px 28px 0 0;
}

.modal h2 {
    margin-top: 0;
}

.modal input,
.modal select {
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid #dddde5;
    border-radius: 13px;
    outline: none;
    font-family: inherit;
    background: white;
}

.row {
    display: flex;
    gap: 8px;
}

.row > * {
    flex: 1;
}

.save {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 14px;
    background: #ef4444;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.cancel {
    width: 100%;
    padding: 14px;
    border: 0;
    background: transparent;
    color: #777784;
}

.notification-note {
    margin: 3px 0 12px;
    padding: 10px;
    border-radius: 10px;
    background: #fff7ed;
    color: #9a6515;
    font-size: 10px;
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="top">

            <div class="logo">
                🔔 RemindMe
            </div>

            <div class="date" id="date">
                Today
            </div>

        </div>

        <h1>
            Don't forget.
        </h1>

        <p>
            Put it down. We'll keep track.
        </p>

    </header>


    <main class="content">

        <div class="search">

            <span>🔍</span>

            <input
                id="search"
                type="text"
                placeholder="Search reminders..."
                oninput="render()"
            >

        </div>


        <div class="filters">

            <button
                class="filter active"
                onclick="setFilter('all',this)"
            >
                All
            </button>

            <button
                class="filter"
                onclick="setFilter('today',this)"
            >
                📅 Today
            </button>

            <button
                class="filter"
                onclick="setFilter('important',this)"
            >
                🔥 Important
            </button>

            <button
                class="filter"
                onclick="setFilter('done',this)"
            >
                ✅ Done
            </button>

        </div>


        <section id="reminders"></section>

    </main>

</div>


<button
    class="add"
    onclick="openModal()"
>
    +
</button>


<!-- MODAL -->

<div
    class="overlay"
    id="overlay"
>

    <div class="modal">

        <h2 id="modalTitle">
            Add Reminder
        </h2>

        <input
            id="title"
            type="text"
            placeholder="What should you remember?"
        >

        <div class="notification-note">
            🔔 Browser notifications work when this page
            has notification permission and remains open.
        </div>

        <div class="row">

            <input
                id="dateInput"
                type="date"
            >

            <input
                id="timeInput"
                type="time"
            >

        </div>

        <div class="row">

            <select id="priority">

                <option value="high">
                    🔴 High
                </option>

                <option value="medium" selected>
                    🟡 Medium
                </option>

                <option value="low">
                    🔵 Low
                </option>

            </select>

            <select id="category">

                <option value="personal">
                    👤 Personal
                </option>

                <option value="work">
                    💼 Work
                </option>

                <option value="health">
                    ❤️ Health
                </option>

                <option value="other">
                    ✨ Other
                </option>

            </select>

        </div>

        <button
            class="save"
            onclick="saveReminder()"
        >
            Save Reminder
        </button>

        <button
            class="cancel"
            onclick="closeModal()"
        >
            Cancel
        </button>

    </div>

</div>


<script>

/*
    RemindMe
    Simple reminder application
*/


let reminders =
    JSON.parse(
        localStorage.getItem("remindMeData")
    ) || [];

let activeFilter =
    "all";

let editingId =
    null;


/* SAVE */

function saveData() {

    localStorage.setItem(
        "remindMeData",
        JSON.stringify(reminders)
    );

}


/* TODAY */

function todayKey() {

    return new Date()
        .toISOString()
        .split("T")[0];

}


/* FILTER */

function setFilter(filter, button) {

    activeFilter =
        filter;

    document
        .querySelectorAll(".filter")
        .forEach(
            btn =>
                btn.classList.remove("active")
        );

    button.classList.add("active");

    render();

}


/* RENDER */

function render() {

    const container =
        document.getElementById(
            "reminders"
        );

    const query =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    let filtered =
        reminders.filter(reminder => {

            const matchesSearch =
                reminder.title
                    .toLowerCase()
                    .includes(query);

            if (!matchesSearch) {
                return false;
            }

            if (
                activeFilter === "today"
            ) {
                return (
                    reminder.date ===
                    todayKey()
                );
            }

            if (
                activeFilter === "important"
            ) {
                return (
                    reminder.priority ===
                    "high" &&
                    !reminder.done
                );
            }

            if (
                activeFilter === "done"
            ) {
                return reminder.done;
            }

            return true;

        });


    filtered.sort(
        (a,b) => {

            if (a.done !== b.done) {
                return a.done ? 1 : -1;
            }

            return (
                getDateTime(a) -
                getDateTime(b)
            );

        }
    );


    if (filtered.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔔
                </div>

                <h3>
                    No reminders
                </h3>

                <p>
                    Tap + to create one.
                </p>

            </div>

        `;

        return;
    }


    container.innerHTML =
        filtered
            .map(reminder => {

                const countdown =
                    getCountdown(reminder);


                return `

                    <article
                        class="reminder ${
                            reminder.done
                                ? "done"
                                : ""
                        }"
                    >

                        <div class="reminder-top">

                            <button
                                class="check ${
                                    reminder.done
                                        ? "done"
                                        : ""
                                }"
                                onclick="toggleReminder(${reminder.id})"
                            >
                                ${
                                    reminder.done
                                        ? "✓"
                                        : ""
                                }
                            </button>


                            <div class="info">

                                <div class="title">
                                    ${escapeHTML(
                                        reminder.title
                                    )}
                                </div>

                                <div class="when">
                                    📅 ${formatDate(
                                        reminder.date
                                    )}
                                    ${
                                        reminder.time
                                            ? " · 🕐 " +
                                              reminder.time
                                            : ""
                                    }
                                </div>

                                ${
                                    !reminder.done &&
                                    countdown
                                        ?
                                        `<span class="countdown">
                                            ${countdown}
                                        </span>`
                                        :
                                        ""
                                }

                                <span
                                    class="priority ${
                                        reminder.priority
                                    }"
                                >
                                    ${reminder.priority}
                                </span>

                            </div>

                        </div>


                        <div class="actions">

                            <button
                                onclick="editReminder(${reminder.id})"
                            >
                                ✏️ Edit
                            </button>

                            <button
                                onclick="deleteReminder(${reminder.id})"
                            >
                                🗑️ Delete
                            </button>

                        </div>

                    </article>

                `;

            })
            .join("");

}


/* DATE OBJECT */

function getDateTime(reminder) {

    if (!reminder.date) {
        return new Date(8640000000000000);
    }

    return new Date(
        reminder.date +
        "T" +
        (reminder.time || "23:59")
    );

}


/* COUNTDOWN */

function getCountdown(reminder) {

    if (!reminder.date) {
        return "";
    }

    const target =
        getDateTime(reminder);

    const now =
        new Date();

    const diff =
        target - now;


    if (diff < 0) {

        return "⏰ Overdue";

    }


    const minutes =
        Math.floor(
            diff / 60000
        );


    const days =
        Math.floor(
            minutes / 1440
        );


    const hours =
        Math.floor(
            (minutes % 1440) / 60
        );


    const mins =
        minutes % 60;


    if (days > 0) {
        return "⏳ " + days + "d " + hours + "h";
    }

    if (hours > 0) {
        return "⏳ " + hours + "h " + mins + "m";
    }

    return "⏳ " + mins + " min";

}


/* FORMAT DATE */

function formatDate(date) {

    if (!date) {
        return "No date";
    }

    return new Date(date)
        .toLocaleDateString(
            undefined,
            {
                month: "short",
                day: "numeric",
                year: "numeric"
            }
        );

}


/* OPEN */

function openModal() {

    editingId =
        null;


    document.getElementById("modalTitle")
        .innerText =
        "Add Reminder";


    document.getElementById("title")
        .value =
        "";

    document.getElementById("dateInput")
        .value =
        todayKey();

    document.getElementById("timeInput")
        .value =
        "";

    document.getElementById("priority")
        .value =
        "medium";

    document.getElementById("category")
        .value =
        "personal";


    document.getElementById("overlay")
        .classList.add("show");


    document.getElementById("title")
        .focus();

}


/* CLOSE */

function closeModal() {

    document.getElementById("overlay")
        .classList.remove("show");

}


/* SAVE REMINDER */

function saveReminder() {

    const title =
        document.getElementById("title")
            .value
            .trim();

    const date =
        document.getElementById("dateInput")
            .value;

    const time =
        document.getElementById("timeInput")
            .value;

    const priority =
        document.getElementById("priority")
            .value;

    const category =
        document.getElementById("category")
            .value;


    if (!title) {

        alert(
            "Please enter a reminder."
        );

        return;

    }


    if (!date) {

        alert(
            "Please choose a date."
        );

        return;

    }


    if (editingId !== null) {

        const reminder =
            reminders.find(
                r => r.id === editingId
            );


        if (reminder) {

            reminder.title =
                title;

            reminder.date =
                date;

            reminder.time =
                time;

            reminder.priority =
                priority;

            reminder.category =
                category;

        }

    } else {

        reminders.push({

            id: Date.now(),

            title: title,

            date: date,

            time: time,

            priority: priority,

            category: category,

            done: false,

            notified: false

        });

    }


    saveData();

    closeModal();

    render();

    requestNotifications();

}


/* TOGGLE */

function toggleReminder(id) {

    const reminder =
        reminders.find(
            r => r.id === id
        );


    if (!reminder) {
        return;
    }


    reminder.done =
        !reminder.done;


    saveData();

    render();

}


/* EDIT */

function editReminder(id) {

    const reminder =
        reminders.find(
            r => r.id === id
        );


    if (!reminder) {
        return;
    }


    editingId =
        id;


    document.getElementById("modalTitle")
        .innerText =
        "Edit Reminder";


    document.getElementById("title")
        .value =
        reminder.title;

    document.getElementById("dateInput")
        .value =
        reminder.date;

    document.getElementById("timeInput")
        .value =
        reminder.time || "";

    document.getElementById("priority")
        .value =
        reminder.priority;

    document.getElementById("category")
        .value =
        reminder.category;


    document.getElementById("overlay")
        .classList.add("show");

}


/* DELETE */

function deleteReminder(id) {

    const reminder =
        reminders.find(
            r => r.id === id
        );


    if (!reminder) {
        return;
    }


    if (
        !confirm(
            'Delete "' +
            reminder.title +
            '"?'
        )
    ) {
        return;
    }


    reminders =
        reminders.filter(
            r => r.id !== id
        );


    saveData();

    render();

}


/* NOTIFICATIONS */

function requestNotifications() {

    if (
        "Notification" in window &&
        Notification.permission === "default"
    ) {

        Notification.requestPermission();

    }

}


/* CHECK REMINDERS */

function checkNotifications() {

    if (
        !("Notification" in window) ||
        Notification.permission !== "granted"
    ) {
        return;
    }


    const now =
        new Date();


    let changed =
        false;


    reminders.forEach(reminder => {

        if (
            reminder.done ||
            reminder.notified ||
            !reminder.date ||
            !reminder.time
        ) {
            return;
        }


        const target =
            getDateTime(reminder);


        const difference =
            target - now;


        /*
            Notify when the reminder
            time arrives, within
            a 60-second window.
        */

        if (
            difference <= 0 &&
            difference > -60000
        ) {

            new Notification(
                "🔔 RemindMe",
                {
                    body:
                        reminder.title
                }
            );


            reminder.notified =
                true;

            changed =
                true;

        }

    });


    if (changed) {

        saveData();

        render();

    }

}


/* ESCAPE */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* OUTSIDE MODAL */

document
    .getElementById("overlay")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {
                closeModal();
            }

        }
    );


/* DATE */

document
    .getElementById("date")
    .innerText =
    new Date()
        .toLocaleDateString(
            undefined,
            {
                month: "short",
                day: "numeric"
            }
        );


/* START */

render();

requestNotifications();

setInterval(
    function() {

        render();

        checkNotifications();

    },
    30000
);

</script>

</body>
</html>
