<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#8b5cf6">
<title>TypingRun Speed Trainer</title>

<style>
/* BRAND NEW CSS PALETTE: Cyber Onyx & Laser Purple Glow Arcade Look */
:root{
--bg:#090614;
--card:#110e26;
--text:#f5f3ff;
--muted:#c084fc;
--line:#2e1f66;
--primary:#8b5cf6;
--primary2:#a78bfa;
--soft:#2e1554;
--soft-glow:rgba(139,92,246,0.25);
--green:#10b981;
--danger:#ef4444;
--shadow:0 12px 35px rgba(139,92,246,0.15)
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text);
user-select:none
}

button,input,textarea{font:inherit}
button{cursor:pointer}

.app{
width:100%;
max-width:430px;
min-height:100vh;
margin:auto;
overflow:hidden
}

/* HEADER - SPEEDWAY ACCENT RUN GRADIENT */
.header{
position:relative;
padding:21px 18px 31px;
color:white;
background:linear-gradient(145deg,#110e26,#090614 65%,#581c87);
border-radius:0 0 31px 31px;
overflow:hidden;
border-bottom:3px solid var(--primary)
}

.header:before{
content:"";
position:absolute;
width:190px;
height:190px;
right:-90px;
top:-105px;
border-radius:50%;
background:rgba(167,139,250,.06);
border:1px dashed var(--primary)
}

.topbar{
position:relative;
z-index:2;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:9px
}

.brand-icon{
width:41px;
height:41px;
display:grid;
place-items:center;
border-radius:13px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.15);
font-size:22px
}

.brand-name{
font-size:21px;
font-weight:900;
letter-spacing:-.5px
}

.theme{
width:40px;
height:40px;
border:0;
border-radius:13px;
background:rgba(255,255,255,.05);
color:#fff
}

.hero{
position:relative;
z-index:2;
margin-top:25px
}

.hero h1{
margin:0;
font-size:30px;
line-height:1.08;
letter-spacing:-.8px
}

.hero p{
margin:8px 0 0;
font-size:13px;
color:rgba(255,255,255,.7)
}

/* CONTENT CONTAINER */
.content{padding:18px}

.card{
padding:17px;
margin-bottom:14px;
background:var(--card);
border:1px solid var(--line);
border-radius:21px;
box-shadow:var(--shadow)
}

.title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px
}

.title h2{
margin:0;
font-size:14px;
text-transform:uppercase;
font-weight:800;
letter-spacing:0.5px;
color:var(--muted)
}

/* ARCADE METRICS MONITOR SPREAD GRID */
.stats-split-row {
display:grid;
grid-template-columns:repeat(3, 1fr);
gap:8px;
margin-bottom:4px
}

.stat-node-box {
padding:12px 4px;
background:var(--bg);
border:1px solid var(--line);
border-radius:14px;
text-align:center
}

.stat-node-box strong {
display:block;
font-size:20px;
color:var(--primary2);
font-family:"Courier New",Courier,monospace
}

.stat-node-box span {
display:block;
margin-top:3px;
font-size:8.5px;
color:var(--muted);
text-transform:uppercase;
font-weight:750
}

/* SENTENCE PROMPT PANEL AREA */
.prompt-panel {
padding:16px;
background:var(--bg);
border:1px solid var(--line);
border-radius:14px;
font-size:16px;
line-height:1.5;
font-weight:700;
letter-spacing:0.3px;
color:var(--text);
text-shadow:0 0 10px rgba(139,92,246,0.1)
}

/* INPUT FORM INTERFACE FIELD */
.field{
margin-bottom:14px;
display:flex;
flex-direction:column;
gap:6px
}

.field label{
font-size:11px;
font-weight:750;
color:var(--muted);
text-transform:uppercase;
letter-spacing:0.5px
}

.field textarea{
width:100%;
height:90px;
padding:13px;
border:1px solid var(--line);
border-radius:12px;
outline:none;
background:var(--bg);
color:var(--text);
font-weight:700;
font-size:15px;
line-height:1.5;
resize:none
}
.field textarea:focus{
border-color:var(--primary);
box-shadow:0 0 12px var(--soft-glow)
}

.btn-trigger-action {
width:100%;
padding:14px;
border:0;
border-radius:14px;
background:var(--primary);
color:var(--bg);
font-weight:950;
font-size:15px;
text-transform:uppercase;
transition:opacity 0.2s
}
.btn-trigger-action:active { opacity:0.9 }

/* LIGHT OVERRIDE SKIN STYLE */
body.light-theme {
--bg:#faf5ff;
--card:#ffffff;
--text:#110e26;
--muted:#8b5cf6;
--line:#e9d5ff;
--shadow:0 10px 25px rgba(139,92,246,0.04)
}
</style>
</head>head>

<body>

<div class="app">

<header class="header">
<div class="topbar">
<div class="brand">
<div class="brand-icon">⌨️</div>
<div class="brand-name">TypingRun</div>
</div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">☀️</button>
</div>

<div class="hero">
<h1>Speed Run.<br>Reflex Matrix.</h1>
<p>Evaluate precise words-per-minute velocities and letter string accuracy counts locally.</p>
</div>
</header>

<main class="content">

<!-- ROUND ARCADE STATISTICS CARD -->
<section class="card">
<div class="stats-split-row">
<div class="stat-node-box">
<strong id="lblSpeedWpm">0</strong>
<span>WPM Rate</span>
</div>
<div class="stat-node-box">
<strong id="lblAccuracyPercent">100%</strong>
<span>Accuracy</span>
</div>
<div class="stat-node-box">
<strong id="lblRecordHighWpm">0</strong>
<span>High WPM</span>
</div>
</div>
</section>

<!-- STRING TARGET PROMPT DISPLAY CELL -->
<section class="card">
<div class="title">
<h2>📝 Target Copy Phrase</h2>
</div>
<div id="lblActivePromptPhrase" class="prompt-panel">Click Launch Challenge below to populate text.</div>
</section>

<!-- RESPONSE ENTRY INTERFACE CAPTURE FIELD -->
<section class="card">
<div class="field">
<label>Type the phrase match exactly</label>
<textarea id="txtPlayerWorkspace" placeholder="Awaiting challenge initiation..." disabled oninput="processLiveTypingAnalysis()"></textarea>
</div>
<button id="masterGameBtn" class="btn-trigger-action" onclick="toggleChallengeTrackingState()">Launch Challenge</button>
</section>

</main>

</div>

<script>
const challengePhrasesDatabase = [
    "Clean code architecture scales smoothly over localized runtime sandboxes.",
    "Bespoke style themes introduce distinctive identity variations across platforms.",
    "Hardware accelerated audio contexts synthesize clean wave frequencies on tap.",
    "Dynamic web modules leverage browser storage guidelines to log indices metrics."
];

let challengeStartTimeStamp = null;
let activeTargetPhraseString = "";
let challengeActiveState = false;

let highWpmRecordValue = parseFloat(localStorage.getItem("typing_run_high_wpm")) || 0;

function toggleTheme() {
    document.body.classList.toggle("light-theme");
    const btn = document.getElementById("themeBtn");
    btn.innerText = document.body.classList.contains("light-theme") ? "🌙" : "☀️";
}

function toggleChallengeTrackingState() {
    const btn = document.getElementById("masterGameBtn");
    const workspace = document.getElementById("txtPlayerWorkspace");

    if (challengeActiveState) {
        terminateChallengeSession(true);
    } else {
        // Launch Session Tracks
        challengeActiveState = true;
        btn.innerText = "Abort Run";
        btn.style.background = "#ef4444";
        btn.style.color = "white";

        const randomIdx = Math.floor(Math.random() * challengePhrasesDatabase.length);
        activeTargetPhraseString = challengePhrasesDatabase[randomIdx];
        
        document.getElementById("lblActivePromptPhrase").innerText = activeTargetPhraseString;
        workspace.value = "";
        workspace.disabled = false;
        workspace.placeholder = "Begin typing matched strings now...";
        workspace.focus();

        challengeStartTimeStamp = performance.now();
        triggerArcadeBeepChime(587, 0.06);
    }
}

function processLiveTypingAnalysis() {
    if (!challengeActiveState) return;

    const currentInputStr = document.getElementById("txtPlayerWorkspace").value;
    const promptLen = activeTargetPhraseString.length;
    
    // Compute letter mismatch errors metrics array counters
    let errorCharactersCount = 0;
    const currentInputLen = currentInputStr.length;
    
    for (let i = 0; i < currentInputLen; i++) {
        if (currentInputStr[i] !== activeTargetPhraseString[i]) {
            errorCharactersCount++;
        }
    }

    const accuracyScoreInt = currentInputLen > 0 ? 
        Math.max(0, Math.round(((currentInputLen - errorCharactersCount) / currentInputLen) * 100)) : 100;
        
    document.getElementById("lblAccuracyPercent").innerText = `${accuracyScoreInt}%`;

    // Compute live standard speed quotients: ((Chars / 5) / Minutes passed)
    const elapsedSeconds = (performance.now() - challengeStartTimeStamp) / 1000;
    if (elapsedSeconds > 0.5) {
        const liveWpmRate = Math.round((currentInputLen / 5) / (elapsedSeconds / 60));
        document.getElementById("lblSpeedWpm").innerText = liveWpmRate;
    }

    // Intercept full statement length completion parameters maps
    if (currentInputStr === activeTargetPhraseString) {
        terminateChallengeSession(false);
    }
}

function terminateChallengeSession(wasAborted) {
    challengeActiveState = false;
    
    const btn = document.getElementById("masterGameBtn");
    const workspace = document.getElementById("txtPlayerWorkspace");

    btn.innerText = "Launch Challenge";
    btn.style.background = "var(--primary)";
    btn.style.color = "var(--bg)";
    workspace.disabled = true;
    workspace.placeholder = "Awaiting challenge initiation...";

    if (!wasAborted) {
        const elapsedSeconds = (performance.now() - challengeStartTimeStamp) / 1000;
        const finalizedWpmScore = Math.round((activeTargetPhraseString.length / 5) / (elapsedSeconds / 60));
        
        document.getElementById("lblSpeedWpm").innerText = finalizedWpmScore;
        triggerArcadeBeepChime(880, 0.2); // Victory arpeggio chime note

        if (finalizedWpmScore > highWpmRecordValue) {
            highWpmRecordValue = finalizedWpmScore;
            localStorage.setItem("typing_run_high_wpm", highWpmRecordValue);
            alert(`🎉 UNBELIEVABLE SPEED! New high record locked down: ${highWpmRecordValue} WPM.`);
        } else {
alert(🏁 RUN COMPLETE! Speed index: ${finalizedWpmScore} WPM.);}} else {triggerArcadeBeepChime(220, 0.15);document.getElementById("lblSpeedWpm").innerText = "0";document.getElementById("lblAccuracyPercent").innerText = "100%";}document.getElementById("lblActivePromptPhrase").innerText = "Click Launch Challenge below to populate text.";synchronizeDashboardScores();}function synchronizeDashboardScores() {document.getElementById("lblRecordHighWpm").innerText = highWpmRecordValue;}function triggerArcadeBeepChime(frequencyHzValue, durationSecondsValue) {if (window.AudioContext || window.webkitAudioContext) {try {const ctx = new (window.AudioContext || window.webkitAudioContext)();const osc = ctx.createOscillator();const gain = ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type = "sine";osc.frequency.setValueAtTime(frequencyHzValue, ctx.currentTime);gain.gain.setValueAtTime(0.12, ctx.currentTime);osc.start();osc.stop(ctx.currentTime + durationSecondsValue);} catch (e) {}}}// Draw record high parameters on boot bootstrap configuration tracking fieldssynchronizeDashboardScores();</script></body></html>
