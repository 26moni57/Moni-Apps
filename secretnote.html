<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecretNote</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101217;
    color: #f5f5f7;
}

.app {
    max-width: 420px;
    min-height: 100vh;
    margin: auto;
    padding-bottom: 90px;
}

/* Header */

.header {
    padding: 28px 20px;
    background: linear-gradient(135deg, #242633, #3a3d50);
    border-radius: 0 0 30px 30px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.lock-status {
    background: rgba(255,255,255,.1);
    padding: 8px 11px;
    border-radius: 20px;
    font-size: 11px;
    color: #bfc3d0;
}

.header h1 {
    margin: 28px 0 5px;
    font-size: 30px;
}

.header p {
    margin: 0;
    color: #a5a9b7;
}

/* Content */

.content {
    padding: 20px;
}

/* Search */

.search {
    position: relative;
}

.search input {
    width: 100%;
    padding: 15px 17px 15px 43px;
    background: #191c24;
    color: white;
    border: 1px solid #292d38;
    border-radius: 16px;
    outline: none;
}

.search span {
    position: absolute;
    left: 15px;
    top: 13px;
}

/* Notes */

.note {
    background: #191c24;
    border: 1px solid #292d38;
    padding: 17px;
    margin-top: 11px;
    border-radius: 19px;
}

.note-top {
    display: flex;
    gap: 12px;
    align-items: center;
}

.note-icon {
    width: 43px;
    height: 43px;
    border-radius: 14px;
    background: #272b38;
    display: grid;
    place-items: center;
    font-size: 20px;
}

.note-info {
    flex: 1;
}

.note-title {
    font-weight: bold;
}

.note-date {
    color: #858a98;
    font-size: 10px;
    margin-top: 5px;
}

.note-text {
    color: #aeb2bd;
    font-size: 13px;
    line-height: 1.55;
    margin-top: 13px;
    white-space: pre-wrap;
    word-break: break-word;
}

.actions {
    display: flex;
    gap: 7px;
    margin-top: 13px;
}

.actions button {
    border: 0;
    background: #252934;
    color: #aeb2bd;
    padding: 8px 11px;
    border-radius: 9px;
    font-size: 10px;
    cursor: pointer;
}

/* Empty */

.empty {
    text-align: center;
    color: #777d8c;
    padding: 55px 20px;
}

.empty-icon {
    font-size: 48px;
}

/* Add */

.add {
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 60px;
    height: 60px;
    border: 0;
    border-radius: 20px;
    background: #7c6cff;
    color: white;
    font-size: 30px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(124,108,255,.35);
}

/* Modal */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    align-items: flex-end;
    justify-content: center;
}

.overlay.show {
    display: flex;
}

.modal {
    width: min(420px,100%);
    background: #191c24;
    border: 1px solid #303441;
    padding: 24px 20px 30px;
    border-radius: 28px 28px 0 0;
}

.modal h2 {
    margin-top: 0;
}

.modal input,
.modal textarea {
    width: 100%;
    background: #101217;
    color: white;
    border: 1px solid #303441;
    border-radius: 13px;
    padding: 14px;
    margin-bottom: 10px;
    outline: none;
    font-family: inherit;
}

.modal textarea {
    min-height: 140px;
    resize: vertical;
}

.save {
    width: 100%;
    border: 0;
    padding: 15px;
    border-radius: 14px;
    background: #7c6cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.cancel {
    width: 100%;
    border: 0;
    background: transparent;
    color: #858a98;
    padding: 14px;
}

/* Lock Screen */

.lock-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #101217;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.lock-box {
    width: min(360px,100%);
    text-align: center;
}

.big-lock {
    width: 90px;
    height: 90px;
    margin: auto;
    border-radius: 28px;
    display: grid;
    place-items: center;
    background: #242834;
    font-size: 43px;
}

.lock-box h1 {
    margin: 22px 0 7px;
}

.lock-box p {
    color: #858a98;
    font-size: 13px;
}

.pin {
    width: 100%;
    background: #191c24;
    color: white;
    border: 1px solid #303441;
    padding: 16px;
    border-radius: 14px;
    text-align: center;
    font-size: 22px;
    letter-spacing: 8px;
    outline: none;
    margin-top: 15px;
}

.unlock {
    width: 100%;
    margin-top: 10px;
    padding: 15px;
    border: 0;
    border-radius: 14px;
    background: #7c6cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.error {
    color: #ff7272;
    font-size: 11px;
    min-height: 17px;
    margin-top: 10px;
}

.setup {
    color: #858a98;
    font-size: 11px;
    margin-top: 22px;
}
</style>
</head>

<body>


<!-- LOCK SCREEN -->

<div
    class="lock-screen"
    id="lockScreen"
>

    <div class="lock-box">

        <div class="big-lock">
            🔐
        </div>

        <h1>
            SecretNote
        </h1>

        <p id="lockMessage">
            Enter your PIN to open your private notes.
        </p>

        <input
            class="pin"
            id="pin"
            type="password"
            inputmode="numeric"
            maxlength="6"
            placeholder="••••"
            onkeydown="handleEnter(event)"
        >

        <button
            class="unlock"
            onclick="unlock()"
        >
            Unlock
        </button>

        <div
            class="error"
            id="error"
        ></div>

        <div class="setup">
            First time? Choose a 4–6 digit PIN.
        </div>

    </div>

</div>


<!-- APP -->

<div
    class="app"
    id="app"
    style="display:none"
>

    <header class="header">

        <div class="top">

            <div class="logo">
                🔐 SecretNote
            </div>

            <div class="lock-status">
                🔒 Private
            </div>

        </div>

        <h1>
            Your private space.
        </h1>

        <p>
            Keep small secrets and personal thoughts here.
        </p>

    </header>


    <main class="content">

        <div class="search">

            <span>🔍</span>

            <input
                id="search"
                type="text"
                placeholder="Search private notes..."
                oninput="renderNotes()"
            >

        </div>


        <section id="notes"></section>

    </main>

</div>


<!-- ADD BUTTON -->

<button
    class="add"
    id="addButton"
    style="display:none"
    onclick="openModal()"
>
    +
</button>


<!-- NOTE MODAL -->

<div
    class="overlay"
    id="overlay"
>

    <div class="modal">

        <h2 id="modalTitle">
            New Secret
        </h2>

        <input
            id="title"
            type="text"
            placeholder="Note title..."
        >

        <textarea
            id="text"
            placeholder="Write your private note..."
        ></textarea>

        <button
            class="save"
            onclick="saveNote()"
        >
            Save Secret Note
        </button>

        <button
            class="cancel"
            onclick="closeModal()"
        >
            Cancel
        </button>

    </div>

</div>


<script>

/*
    SecretNote
    Local PIN protected notes.
*/


let notes =
    JSON.parse(
        localStorage.getItem("secretNotes")
    ) || [];


let editingId = null;


/* PIN */

const storedPin =
    localStorage.getItem(
        "secretNotePin"
    );


/*
    Unlock / setup
*/

function unlock() {

    const pin =
        document
            .getElementById("pin")
            .value
            .trim();


    const error =
        document.getElementById("error");


    error.innerText = "";


    if (
        pin.length < 4 ||
        pin.length > 6 ||
        !/^\d+$/.test(pin)
    ) {

        error.innerText =
            "PIN must contain 4–6 digits.";

        return;

    }


    if (!storedPin) {

        localStorage.setItem(
            "secretNotePin",
            pin
        );

        openApp();

        return;

    }


    if (pin !== storedPin) {

        error.innerText =
            "Incorrect PIN.";

        document
            .getElementById("pin")
            .value = "";

        return;

    }


    openApp();

}


/* Enter key */

function handleEnter(event) {

    if (
        event.key === "Enter"
    ) {

        unlock();

    }

}


/* Open app */

function openApp() {

    document
        .getElementById("lockScreen")
        .style.display = "none";


    document
        .getElementById("app")
        .style.display = "block";


    document
        .getElementById("addButton")
        .style.display = "block";


    renderNotes();

}


/* Render */

function renderNotes() {

    const container =
        document.getElementById("notes");


    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        notes.filter(note => {

            return (
                note.title
                    .toLowerCase()
                    .includes(search)

                ||

                note.text
                    .toLowerCase()
                    .includes(search)
            );

        });


    if (filtered.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔒
                </div>

                <h3>
                    No secret notes
                </h3>

                <p>
                    Tap + to create your first private note.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML =
        filtered.map(note => `

            <article class="note">

                <div class="note-top">

                    <div class="note-icon">
                        🔐
                    </div>

                    <div class="note-info">

                        <div class="note-title">
                            ${escapeHTML(note.title)}
                        </div>

                        <div class="note-date">
                            Private · ${formatDate(note.date)}
                        </div>

                    </div>

                </div>

                <div class="note-text">
                    ${escapeHTML(note.text)}
                </div>

                <div class="actions">

                    <button
                        onclick="editNote(${note.id})"
                    >
                        ✏️ Edit
                    </button>

                    <button
                        onclick="deleteNote(${note.id})"
                    >
                        🗑️ Delete
                    </button>

                </div>

            </article>

        `).join("");

}


/* Open modal */

function openModal() {

    editingId = null;

    document
        .getElementById("modalTitle")
        .innerText =
        "New Secret";


    document
        .getElementById("title")
        .value = "";


    document
        .getElementById("text")
        .value = "";


    document
        .getElementById("overlay")
        .classList.add("show");


    document
        .getElementById("title")
        .focus();

}


/* Close modal */

function closeModal() {

    document
        .getElementById("overlay")
        .classList.remove("show");

}


/* Save */

function saveNote() {

    const title =
        document
            .getElementById("title")
            .value
            .trim();


    const text =
        document
            .getElementById("text")
            .value
            .trim();


    if (!title || !text) {

        alert(
            "Please enter a title and note."
        );

        return;

    }


    if (editingId !== null) {

        const note =
            notes.find(
                note =>
                    note.id === editingId
            );


        if (note) {

            note.title = title;

            note.text = text;

        }

    } else {

        notes.unshift({

            id: Date.now(),

            title: title,

            text: text,

            date:
                new Date()
                    .toISOString()
                    .split("T")[0]

        });

    }


    saveData();

    closeModal();

    renderNotes();

}


/* Edit */

function editNote(id) {

    const note =
        notes.find(
            note =>
                note.id === id
        );


    if (!note) return;


    editingId = id;


    document
        .getElementById("modalTitle")
        .innerText =
        "Edit Secret";


    document
        .getElementById("title")
        .value =
        note.title;


    document
        .getElementById("text")
        .value =
        note.text;


    document
        .getElementById("overlay")
        .classList.add("show");

}


/* Delete */

function deleteNote(id) {

    const note =
        notes.find(
            note =>
                note.id === id
        );


    if (!note) return;


    if (
        !confirm(
            "Delete this secret note?"
        )
    ) {

        return;

    }


    notes =
        notes.filter(
            note =>
                note.id !== id
        );


    saveData();

    renderNotes();

}


/* Save data */

function saveData() {

    localStorage.setItem(
        "secretNotes",
        JSON.stringify(notes)
    );

}


/* Date */

function formatDate(date) {

    const today =
        new Date()
            .toISOString()
            .split("T")[0];


    if (date === today) {

        return "Today";

    }


    return new Date(date)
        .toLocaleDateString(
            undefined,
            {
                month: "short",
                day: "numeric",
                year: "numeric"
            }
        );

}


/* Escape HTML */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* Outside modal */

document
    .getElementById("overlay")
    .addEventListener(
        "click",
        function(event) {

            if (event.target === this) {

                closeModal();

            }

        }
    );

</script>

</body>
</html>
