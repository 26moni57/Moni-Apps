<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#eab308">
<title>MinesPocket Safe Matrix</title>

<style>
/* BRAND NEW CSS PALETTE: Asphalt Charcoal & Hazard Warning Yellow Industrial Look */
:root{
--bg:#18181b;
--card:#27272a;
--text:#f4f4f5;
--muted:#a1a1aa;
--line:#3f3f46;
--primary:#eab308;
--primary2:#fde047;
--soft:#3f2d04;
--green:#10b981;
--green-soft:#064e3b;
--danger:#ef4444;
--shadow:0 12px 35px rgba(234,179,8,0.06)
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text);
user-select:none
}

button,input,select{font:inherit}
button{cursor:pointer}

.app{
width:100%;
max-width:430px;
min-height:100vh;
margin:auto;
overflow:hidden
}

/* HEADER - INDUSTRIAL HAZARD CONTRAST STRIP BLOCKS GRADIENT */
.header{
position:relative;
padding:21px 18px 31px;
color:white;
background:linear-gradient(145deg,#09090b,#27272a 60%,#eab308);
border-radius:0 0 31px 31px;
overflow:hidden;
border-bottom:3px solid var(--primary)
}

.header:before{
content:"";
position:absolute;
width:190px;
height:190px;
right:-90px;
top:-105px;
border-radius:50%;
background:rgba(234,179,8,0.06);
border:1px dashed var(--primary)
}

.topbar{
position:relative;
z-index:2;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:9px
}

.brand-icon{
width:41px;
height:41px;
display:grid;
place-items:center;
border-radius:13px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.15);
font-size:20px
}

.brand-name{
font-size:21px;
font-weight:900;
letter-spacing:-.5px
}

.theme{
width:40px;
height:40px;
border:0;
border-radius:13px;
background:rgba(255,255,255,.05);
color:#fff
}

.hero{
position:relative;
z-index:2;
margin-top:25px
}

.hero h1{
margin:0;
font-size:30px;
line-height:1.08;
letter-spacing:-.8px
}

.hero p{
margin:8px 0 0;
font-size:13px;
color:rgba(255,255,255,.65)
}

/* CONTENT CONTAINER */
.content{padding:18px}

.card{
padding:17px;
margin-bottom:14px;
background:var(--card);
border:1px solid var(--line);
border-radius:21px;
box-shadow:var(--shadow)
}

.title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px
}

.title h2{
margin:0;
font-size:14px;
text-transform:uppercase;
font-weight:800;
letter-spacing:0.5px;
color:var(--muted)
}

/* OVERHEAD STATUS METRIC COUNTERS STACK */
.metrics-grid-row {
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:4px
}

.metric-node-box {
padding:11px 4px;
background:var(--bg);
border:1px solid var(--line);
border-radius:14px;
text-align:center
}

.metric-digits-lbl {
font-size:24px;
font-weight:900;
font-family:"Courier New",Courier,monospace;
color:var(--primary2)
}

.metric-txt-label {
display:block;
margin-top:3px;
font-size:9px;
color:var(--muted);
text-transform:uppercase;
font-weight:750
}

/* TACTILE MINES BOARD MATRIX GRID */
.mines-matrix-board-grid {
display:grid;
grid-template-columns:repeat(5, 1fr);
gap:8px;
margin:5px 0;
background:var(--bg);
padding:12px;
border-radius:16px;
border:1px solid var(--line)
}

.grid-cell-tile {
aspect-ratio:1;
background:var(--card);
border:1px solid var(--line);
border-radius:10px;
display:grid;
place-items:center;
font-size:16px;
font-weight:900;
color:transparent;
transition:all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
cursor:pointer
}

.grid-cell-tile:active {
transform:scale(0.93)
}

/* Dynamic revelation cell style configurations overlays mapping rules */
.grid-cell-tile.unveiled-safe {
background:var(--line);
color:var(--text);
cursor:default
}

.grid-cell-tile.unveiled-bomb {
background:var(--danger);
color:var(--bg);
border-color:var(--danger);
box-shadow:0 0 12px rgba(239,68,68,0.4);
cursor:default
}

.btn-master-action {
width:100%;
padding:14px;
border:0;
border-radius:14px;
background:var(--primary);
color:var(--bg);
font-weight:900;
font-size:15px;
text-transform:uppercase;
transition:opacity 0.2s
}
.btn-master-action:active { opacity:0.9 }

/* LIQUID AMBER LIGHT INVERSION STYLE OVERRIDE */
body.light-theme {
--bg:#fafafa;
--card:#f4f4f5;
--text:#18181b;
--muted:#71717a;
--line:#e4e4e7;
--shadow:0 10px 25px rgba(234,179,8,0.04)
}
body.light-theme .grid-cell-tile {
background:#ffffff
}
</style>
</head>

<body>

<div class="app">

<header class="header">
<div class="topbar">
<div class="brand">
<div class="brand-icon">🚧</div>
<div class="brand-name">MinesPocket</div>
</div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">☀️</button>
</div>

<div class="hero">
<h1>Mines Sweeper.<br>Detonation Shield.</h1>
<p>Deduce safe trajectory paths over a 5x5 grid matrix system and grow score vectors locally.</p>
</div>
</header>

<main class="content">

<!-- STATISTICAL PROGRESS CARD -->
<section class="card">
<div class="metrics-grid-row">
<div class="metric-node-box">
<div id="lblMinesCount" class="metric-digits-lbl">4</div>
<span class="metric-txt-label">Total Mines</span>
</div>
<div class="metric-node-box">
<div id="lblSafeScore" class="metric-digits-lbl">0 / 21</div>
<span class="metric-txt-label">Safe Fields Cleared</span>
</div>
</div>
</section>

<!-- MAIN GAME BOARD CANVAS CARD -->
<section class="card" style="padding:8px;">
<div id="minesBoardContainer" class="mines-matrix-board-grid">
<!-- Injected dynamically via Javascript loop processing logic -->
</div>
</section>

<button class="btn-master-action" onclick="initializeMinesSessionEngine()">Re-Deploy Matrix Field</button>

</main>

</div>

<script>
const MATRIX_GRID_SIZE = 5;
const TOTAL_MINES_ALLOCATED = 4;

let boardCellsArrayMatrix = [];
let bombLocationsIndexSet = new Set();
let gameActiveSessionState = true;
let totalSafeFieldsRevealedCount = 0;

function toggleTheme() {
    document.body.classList.toggle("light-theme");
    const btn = document.getElementById("themeBtn");
    btn.innerText = document.body.classList.contains("light-theme") ? "🌙" : "☀️";
}

function initializeMinesSessionEngine() {
    gameActiveSessionState = true;
    totalSafeFieldsRevealedCount = 0;
    bombLocationsIndexSet.clear();
    boardCellsArrayMatrix = [];

    document.getElementById("lblMinesCount").innerText = TOTAL_MINES_ALLOCATED;
    document.getElementById("lblSafeScore").innerText = `0 / ${MATRIX_GRID_SIZE * MATRIX_GRID_SIZE - TOTAL_MINES_ALLOCATED}`;

    // Step 1: Compute randomized position metrics index limits for hidden mines parameters
    while(bombLocationsIndexSet.size < TOTAL_MINES_ALLOCATED) {
        const randomCellIndex = Math.floor(Math.random() * (MATRIX_GRID_SIZE * MATRIX_GRID_SIZE));
        bombLocationsIndexSet.add(randomCellIndex);
    }

    // Step 2: Clear and populate matrix tiles loop
    const container = document.getElementById("minesBoardContainer");
    container.innerHTML = "";

    for (let i = 0; i < MATRIX_GRID_SIZE * MATRIX_GRID_SIZE; i++) {
        const cellTileNode = document.createElement("button");
        cellTileNode.className = "grid-cell-tile";
        cellTileNode.dataset.index = i;
        
        // Count surrounding danger points bounds parameters helper calculations
        const holdsMine = bombLocationsIndexSet.has(i);
        const nearCount = calculateSurroundingMinesWeightCount(i);
        
        cellTileNode.innerText = holdsMine ? "💣" : (nearCount > 0 ? nearCount : "🍃");

        cellTileNode.addEventListener("click", () => handleCellTileClickAction(cellTileNode, i));
        container.appendChild(cellTileNode);
    }
}

function calculateSurroundingMinesWeightCount(cellIndexInt) {
    const row = Math.floor(cellIndexInt / MATRIX_GRID_SIZE);
    const col = cellIndexInt % MATRIX_GRID_SIZE;
    let accumulatedSurroundingMinesCount = 0;

    for (let rOffset = -1; rOffset <= 1; rOffset++) {
        for (let cOffset = -1; cOffset <= 1; cOffset++) {
            const targetRow = row + rOffset;
            const targetCol = col + cOffset;
            
            if (targetRow >= 0 && targetRow < MATRIX_GRID_SIZE && targetCol >= 0 && targetCol < MATRIX_GRID_SIZE) {
                const companionIndex = targetRow * MATRIX_GRID_SIZE + targetCol;
                if (bombLocationsIndexSet.has(companionIndex)) accumulatedSurroundingMinesCount++;
            }
        }
    }
    return accumulatedSurroundingMinesCount;
}

function handleCellTileClickAction(cellElementTarget, cellIndexInt) {
    if (!gameActiveSessionState || cellElementTarget.classList.contains("unveiled-safe") || cellElementTarget.classList.contains("unveiled-bomb")) return;

    if (bombLocationsIndexSet.has(cellIndexInt)) {
        // Trigger explosion blowout termination pipeline
        cellElementTarget.classList.add("unveiled-bomb");
        terminateSessionEngine(false);
    } else {
        cellElementTarget.classList.add("unveiled-safe");
        totalSafeFieldsRevealedCount++;
        
        const targetGoal = MATRIX_GRID_SIZE * MATRIX_GRID_SIZE - TOTAL_MINES_ALLOCATED;
        document.getElementById("lblSafeScore").innerText = `${totalSafeFieldsRevealedCount} / ${targetGoal}`;
        
        triggerIndustrialFeedbackBeep(650, 0.05); // Tactile safe landing tick sound code node

        if (totalSafeFieldsRevealedCount === targetGoal) {
            terminateSessionEngine(true);
        }
    }
}

function terminateSessionEngine(victoryBooleanState) {
    gameActiveSessionState = false;
    
    // Reveal absolute remainder grid items overlay mappings
    document.querySelectorAll(".grid-cell-tile").forEach((tile, indexIdx) => {
        const cellPositionIdx = parseInt(tile.dataset.index);
        if (bombLocationsIndexSet.has(cellPositionIdx)) {
            tile.classList.add("unveiled-bomb");
        } else {
            tile.classList.add("unveiled-safe");
        }
    });

    if (victoryBooleanState) {
        triggerIndustrialFeedbackBeep(880, 0.2); // Victory arpeggio chord frequencies
alert("🚨 CLEAR! Matrix territory fully secured with a perfect score.");} else {triggerIndustrialFeedbackBeep(180, 0.3); // Detonation detonation feedback low frequency alarmalert("💥 BOOM! Detonation shield collapsed. Safe matrix re-routing requested.");}}function triggerIndustrialFeedbackBeep(frequencyHzValue, durationSecondsValue) {if (window.AudioContext || window.webkitAudioContext) {try {const ctx = new (window.AudioContext || window.webkitAudioContext)();const osc = ctx.createOscillator();const gain = ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type = "sine";osc.frequency.setValueAtTime(frequencyHzValue, ctx.currentTime);gain.gain.setValueAtTime(0.12, ctx.currentTime);osc.start();osc.stop(ctx.currentTime + durationSecondsValue);} catch (e) {}}}// Fire system initialization blueprint right on load view cycles bootstrapinitializeMinesSessionEngine();</script></body></html>
