<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>RemindMe Premium</title>

<style>
/* UNIFORM MIDNIGHT OCEAN STYLE */
:root{
--bg:#0f172a;
--card:#1e293b;
--text:#f8fafc;
--muted:#94a3b8;
--line:#334155;
--primary:#2563eb;
--primary2:#3b82f6;
--soft:#1e3a8a;
--green:#10b981;
--green-soft:#064e3b;
--danger:#ef4444;
--shadow:0 10px 30px rgba(15,23,42,.4)
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text)
}

button,input,select{font:inherit}
button{cursor:pointer}

.app{
width:100%;
max-width:430px;
min-height:100vh;
margin:auto;
overflow:hidden
}

/* HEADER */
.header{
position:relative;
padding:21px 18px 31px;
color:white;
background:linear-gradient(145deg,#1e3a8a,#2563eb 55%,#0d9488);
border-radius:0 0 31px 31px;
overflow:hidden
}

.header:before{
content:"";
position:absolute;
width:190px;
height:190px;
right:-90px;
top:-105px;
border-radius:50%;
background:rgba(255,255,255,.08)
}

.topbar{
position:relative;
z-index:2;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:9px
}

.brand-icon{
width:41px;
height:41px;
display:grid;
place-items:center;
border-radius:13px;
background:rgba(255,255,255,.15);
font-size:22px
}

.brand-name{
font-size:21px;
font-weight:850;
letter-spacing:-.5px
}

.theme{
width:40px;
height:40px;
border:0;
border-radius:13px;
background:rgba(255,255,255,.15);
color:#fff
}

.hero{
position:relative;
z-index:2;
margin-top:25px
}

.hero h1{
margin:0;
font-size:30px;
line-height:1.08;
letter-spacing:-.8px
}

.hero p{
margin:8px 0 0;
font-size:13px;
color:rgba(255,255,255,.8)
}

/* CONTENT */
.content{padding:18px}

.card{
padding:17px;
margin-bottom:14px;
background:var(--card);
border:1px solid var(--line);
border-radius:21px;
box-shadow:var(--shadow)
}

.title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px
}

.title h2{
margin:0;
font-size:15px
}

.title span{
font-size:10px;
color:var(--muted)
}

/* REMINDER ITEMS FEED */
.reminder-item {
display:flex;
align-items:center;
gap:12px;
padding:12px 0;
border-bottom:1px solid var(--line)
}
.reminder-item:last-child{border-bottom:0}

.rem-icon {
width:40px;
height:40px;
border-radius:12px;
background:var(--bg);
display:grid;
place-items:center;
font-size:18px;
flex-shrink:0
}

.rem-details {
flex:1;
min-width:0
}

.rem-title {
font-size:13px;
font-weight:750;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.rem-meta {
font-size:9px;
color:var(--muted);
margin-top:3px
}

.action-column {
text-align:right;
display:flex;
flex-direction:column;
align-items:flex-end
}

.btn-delete-row {
background:transparent;
border:0;
color:var(--danger);
font-size:11px;
font-weight:700;
padding:4px
}

/* FLOATING ACTION TRIGGER */
.fab{
position:fixed;
right:max(22px,calc((100vw - 430px)/2 + 22px));
bottom:23px;
width:59px;
height:59px;
border:0;
border-radius:20px;
background:var(--primary);
color:white;
font-size:28px;
box-shadow:0 12px 28px rgba(37,99,235,.28);
z-index:10;
display:flex;
align-items:center;
justify-content:center
}

/* MODAL OVERLAY SHEET */
.overlay{
position:fixed;
inset:0;
z-index:20;
display:none;
align-items:flex-end;
justify-content:center;
background:rgba(0,0,0,.6)
}
.overlay.show{display:flex}

.modal{
width:min(430px,100%);
max-height:92vh;
overflow:auto;
padding:23px 18px 30px;
background:var(--card);
border-radius:28px 28px 0 0;
border-top:1px solid var(--line)
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:17px
}

.modal-head h2{
margin:0;
font-size:19px
}

.close{
width:35px;
height:35px;
border:0;
border-radius:10px;
background:var(--bg);
color:var(--text)
}

.field{margin-bottom:12px}

.field label{
display:block;
margin-bottom:6px;
font-size:11px;
font-weight:750;
color:var(--muted)
}

.field input,
.field select{
width:100%;
padding:13px;
border:1px solid var(--line);
border-radius:12px;
outline:none;
background:var(--bg);
color:var(--text)
}

.save{
width:100%;
padding:14px;
border:0;
border-radius:13px;
background:var(--primary);
color:white;
font-weight:800
}

.empty-state {
text-align:center;
padding:35px 15px;
color:var(--muted)
}
.empty-icon { font-size:40px; margin-bottom:6px; }

/* LIGHT THEME OVERRIDE */
body.light-theme {
--bg:#f1f5f9;
--card:#ffffff;
--text:#0f172a;
--muted:#64748b;
--line:#cbd5e1;
--soft:#dbeafe;
--shadow:0 10px 30px rgba(51,65,85,0.06)
}
</style>
</head>

<body>

<div class="app">

<header class="header">
<div class="topbar">
<div class="brand">
<div class="brand-icon">🔔</div>
<div class="brand-name">RemindMe</div>
</div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">☀️</button>
</div>

<div class="hero">
<h1>Never Forget.<br>Stay On Schedule.</h1>
<p>Set custom notification markers and track your timeline alerts locally.</p>
</div>
</header>

<main class="content">

<!-- REMINDERS CARD LIST -->
<section class="card">
<div class="title">
<h2>📅 Active Notifications</h2>
<span id="reminderCountSpan">0 active</span>
</div>

<div id="remindersContainer">
<!-- Rendered dynamically by Javascript logic -->
</div>
</section>

</main>

<!-- FLOATING ACTION BUTTON -->
<button class="fab" onclick="openModal()">+</button>

<!-- ADD REMINDER MODAL PANEL -->
<div class="overlay" id="overlay">
<div class="modal">
<div class="modal-head">
<h2>Add Reminder Notification</h2>
<button class="close" onclick="closeModal()">✕</button>
</div>

<div class="field">
<label>REMINDER ALERT TITLE</label>
<input type="text" id="remTitle" placeholder="e.g., Doctor Appointment">
</div>

<div class="field">
<label>DATE & ALERT TIME</label>
<input type="datetime-local" id="remTime">
</div>

<div class="field">
<label>SELECT CATEGORY</label>
<select id="remCategory">
<option value="Work">💼 Work & Projects</option>
<option value="Personal">🏠 Personal & Home</option>
<option value="Health">❤️ Health & Wellness</option>
<option value="Other">✨ Other Reminders</option>
</select>
</div>

<button class="save" onclick="saveReminder()">Schedule Alert</button>
</div>
</div>

</div>

<script>
// Category icon mapping dictionary
const icons = { Work: "💼", Personal: "🏠", Health: "❤️", Other: "✨" };

// Fetch structural storage list memory properties
let alertList = JSON.parse(localStorage.getItem("remind_me_alerts")) || [
    { id: 1, title: "Review App Project Progress", time: "2026-08-28T10:00", category: "Work" },
    { id: 2, title: "Drink Water Intake Check", time: "2026-08-28T14:30", category: "Health" }
];

function toggleTheme() {
    document.body.classList.toggle("light-theme");
    const btn = document.getElementById("themeBtn");
    btn.innerText = document.body.classList.contains("light-theme") ? "🌙" : "☀️";
}

function openModal() {
    document.getElementById("overlay").classList.add("show");
    // Pre-populate input with current date time context values
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById("remTime").value = now.toISOString().slice(0, 16);
}

function closeModal() {
    document.getElementById("overlay").classList.remove("show");
}

function saveReminder() {
    const title = document.getElementById("remTitle").value.trim();
    const time = document.getElementById("remTime").value;
    const category = document.getElementById("remCategory").value;

    if (!title || !time) {
        return alert("Please fill out all fields correctly.");
    }

    alertList.push({ id: Date.now(), title, time: time.replace('T', ' '), category });
    saveAndRender();
    closeModal();

    // Reset standard layout value boundaries fields back to defaults
    document.getElementById("remTitle").value = "";
}

function removeReminder(id) {
    alertList = alertList.filter(item => item.id !== id);
    saveAndRender();
}

function saveAndRender() {
    localStorage.setItem("remind_me_alerts", JSON.stringify(alertList));
    render();
}

function render() {
    const container = document.getElementById("remindersContainer");
    document.getElementById("reminderCountSpan").innerText = alertList.length + " active";

    if (alertList.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">🍃</div>
                <h3>All Caught Up</h3>
                <p>Tap the blue plus switch to write down a new reminder check row block.</p>
            </div>`;
        return;
    }

    container.innerHTML = alertList.map(item => `
        <div class="reminder-item">
            <div class="rem-icon">${icons[item.category] || "✨"}</div>
            <div class="rem-details">
                <div class="rem-title">${item.title}</div>
                <div class="rem-meta">${item.time} • ${item.category}</div>
            </div>
            <div class="action-column">
                <button class="btn-delete-row" onclick="removeReminder(${item.id})">Clear</button>
            </div>
        </div>
    `).join("");
}

// Kickstart local structure processing logic immediately upon engine initialization loading loop triggers
render();
</script>

</body>
</html>
