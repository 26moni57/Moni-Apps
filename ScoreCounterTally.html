<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>ScoreCounter Tally</title>

<style>
/* UNIFORM MIDNIGHT OCEAN STYLE */
:root{
--bg:#0f172a;
--card:#1e293b;
--text:#f8fafc;
--muted:#94a3b8;
--line:#334155;
--primary:#2563eb;
--primary2:#3b82f6;
--soft:#1e3a8a;
--green:#10b981;
--green-soft:#064e3b;
--danger:#ef4444;
--shadow:0 10px 30px rgba(15,23,42,.4)
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text)
}

button,input,select{font:inherit}
button{cursor:pointer}

.app{
width:100%;
max-width:430px;
min-height:100vh;
margin:auto;
overflow:hidden
}

/* HEADER */
.header{
position:relative;
padding:21px 18px 31px;
color:white;
background:linear-gradient(145deg,#1e3a8a,#2563eb 55%,#0d9488);
border-radius:0 0 31px 31px;
overflow:hidden
}

.header:before{
content:"";
position:absolute;
width:190px;
height:190px;
right:-90px;
top:-105px;
border-radius:50%;
background:rgba(255,255,255,.08)
}

.topbar{
position:relative;
z-index:2;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:9px
}

.brand-icon{
width:41px;
height:41px;
display:grid;
place-items:center;
border-radius:13px;
background:rgba(255,255,255,.15);
font-size:22px
}

.brand-name{
font-size:21px;
font-weight:850;
letter-spacing:-.5px
}

.theme{
width:40px;
height:40px;
border:0;
border-radius:13px;
background:rgba(255,255,255,.15);
color:#fff
}

.hero{
position:relative;
z-index:2;
margin-top:25px
}

.hero h1{
margin:0;
font-size:30px;
line-height:1.08;
letter-spacing:-.8px
}

.hero p{
margin:8px 0 0;
font-size:13px;
color:rgba(255,255,255,.8)
}

/* CONTENT */
.content{padding:18px}

.card{
padding:17px;
margin-bottom:14px;
background:var(--card);
border:1px solid var(--line);
border-radius:21px;
box-shadow:var(--shadow)
}

.title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px
}

.title h2{
margin:0;
font-size:15px
}

/* DOUBLE COLUMN MULTIPLAYER SCORE DESK CONTAINER */
.score-board-grid {
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-bottom:5px
}

.score-column-panel {
display:flex;
flex-direction:column;
align-items:center;
background:var(--bg);
border:1px solid var(--line);
border-radius:18px;
padding:16px 10px;
text-align:center
}

.team-label-input {
width:100%;
background:transparent;
border:0;
border-bottom:1px dashed var(--line);
color:var(--text);
text-align:center;
font-size:14px;
font-weight:800;
padding-bottom:4px;
margin-bottom:10px;
outline:none
}
.team-label-input:focus {
border-bottom-color:var(--primary2)
}

.score-digits {
font-size:52px;
font-weight:900;
font-family:"Courier New",Courier,monospace;
color:var(--text);
margin:8px 0
}

.tally-actions-wrapper {
display:flex;
flex-direction:column;
gap:6px;
width:100%
}

.btn-tally-step {
width:100%;
padding:10px 5px;
border:0;
border-radius:10px;
font-weight:800;
font-size:12px;
transition:opacity 0.15s
}
.btn-tally-step:active { opacity:0.85 }

.btn-tally-plus { background:var(--primary); color:white; }
.btn-tally-macro { background:var(--soft); color:var(--primary2); }
.btn-tally-minus { background:var(--line); color:var(--muted); }

/* HISTORICAL STREAM ROW TILES */
.log-row-item {
padding:10px 0;
border-bottom:1px solid var(--line);
display:flex;
justify-content:space-between;
align-items:center;
font-size:12px
}
.log-row-item:last-child { border-bottom:0 }

.log-desc {
font-weight:700;
color:var(--text)
}

.log-time {
font-size:10px;
color:var(--muted)
}

.btn-action-master {
width:100%;
padding:14px;
border:0;
border-radius:14px;
background:var(--danger);
color:white;
font-weight:800;
transition:opacity 0.2s
}
.btn-action-master:active { opacity:0.9 }

.empty-state {
text-align:center;
padding:20px 10px;
color:var(--muted);
font-size:12px
}

/* LIGHT SKIN INVERSION OVERRIDE STYLE */
body.light-theme {
--bg:#f1f5f9;
--card:#ffffff;
--text:#0f172a;
--muted:#64748b;
--line:#cbd5e1;
--soft:#dbeafe;
--shadow:0 10px 30px rgba(51,65,85,0.06)
}
</style>
</head>

<body>

<div class="app">

<header class="header">
<div class="topbar">
<div class="brand">
<div class="brand-icon">🏆</div>
<div class="brand-name">ScoreCounter</div>
</div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">☀️</button>
</div>

<div class="hero">
<h1>Match Tracking.<br>Tally Points Live.</h1>
<p>Keep game logs, adjust scores dynamically, and track match logs locally.</p>
</div>
</header>

<main class="content">

<!-- DUAL TRACKING PANEL WORKSPACE -->
<section class="card">
<div class="score-board-grid">
<!-- SIDE PANEL LEFT -->
<div class="score-column-panel">
<input type="text" id="nameTeamA" class="team-label-input" value="TEAM ALPHA" onchange="persistLabels()">
<div id="digitsTeamA" class="score-digits">0</div>
<div class="tally-actions-wrapper">
<button class="btn-tally-step btn-tally-plus" onclick="adjustPoints('A', 1)">+1 Point</button>
<button class="btn-tally-step btn-tally-macro" onclick="adjustPoints('A', 5)">+5 Blitz</button>
<button class="btn-tally-step btn-tally-minus" onclick="adjustPoints('A', -1)">-1 Deduction</button>
</div>
</div>

<!-- SIDE PANEL RIGHT -->
<div class="score-column-panel">
<input type="text" id="nameTeamB" class="team-label-input" value="TEAM BETA" onchange="persistLabels()">
<div id="digitsTeamB" class="score-digits">0</div>
<div class="tally-actions-wrapper">
<button class="btn-tally-step btn-tally-plus" onclick="adjustPoints('B', 1)">+1 Point</button>
<button class="btn-tally-step btn-tally-macro" onclick="adjustPoints('B', 5)">+5 Blitz</button>
<button class="btn-tally-step btn-tally-minus" onclick="adjustPoints('B', -1)">-1 Deduction</button>
</div>
</div>
</div>
</section>

<!-- LIVE HISTORICAL LOG BLOCK CARD -->
<section class="card">
<div class="title">
<h2>📜 Dynamic Log Stream</h2>
</div>
<div id="matchLogHistoryBox">
<!-- Generated dynamically via Javascript actions logs loop -->
</div>
</section>

<button class="btn-action-master" onclick="resetEntireMatchSession()">Reset Match Records</button>

</main>

</div>

<script>
// Load workspace parameters memory properties safely out of local browser storage layout state variables
let scoreState = JSON.parse(localStorage.getItem("score_tally_desk")) || { scoreA: 0, scoreB: 0 };
let labelsState = JSON.parse(localStorage.getItem("score_tally_labels")) || { labelA: "TEAM ALPHA", labelB: "TEAM BETA" };
let matchLogs = JSON.parse(localStorage.getItem("score_tally_logs")) || [];

function toggleTheme() {
    document.body.classList.toggle("light-theme");
    const btn = document.getElementById("themeBtn");
    btn.innerText = document.body.classList.contains("light-theme") ? "🌙" : "☀️";
}

function persistLabels() {
    labelsState.labelA = document.getElementById("nameTeamA").value.trim().toUpperCase() || "TEAM ALPHA";
    labelsState.labelB = document.getElementById("nameTeamB").value.trim().toUpperCase() || "TEAM BETA";
    localStorage.setItem("score_tally_labels", JSON.stringify(labelsState));
}

function adjustPoints(targetColumn, stepDelta) {
    const timeStr = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    let entityName = targetColumn === 'A' ? labelsState.labelA : labelsState.labelB;
    let signStr = stepDelta > 0 ? `+${stepDelta}` : `${stepDelta}`;
    
    if(targetColumn === 'A') {
        scoreState.scoreA = Math.max(0, scoreState.scoreA + stepDelta);
    } else {
        scoreState.scoreB = Math.max(0, scoreState.scoreB + stepDelta);
    }
    
    // Unshift log entry description metrics block
    matchLogs.unshift({
        id: Date.now(),
        desc: `${entityName} scored ${signStr} points`,
        time: timeStr
    });
    
    saveAndRedrawView();
}

function resetEntireMatchSession() {
    if(confirm("Are you sure you want to completely clear down active score tallies and timeline logs?")) {
        scoreState = { scoreA: 0, scoreB: 0 };
        matchLogs = [];
        saveAndRedrawView();
    }
}

function saveAndRedrawView() {
    localStorage.setItem("score_tally_desk", JSON.stringify(scoreState));
    localStorage.setItem("score_tally_logs", JSON.stringify(matchLogs));
    render();
}

function render() {
    // Inject configurations values safely to view blocks layouts templates
    document.getElementById("nameTeamA").value = labelsState.labelA;
    document.getElementById("nameTeamB").value = labelsState.labelB;
    document.getElementById("digitsTeamA").innerText = scoreState.scoreA;
    document.getElementById("digitsTeamB").innerText = scoreState.scoreB;
    
    const container = document.getElementById("matchLogHistoryBox");
    
    if(matchLogs.length === 0) {
        container.innerHTML = `<div class="empty-state">No points scored yet. Start ticking scores above!</div>`;
        return;
    }
    
    // Enforce max list visibility parameter limits to avoid dashboard overflows
    const sliceCount = matchLogs.slice(0, 5);
    container.innerHTML = sliceCount.map(log => `
        <div class="log-row-item">
            <span class="log-desc">${log.desc}</span>
            <span class="log-time">${log.time}</span>
        </div>
    `).join("");
}

// Initial structural bootstrap view rendering loop runtime engine alignment configurations updates
render();
</script>

</body>
</html>
