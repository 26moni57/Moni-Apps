<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnapList</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f5fb;
    color: #292431;
}

.app {
    max-width: 420px;
    min-height: 100vh;
    margin: auto;
    padding-bottom: 100px;
}

/* HEADER */

.header {
    padding: 28px 20px 32px;
    color: white;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    border-radius: 0 0 32px 32px;
}

.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.count {
    padding: 8px 11px;
    border-radius: 20px;
    background: rgba(255,255,255,.18);
    font-size: 10px;
}

.header h1 {
    margin: 28px 0 5px;
    font-size: 30px;
}

.header p {
    margin: 0;
    opacity: .85;
}

/* CONTENT */

.content {
    padding: 20px;
}

/* SEARCH */

.search {
    position: relative;
}

.search span {
    position: absolute;
    left: 15px;
    top: 13px;
}

.search input {
    width: 100%;
    padding: 15px 15px 15px 42px;
    border: 0;
    border-radius: 16px;
    outline: none;
    background: white;
    box-shadow: 0 5px 15px rgba(50,30,80,.06);
}

/* FILTERS */

.filters {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 15px 0 4px;
}

.filter {
    border: 0;
    white-space: nowrap;
    padding: 9px 13px;
    border-radius: 12px;
    background: white;
    color: #85808e;
    cursor: pointer;
}

.filter.active {
    color: white;
    background: #7c3aed;
}

/* CARD */

.snap {
    margin-top: 12px;
    overflow: hidden;
    background: white;
    border-radius: 20px;
    box-shadow: 0 5px 18px rgba(50,30,80,.06);
}

.photo {
    width: 100%;
    height: 175px;
    object-fit: cover;
    display: block;
}

.no-photo {
    height: 125px;
    display: grid;
    place-items: center;
    font-size: 42px;
    background: #f0eafd;
}

.snap-body {
    padding: 15px;
}

.snap-top {
    display: flex;
    gap: 10px;
    align-items: flex-start;
}

.check {
    width: 25px;
    height: 25px;
    flex-shrink: 0;
    border: 2px solid #d9d2e4;
    border-radius: 8px;
    background: white;
    cursor: pointer;
}

.check.done {
    background: #7c3aed;
    border-color: #7c3aed;
    color: white;
}

.snap-info {
    flex: 1;
    min-width: 0;
}

.title {
    font-size: 15px;
    font-weight: bold;
}

.done .title {
    text-decoration: line-through;
    color: #aaa4b0;
}

.note {
    color: #85808e;
    font-size: 11px;
    line-height: 1.5;
    margin-top: 6px;
}

.category {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 8px;
    border-radius: 8px;
    background: #f0eafd;
    color: #7c3aed;
    font-size: 9px;
}

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 5px;
    margin-top: 12px;
}

.actions button {
    border: 0;
    background: #f6f3fa;
    padding: 7px 9px;
    border-radius: 9px;
    cursor: pointer;
}

/* EMPTY */

.empty {
    padding: 50px 20px;
    text-align: center;
    color: #8e8995;
}

.empty-icon {
    font-size: 48px;
}

/* ADD */

.add {
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 60px;
    height: 60px;
    border: 0;
    border-radius: 20px;
    background: #7c3aed;
    color: white;
    font-size: 30px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(124,58,237,.3);
}

/* MODAL */

.overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0,0,0,.45);
}

.overlay.show {
    display: flex;
}

.modal {
    width: min(420px,100%);
    max-height: 92vh;
    overflow-y: auto;
    padding: 24px 20px 30px;
    background: white;
    border-radius: 28px 28px 0 0;
}

.modal h2 {
    margin-top: 0;
}

.modal input,
.modal textarea,
.modal select {
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid #ddd7e6;
    border-radius: 13px;
    outline: none;
    font-family: inherit;
    background: white;
}

.modal textarea {
    min-height: 90px;
    resize: vertical;
}

.file-label {
    display: block;
    padding: 14px;
    margin-bottom: 10px;
    text-align: center;
    border: 1px dashed #c9bfda;
    border-radius: 13px;
    color: #7c3aed;
    cursor: pointer;
}

.preview {
    width: 100%;
    max-height: 170px;
    object-fit: cover;
    border-radius: 13px;
    margin-bottom: 10px;
    display: none;
}

.save {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 14px;
    background: #7c3aed;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.cancel {
    width: 100%;
    padding: 14px;
    border: 0;
    background: transparent;
    color: #77717f;
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="top">

            <div class="logo">
                📸 SnapList
            </div>

            <div class="count" id="count">
                0 items
            </div>

        </div>

        <h1>
            Remember visually.
        </h1>

        <p>
            Snap it. Save it. Check it off.
        </p>

    </header>


    <main class="content">

        <div class="search">

            <span>🔍</span>

            <input
                id="search"
                type="text"
                placeholder="Search your list..."
                oninput="render()"
            >

        </div>


        <div class="filters">

            <button
                class="filter active"
                onclick="setFilter('all', this)"
            >
                All
            </button>

            <button
                class="filter"
                onclick="setFilter('places', this)"
            >
                📍 Places
            </button>

            <button
                class="filter"
                onclick="setFilter('things', this)"
            >
                📦 Things
            </button>

            <button
                class="filter"
                onclick="setFilter('ideas', this)"
            >
                💡 Ideas
            </button>

            <button
                class="filter"
                onclick="setFilter('other', this)"
            >
                ✨ Other
            </button>

        </div>


        <section id="list"></section>

    </main>

</div>


<button
    class="add"
    onclick="openModal()"
>
    +
</button>


<!-- MODAL -->

<div
    class="overlay"
    id="overlay"
>

    <div class="modal">

        <h2 id="modalTitle">
            Add Snap
        </h2>

        <input
            id="title"
            type="text"
            placeholder="Title"
        >

        <textarea
            id="note"
            placeholder="Add a short note..."
        ></textarea>

        <select id="category">

            <option value="places">
                📍 Places
            </option>

            <option value="things">
                📦 Things
            </option>

            <option value="ideas">
                💡 Ideas
            </option>

            <option value="other">
                ✨ Other
            </option>

        </select>


        <label
            class="file-label"
            for="photo"
        >
            📸 Choose a photo
        </label>

        <input
            id="photo"
            type="file"
            accept="image/*"
            hidden
            onchange="previewPhoto(event)"
        >

        <img
            id="preview"
            class="preview"
        >


        <button
            class="save"
            onclick="saveSnap()"
        >
            Save Snap
        </button>

        <button
            class="cancel"
            onclick="closeModal()"
        >
            Cancel
        </button>

    </div>

</div>


<script>

/*
    SnapList
    Visual checklist
*/

let snaps =
    JSON.parse(
        localStorage.getItem("snapListData")
    ) || [];

let activeFilter =
    "all";

let editingId =
    null;

let selectedPhoto =
    "";


/* SAVE */

function saveData() {

    localStorage.setItem(
        "snapListData",
        JSON.stringify(snaps)
    );

}


/* FILTER */

function setFilter(filter, button) {

    activeFilter =
        filter;

    document
        .querySelectorAll(".filter")
        .forEach(
            btn =>
                btn.classList.remove("active")
        );

    button.classList.add("active");

    render();
}


/* RENDER */

function render() {

    const container =
        document.getElementById("list");

    const query =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        snaps.filter(snap => {

            const searchMatch =
                (
                    snap.title +
                    " " +
                    snap.note
                )
                .toLowerCase()
                .includes(query);

            const categoryMatch =
                activeFilter === "all"
                    ? true
                    : snap.category === activeFilter;

            return (
                searchMatch &&
                categoryMatch
            );

        });


    document.getElementById("count")
        .innerText =
        snaps.length +
        (
            snaps.length === 1
                ? " item"
                : " items"
        );


    if (filtered.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📸
                </div>

                <h3>
                    Nothing here yet
                </h3>

                <p>
                    Tap + to create your first Snap.
                </p>

            </div>

        `;

        return;
    }


    container.innerHTML =
        filtered
            .map(snap => {

                const category =
                    categoryInfo(snap.category);

                return `

                    <article
                        class="snap ${
                            snap.done ? "done" : ""
                        }"
                    >

                        ${
                            snap.photo
                                ?
                                `<img
                                    class="photo"
                                    src="${snap.photo}"
                                    alt=""
                                >`
                                :
                                `<div class="no-photo">
                                    ${category.icon}
                                </div>`
                        }


                        <div class="snap-body">

                            <div class="snap-top">

                                <button
                                    class="check ${
                                        snap.done
                                            ? "done"
                                            : ""
                                    }"
                                    onclick="toggle(${snap.id})"
                                >
                                    ${
                                        snap.done
                                            ? "✓"
                                            : ""
                                    }
                                </button>


                                <div class="snap-info">

                                    <div class="title">
                                        ${escapeHTML(snap.title)}
                                    </div>

                                    ${
                                        snap.note
                                            ?
                                            `<div class="note">
                                                ${escapeHTML(snap.note)}
                                            </div>`
                                            :
                                            ""
                                    }

                                    <span class="category">
                                        ${category.icon}
                                        ${category.name}
                                    </span>

                                </div>

                            </div>


                            <div class="actions">

                                <button
                                    onclick="editSnap(${snap.id})"
                                >
                                    ✏️ Edit
                                </button>

                                <button
                                    onclick="deleteSnap(${snap.id})"
                                >
                                    🗑️ Delete
                                </button>

                            </div>

                        </div>

                    </article>

                `;

            })
            .join("");

}


/* CATEGORY */

function categoryInfo(category) {

    const data = {

        places: {
            icon: "📍",
            name: "Places"
        },

        things: {
            icon: "📦",
            name: "Things"
        },

        ideas: {
            icon: "💡",
            name: "Ideas"
        },

        other: {
            icon: "✨",
            name: "Other"
        }

    };

    return data[category] || data.other;
}


/* OPEN */

function openModal() {

    editingId =
        null;

    selectedPhoto =
        "";


    document.getElementById("modalTitle")
        .innerText =
        "Add Snap";

    document.getElementById("title")
        .value =
        "";

    document.getElementById("note")
        .value =
        "";

    document.getElementById("category")
        .value =
        "places";

    document.getElementById("photo")
        .value =
        "";

    const preview =
        document.getElementById("preview");

    preview.src = "";

    preview.style.display =
        "none";


    document.getElementById("overlay")
        .classList.add("show");

}


/* CLOSE */

function closeModal() {

    document.getElementById("overlay")
        .classList.remove("show");

}


/* PHOTO PREVIEW */

function previewPhoto(event) {

    const file =
        event.target.files[0];

    if (!file) return;


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            selectedPhoto =
                e.target.result;


            const preview =
                document.getElementById(
                    "preview"
                );

            preview.src =
                selectedPhoto;

            preview.style.display =
                "block";

        };


    reader.readAsDataURL(file);

}


/* SAVE */

function saveSnap() {

    const title =
        document
            .getElementById("title")
            .value
            .trim();

    const note =
        document
            .getElementById("note")
            .value
            .trim();

    const category =
        document
            .getElementById("category")
            .value;


    if (!title) {

        alert(
            "Please enter a title."
        );

        return;
    }


    if (editingId !== null) {

        const snap =
            snaps.find(
                s => s.id === editingId
            );


        if (snap) {

            snap.title =
                title;

            snap.note =
                note;

            snap.category =
                category;

            if (selectedPhoto) {

                snap.photo =
                    selectedPhoto;

            }

        }

    } else {

        snaps.unshift({

            id: Date.now(),

            title: title,

            note: note,

            category: category,

            photo: selectedPhoto,

            done: false

        });

    }


    saveData();

    closeModal();

    render();

}


/* TOGGLE */

function toggle(id) {

    const snap =
        snaps.find(
            s => s.id === id
        );

    if (!snap) return;

    snap.done =
        !snap.done;

    saveData();

    render();

}


/* EDIT */

function editSnap(id) {

    const snap =
        snaps.find(
            s => s.id === id
        );

    if (!snap) return;


    editingId =
        id;

    selectedPhoto =
        snap.photo || "";


    document.getElementById("modalTitle")
        .innerText =
        "Edit Snap";

    document.getElementById("title")
        .value =
        snap.title;

    document.getElementById("note")
        .value =
        snap.note || "";

    document.getElementById("category")
        .value =
        snap.category;


    const preview =
        document.getElementById(
            "preview"
        );


    if (snap.photo) {

        preview.src =
            snap.photo;

        preview.style.display =
            "block";

    } else {

        preview.src = "";

        preview.style.display =
            "none";

    }


    document.getElementById("overlay")
        .classList.add("show");

}


/* DELETE */

function deleteSnap(id) {

    const snap =
        snaps.find(
            s => s.id === id
        );

    if (!snap) return;


    if (
        !confirm(
            'Delete "' +
            snap.title +
            '"?'
        )
    ) {
        return;
    }


    snaps =
        snaps.filter(
            s => s.id !== id
        );


    saveData();

    render();

}


/* ESCAPE */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* OUTSIDE MODAL */

document
    .getElementById("overlay")
    .addEventListener(
        "click",
        function(event) {

            if (event.target === this) {
                closeModal();
            }

        }
    );


/* START */

render();

</script>

</body>
</html>
