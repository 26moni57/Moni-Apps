<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PackageTrack</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #263142;
}

.app {
    max-width: 420px;
    min-height: 100vh;
    margin: auto;
    padding-bottom: 100px;
}

/* HEADER */

.header {
    padding: 28px 20px 32px;
    color: white;
    background: linear-gradient(135deg, #2563eb, #06b6d4);
    border-radius: 0 0 32px 32px;
}

.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.count {
    padding: 8px 11px;
    border-radius: 20px;
    background: rgba(255,255,255,.18);
    font-size: 10px;
}

.header h1 {
    margin: 28px 0 5px;
    font-size: 30px;
}

.header p {
    margin: 0;
    opacity: .85;
}

/* CONTENT */

.content {
    padding: 20px;
}

/* SEARCH */

.search {
    position: relative;
}

.search span {
    position: absolute;
    left: 15px;
    top: 13px;
}

.search input {
    width: 100%;
    padding: 15px 15px 15px 42px;
    border: 0;
    border-radius: 16px;
    outline: none;
    background: white;
    box-shadow: 0 5px 15px rgba(30,60,100,.06);
}

/* FILTERS */

.filters {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 15px 0 5px;
}

.filter {
    border: 0;
    white-space: nowrap;
    padding: 9px 13px;
    border-radius: 12px;
    background: white;
    color: #7c8592;
    cursor: pointer;
}

.filter.active {
    background: #2563eb;
    color: white;
}

/* PACKAGE */

.package {
    margin-top: 12px;
    padding: 17px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 5px 18px rgba(30,60,100,.06);
}

.package-top {
    display: flex;
    gap: 12px;
    align-items: flex-start;
}

.package-icon {
    width: 45px;
    height: 45px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: #eaf3ff;
    font-size: 23px;
}

.info {
    flex: 1;
    min-width: 0;
}

.title {
    font-size: 15px;
    font-weight: bold;
}

.carrier {
    margin-top: 5px;
    color: #7d8792;
    font-size: 10px;
}

.status {
    display: inline-block;
    margin-top: 9px;
    padding: 6px 9px;
    border-radius: 8px;
    font-size: 9px;
    font-weight: bold;
}

.status.transit {
    background: #eaf3ff;
    color: #2563eb;
}

.status.out {
    background: #fff6dc;
    color: #a46d08;
}

.status.delivered {
    background: #e9f9f0;
    color: #15965d;
}

.status.delayed {
    background: #fff0ef;
    color: #dc4c42;
}

.status.ordered {
    background: #f1efff;
    color: #6956c7;
}

/* TRACKING */

.tracking {
    margin-top: 14px;
    padding: 11px;
    border-radius: 11px;
    background: #f6f8fb;
    font-family: monospace;
    font-size: 11px;
    word-break: break-all;
}

.delivery {
    margin-top: 10px;
    color: #66717e;
    font-size: 11px;
}

.note {
    margin-top: 8px;
    color: #7b8590;
    font-size: 10px;
    line-height: 1.5;
}

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 5px;
    margin-top: 13px;
}

.actions button {
    border: 0;
    background: #f3f5f8;
    padding: 8px 10px;
    border-radius: 9px;
    cursor: pointer;
}

/* EMPTY */

.empty {
    padding: 50px 20px;
    text-align: center;
    color: #8a929c;
}

.empty-icon {
    font-size: 48px;
}

/* ADD */

.add {
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 60px;
    height: 60px;
    border: 0;
    border-radius: 20px;
    background: #2563eb;
    color: white;
    font-size: 30px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(37,99,235,.3);
}

/* MODAL */

.overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0,0,0,.45);
}

.overlay.show {
    display: flex;
}

.modal {
    width: min(420px,100%);
    max-height: 92vh;
    overflow-y: auto;
    padding: 24px 20px 30px;
    background: white;
    border-radius: 28px 28px 0 0;
}

.modal h2 {
    margin-top: 0;
}

.modal input,
.modal textarea,
.modal select {
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid #dce2e9;
    border-radius: 13px;
    outline: none;
    background: white;
    font-family: inherit;
}

.modal textarea {
    min-height: 80px;
    resize: vertical;
}

.row {
    display: flex;
    gap: 8px;
}

.row > * {
    flex: 1;
}

.save {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 14px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.cancel {
    width: 100%;
    padding: 14px;
    border: 0;
    background: transparent;
    color: #777f89;
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="top">

        <div class="logo">
            📦 PackageTrack
        </div>

        <div class="count" id="count">
            0 packages
        </div>

    </div>

    <h1>
        Where's my package?
    </h1>

    <p>
        Keep all your deliveries in one place.
    </p>

</header>


<main class="content">

    <div class="search">

        <span>🔍</span>

        <input
            id="search"
            type="text"
            placeholder="Search packages..."
            oninput="render()"
        >

    </div>


    <div class="filters">

        <button
            class="filter active"
            onclick="setFilter('all',this)"
        >
            All
        </button>

        <button
            class="filter"
            onclick="setFilter('ordered',this)"
        >
            🛍️ Ordered
        </button>

        <button
            class="filter"
            onclick="setFilter('transit',this)"
        >
            🚚 In Transit
        </button>

        <button
            class="filter"
            onclick="setFilter('out',this)"
        >
            🛵 Out
        </button>

        <button
            class="filter"
            onclick="setFilter('delivered',this)"
        >
            ✅ Delivered
        </button>

    </div>


    <section id="packages"></section>

</main>

</div>


<button
    class="add"
    onclick="openModal()"
>
    +
</button>


<!-- MODAL -->

<div
    class="overlay"
    id="overlay"
>

<div class="modal">

    <h2 id="modalTitle">
        Add Package
    </h2>

    <input
        id="name"
        type="text"
        placeholder="Package name"
    >

    <input
        id="tracking"
        type="text"
        placeholder="Tracking number"
    >

    <div class="row">

        <select id="carrier">

            <option value="DHL">
                DHL
            </option>

            <option value="FedEx">
                FedEx
            </option>

            <option value="UPS">
                UPS
            </option>

            <option value="USPS">
                USPS
            </option>

            <option value="Pathao">
                Pathao
            </option>

            <option value="RedX">
                RedX
            </option>

            <option value="Other">
                Other
            </option>

        </select>

        <select id="status">

            <option value="ordered">
                🛍️ Ordered
            </option>

            <option value="transit">
                🚚 In Transit
            </option>

            <option value="out">
                🛵 Out for Delivery
            </option>

            <option value="delivered">
                ✅ Delivered
            </option>

            <option value="delayed">
                ⚠️ Delayed
            </option>

        </select>

    </div>


    <input
        id="delivery"
        type="date"
    >

    <textarea
        id="note"
        placeholder="Optional note..."
    ></textarea>


    <button
        class="save"
        onclick="savePackage()"
    >
        Save Package
    </button>

    <button
        class="cancel"
        onclick="closeModal()"
    >
        Cancel
    </button>

</div>

</div>


<script>

/*
    PackageTrack
*/

let packages =
    JSON.parse(
        localStorage.getItem(
            "packageTrackData"
        )
    ) || [];

let activeFilter =
    "all";

let editingId =
    null;


/* SAVE */

function saveData() {

    localStorage.setItem(
        "packageTrackData",
        JSON.stringify(packages)
    );

}


/* FILTER */

function setFilter(filter, button) {

    activeFilter =
        filter;

    document
        .querySelectorAll(".filter")
        .forEach(
            b =>
                b.classList.remove("active")
        );

    button.classList.add("active");

    render();

}


/* RENDER */

function render() {

    const container =
        document.getElementById(
            "packages"
        );

    const query =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        packages.filter(pkg => {

            const searchable =
                (
                    pkg.name +
                    " " +
                    pkg.tracking +
                    " " +
                    pkg.carrier
                )
                .toLowerCase();


            const searchMatch =
                searchable.includes(
                    query
                );


            const filterMatch =
                activeFilter === "all"
                    ? true
                    : pkg.status ===
                      activeFilter;


            return (
                searchMatch &&
                filterMatch
            );

        });


    document.getElementById("count")
        .innerText =
        packages.length +
        (
            packages.length === 1
                ? " package"
                : " packages"
        );


    if (filtered.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📦
                </div>

                <h3>
                    No packages yet
                </h3>

                <p>
                    Tap + to add your first delivery.
                </p>

            </div>

        `;

        return;
    }


    container.innerHTML =
        filtered
            .map(pkg => {

                return `

                <article class="package">

                    <div class="package-top">

                        <div class="package-icon">
                            📦
                        </div>

                        <div class="info">

                            <div class="title">
                                ${escapeHTML(pkg.name)}
                            </div>

                            <div class="carrier">
                                ${escapeHTML(pkg.carrier)}
                            </div>

                            <span
                                class="status ${pkg.status}"
                            >
                                ${statusName(pkg.status)}
                            </span>

                        </div>

                    </div>


                    <div class="tracking">
                        ${escapeHTML(pkg.tracking || "No tracking number")}
                    </div>


                    ${
                        pkg.delivery
                            ?
                            `<div class="delivery">
                                📅 Expected:
                                ${formatDate(pkg.delivery)}
                            </div>`
                            :
                            ""
                    }


                    ${
                        pkg.note
                            ?
                            `<div class="note">
                                📝 ${escapeHTML(pkg.note)}
                            </div>`
                            :
                            ""
                    }


                    <div class="actions">

                        ${
                            pkg.tracking
                                ?
                                `<button
                                    onclick="copyTracking('${escapeAttribute(pkg.tracking)}')"
                                >
                                    📋 Copy
                                </button>`
                                :
                                ""
                        }

                        <button
                            onclick="editPackage(${pkg.id})"
                        >
                            ✏️ Edit
                        </button>

                        <button
                            onclick="deletePackage(${pkg.id})"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                </article>

                `;

            })
            .join("");

}


/* STATUS */

function statusName(status) {

    const names = {

        ordered:
            "🛍️ Ordered",

        transit:
            "🚚 In Transit",

        out:
            "🛵 Out for Delivery",

        delivered:
            "✅ Delivered",

        delayed:
            "⚠️ Delayed"

    };

    return (
        names[status] ||
        "📦 Package"
    );

}


/* DATE */

function formatDate(date) {

    if (!date) {
        return "";
    }

    return new Date(date)
        .toLocaleDateString(
            undefined,
            {
                month: "short",
                day: "numeric",
                year: "numeric"
            }
        );

}


/* OPEN */

function openModal() {

    editingId =
        null;

    document.getElementById("modalTitle")
        .innerText =
        "Add Package";

    document.getElementById("name")
        .value =
        "";

    document.getElementById("tracking")
        .value =
        "";

    document.getElementById("carrier")
        .value =
        "DHL";

    document.getElementById("status")
        .value =
        "ordered";

    document.getElementById("delivery")
        .value =
        "";

    document.getElementById("note")
        .value =
        "";


    document.getElementById("overlay")
        .classList.add("show");

}


/* CLOSE */

function closeModal() {

    document.getElementById("overlay")
        .classList.remove("show");

}


/* SAVE PACKAGE */

function savePackage() {

    const name =
        document.getElementById("name")
            .value
            .trim();

    const tracking =
        document.getElementById("tracking")
            .value
            .trim();

    const carrier =
        document.getElementById("carrier")
            .value;

    const status =
        document.getElementById("status")
            .value;

    const delivery =
        document.getElementById("delivery")
            .value;

    const note =
        document.getElementById("note")
            .value
            .trim();


    if (!name) {

        alert(
            "Please enter a package name."
        );

        return;

    }


    if (editingId !== null) {

        const pkg =
            packages.find(
                p => p.id === editingId
            );


        if (pkg) {

            pkg.name =
                name;

            pkg.tracking =
                tracking;

            pkg.carrier =
                carrier;

            pkg.status =
                status;

            pkg.delivery =
                delivery;

            pkg.note =
                note;

        }

    } else {

        packages.unshift({

            id:
                Date.now(),

            name:
                name,

            tracking:
                tracking,

            carrier:
                carrier,

            status:
                status,

            delivery:
                delivery,

            note:
                note

        });

    }


    saveData();

    closeModal();

    render();

}


/* EDIT */

function editPackage(id) {

    const pkg =
        packages.find(
            p => p.id === id
        );


    if (!pkg) {
        return;
    }


    editingId =
        id;


    document.getElementById("modalTitle")
        .innerText =
        "Edit Package";


    document.getElementById("name")
        .value =
        pkg.name;

    document.getElementById("tracking")
        .value =
        pkg.tracking || "";

    document.getElementById("carrier")
        .value =
        pkg.carrier;

    document.getElementById("status")
        .value =
        pkg.status;

    document.getElementById("delivery")
        .value =
        pkg.delivery || "";

    document.getElementById("note")
        .value =
        pkg.note || "";


    document.getElementById("overlay")
        .classList.add("show");

}


/* DELETE */

function deletePackage(id) {

    const pkg =
        packages.find(
            p => p.id === id
        );


    if (!pkg) {
        return;
    }


    if (
        !confirm(
            'Delete "' +
            pkg.name +
            '"?'
        )
    ) {
        return;
    }


    packages =
        packages.filter(
            p => p.id !== id
        );


    saveData();

    render();

}


/* COPY */

function copyTracking(value) {

    navigator.clipboard
        .writeText(value)
        .then(
            () =>
                alert(
                    "Tracking number copied!"
                )
        )
        .catch(
            () =>
                alert(
                    "Could not copy tracking number."
                )
        );

}


/* ESCAPE */

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/*
    Used only for safely passing
    tracking text into onclick.
*/

function escapeAttribute(text) {

    return String(text)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'");
}


/* OUTSIDE MODAL */

document
    .getElementById("overlay")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {
                closeModal();
            }

        }
    );


/* START */

render();

</script>

</body>
</html>
