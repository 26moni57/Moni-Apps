<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhereDidIPutIt?</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff4eb;
    color: #25232a;
}

.app {
    max-width: 420px;
    min-height: 100vh;
    margin: auto;
    padding-bottom: 90px;
}

/* Header */

.header {
    padding: 27px 20px 23px;
    background: linear-gradient(135deg, #ff7043, #ff936f);
    color: white;
    border-radius: 0 0 30px 30px;
}

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: 800;
}

.count {
    background: rgba(255,255,255,.2);
    padding: 7px 11px;
    border-radius: 20px;
    font-size: 12px;
}

.header h1 {
    margin: 28px 0 5px;
    font-size: 29px;
}

.header p {
    margin: 0;
    opacity: .85;
}

/* Content */

.content {
    padding: 20px;
}

/* Search */

.search {
    position: relative;
}

.search input {
    width: 100%;
    padding: 16px 18px 16px 46px;
    border: none;
    border-radius: 17px;
    background: white;
    box-shadow: 0 6px 20px rgba(100,50,20,.08);
    outline: none;
    font-size: 14px;
}

.search-icon {
    position: absolute;
    left: 17px;
    top: 15px;
}

/* Filter */

.filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 15px 0 4px;
}

.filter {
    white-space: nowrap;
    border: 0;
    padding: 10px 14px;
    border-radius: 13px;
    background: white;
    cursor: pointer;
}

.filter.active {
    background: #ff7043;
    color: white;
}

/* Item */

.item {
    background: white;
    border-radius: 21px;
    padding: 17px;
    margin-top: 12px;
    box-shadow: 0 6px 20px rgba(100,50,20,.06);
}

.item-top {
    display: flex;
    align-items: center;
    gap: 13px;
}

.item-icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    background: #fff0e9;
    border-radius: 15px;
    font-size: 24px;
}

.item-info {
    flex: 1;
}

.item-info strong {
    display: block;
    font-size: 16px;
}

.item-info small {
    color: #999;
    font-size: 11px;
}

.favorite {
    border: 0;
    background: none;
    font-size: 21px;
    cursor: pointer;
}

.location {
    margin-top: 13px;
    padding: 13px;
    background: #fff8f4;
    border-radius: 13px;
    font-size: 14px;
}

.location span {
    color: #888;
    font-size: 11px;
    display: block;
    margin-bottom: 4px;
}

.item-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.item-actions button {
    flex: 1;
    border: 0;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
}

.edit {
    background: #fff0e9;
    color: #e85f38;
}

.delete {
    background: #fff0f0;
    color: #e74c3c;
}

/* Empty */

.empty {
    text-align: center;
    padding: 65px 20px;
    color: #8d8580;
}

.empty-icon {
    font-size: 55px;
}

/* Floating */

.add {
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 60px;
    height: 60px;
    border: 0;
    border-radius: 20px;
    background: #ff7043;
    color: white;
    font-size: 30px;
    box-shadow: 0 10px 25px rgba(255,112,67,.35);
    cursor: pointer;
}

/* Modal */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: flex-end;
    justify-content: center;
}

.overlay.show {
    display: flex;
}

.modal {
    width: min(420px,100%);
    background: white;
    padding: 24px 20px 30px;
    border-radius: 28px 28px 0 0;
}

.modal h2 {
    margin-top: 0;
}

.modal input,
.modal select {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 13px;
    margin-bottom: 10px;
    outline: none;
}

.save {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 14px;
    background: #ff7043;
    color: white;
    font-weight: bold;
}

.cancel {
    width: 100%;
    border: 0;
    background: transparent;
    padding: 14px;
    color: #777;
}
</style>
</head>

<body>

<div class="app">

    <!-- Header -->

    <header class="header">

        <div class="header-top">

            <div class="logo">
                🔑 WhereDidIPutIt?
            </div>

            <div
                class="count"
                id="count"
            >
                0 items
            </div>

        </div>

        <h1>Find it fast.</h1>

        <p>
            Remember where you keep your important things.
        </p>

    </header>


    <main class="content">

        <!-- Search -->

        <div class="search">

            <span class="search-icon">
                🔍
            </span>

            <input
                id="search"
                type="text"
                placeholder="Search item or location..."
                oninput="renderItems()"
            >

        </div>


        <!-- Filters -->

        <div class="filters">

            <button
                class="filter active"
                onclick="setFilter('All', this)"
            >
                All
            </button>

            <button
                class="filter"
                onclick="setFilter('Important', this)"
            >
                ⭐ Important
            </button>

            <button
                class="filter"
                onclick="setFilter('Documents', this)"
            >
                📄 Documents
            </button>

            <button
                class="filter"
                onclick="setFilter('Electronics', this)"
            >
                🔌 Electronics
            </button>

            <button
                class="filter"
                onclick="setFilter('Other', this)"
            >
                📦 Other
            </button>

        </div>


        <!-- Items -->

        <section id="items"></section>

    </main>

</div>


<!-- Add -->

<button
    class="add"
    onclick="openModal()"
>
    +
</button>


<!-- Modal -->

<div
    class="overlay"
    id="overlay"
>

    <div class="modal">

        <h2 id="modalTitle">
            Save an Item
        </h2>

        <input
            id="itemName"
            type="text"
            placeholder="Item name"
        >

        <input
            id="itemLocation"
            type="text"
            placeholder="Where did you put it?"
        >

        <select id="itemCategory">

            <option value="Other">
                📦 Other
            </option>

            <option value="Important">
                ⭐ Important
            </option>

            <option value="Documents">
                📄 Documents
            </option>

            <option value="Electronics">
                🔌 Electronics
            </option>

        </select>

        <button
            class="save"
            onclick="saveItem()"
        >
            Save Item
        </button>

        <button
            class="cancel"
            onclick="closeModal()"
        >
            Cancel
        </button>

    </div>

</div>


<script>

/*
    WhereDidIPutIt?
    Item location memory app
*/


const defaultItems = [

    {
        id: 1,
        name: "Passport",
        location: "Desk drawer",
        category: "Documents",
        favorite: true,
        date: "Today"
    },

    {
        id: 2,
        name: "Phone charger",
        location: "Bedside table",
        category: "Electronics",
        favorite: false,
        date: "Yesterday"
    },

    {
        id: 3,
        name: "House keys",
        location: "Entrance shelf",
        category: "Important",
        favorite: true,
        date: "Today"
    }

];


let items =
    JSON.parse(
        localStorage.getItem("whereDidIPutIt")
    ) || defaultItems;


let activeFilter = "All";

let editingId = null;


/* Save */

function saveData() {

    localStorage.setItem(
        "whereDidIPutIt",
        JSON.stringify(items)
    );

}


/* Icon */

function getIcon(category) {

    if (category === "Important")
        return "⭐";

    if (category === "Documents")
        return "📄";

    if (category === "Electronics")
        return "🔌";

    return "📦";

}


/* Render */

function renderItems() {

    const container =
        document.getElementById("items");

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    let filtered =
        items.filter(item => {

            const matchesFilter =
                activeFilter === "All" ||
                (
                    activeFilter === "Important"
                    && item.favorite
                )
                ||
                item.category === activeFilter;


            const matchesSearch =
                item.name
                    .toLowerCase()
                    .includes(search)
                ||
                item.location
                    .toLowerCase()
                    .includes(search);


            return (
                matchesFilter &&
                matchesSearch
            );

        });


    document.getElementById("count").innerText =
        items.length +
        (items.length === 1 ? " item" : " items");


    if (filtered.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔍
                </div>

                <h3>
                    Nothing found
                </h3>

                <p>
                    Try another search or add a new item.
                </p>

            </div>

        `;

        return;
    }


    container.innerHTML =
        filtered.map(item => `

            <article class="item">

                <div class="item-top">

                    <div class="item-icon">
                        ${getIcon(item.category)}
                    </div>

                    <div class="item-info">

                        <strong>
                            ${escapeHTML(item.name)}
                        </strong>

                        <small>
                            ${escapeHTML(item.category)}
                            ·
                            ${escapeHTML(item.date)}
                        </small>

                    </div>

                    <button
                        class="favorite"
                        onclick="toggleFavorite(${item.id})"
                    >
                        ${item.favorite ? "⭐" : "☆"}
                    </button>

                </div>


                <div class="location">

                    <span>
                        📍 STORED AT
                    </span>

                    ${escapeHTML(item.location)}

                </div>


                <div class="item-actions">

                    <button
                        class="edit"
                        onclick="editItem(${item.id})"
                    >
                        ✏️ Edit
                    </button>

                    <button
                        class="delete"
                        onclick="deleteItem(${item.id})"
                    >
                        🗑️ Delete
                    </button>

                </div>

            </article>

        `).join("");

}


/* Filter */

function setFilter(filter, button) {

    activeFilter = filter;

    document
        .querySelectorAll(".filter")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");

    renderItems();

}


/* Open modal */

function openModal() {

    editingId = null;

    document.getElementById("modalTitle").innerText =
        "Save an Item";

    document.getElementById("itemName").value =
        "";

    document.getElementById("itemLocation").value =
        "";

    document.getElementById("itemCategory").value =
        "Other";

    document
        .getElementById("overlay")
        .classList.add("show");

    document
        .getElementById("itemName")
        .focus();

}


/* Close */

function closeModal() {

    document
        .getElementById("overlay")
        .classList.remove("show");

}


/* Save item */

function saveItem() {

    const name =
        document
            .getElementById("itemName")
            .value
            .trim();

    const location =
        document
            .getElementById("itemLocation")
            .value
            .trim();

    const category =
        document
            .getElementById("itemCategory")
            .value;


    if (!name || !location) {

        alert(
            "Please enter the item and its location."
        );

        return;

    }


    if (editingId !== null) {

        const item =
            items.find(
                item => item.id === editingId
            );


        if (item) {

            item.name = name;

            item.location = location;

            item.category = category;

            item.date = "Updated";

        }

    } else {

        items.unshift({

            id: Date.now(),

            name: name,

            location: location,

            category: category,

            favorite: false,

            date: "Just now"

        });

    }


    saveData();

    closeModal();

    renderItems();

}


/* Edit */

function editItem(id) {

    const item =
        items.find(
            item => item.id === id
        );


    if (!item) return;


    editingId = id;


    document.getElementById("modalTitle").innerText =
        "Edit Item";


    document.getElementById("itemName").value =
        item.name;


    document.getElementById("itemLocation").value =
        item.location;


    document.getElementById("itemCategory").value =
        item.category;


    document
        .getElementById("overlay")
        .classList.add("show");

}


/* Delete */

function deleteItem(id) {

    const item =
        items.find(
            item => item.id === id
        );


    if (!item) return;


    if (
        !confirm(
            'Delete "' +
            item.name +
            '"?'
        )
    ) {

        return;

    }


    items =
        items.filter(
            item => item.id !== id
        );


    saveData();

    renderItems();

}


/* Favorite */

function toggleFavorite(id) {

    const item =
        items.find(
            item => item.id === id
        );


    if (!item) return;


    item.favorite =
        !item.favorite;


    saveData();

    renderItems();

}


/* Escape */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* Close outside modal */

document
    .getElementById("overlay")
    .addEventListener(
        "click",
        function(event) {

            if (event.target === this) {

                closeModal();

            }

        }
    );


/* Start */

renderItems();

</script>

</body>
</html>
