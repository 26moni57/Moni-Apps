<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>ReceiptPocket Tracker</title>

<style>
/* CSS PALETTE: Midnight Ocean Blue Style Uniform Look */
:root{
--bg:#0f172a;
--card:#1e293b;
--text:#f8fafc;
--muted:#94a3b8;
--line:#334155;
--primary:#2563eb;
--primary2:#3b82f6;
--soft:#1e3a8a;
--green:#10b981;
--green-soft:#064e3b;
--danger:#ef4444;
--shadow:0 10px 30px rgba(15,23,42,.4)
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text)
}

button,input,select{font:inherit}
button{cursor:pointer}

.app{
width:100%;
max-width:430px;
min-height:100vh;
margin:auto;
overflow:hidden
}

/* HEADER */
.header{
position:relative;
padding:21px 18px 31px;
color:white;
background:linear-gradient(145deg,#1e3a8a,#2563eb 55%,#0d9488);
border-radius:0 0 31px 31px;
overflow:hidden
}

.header:before{
content:"";
position:absolute;
width:190px;
height:190px;
right:-90px;
top:-105px;
border-radius:50%;
background:rgba(255,255,255,.08)
}

.topbar{
position:relative;
z-index:2;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:9px
}

.brand-icon{
width:41px;
height:41px;
display:grid;
place-items:center;
border-radius:13px;
background:rgba(255,255,255,.15);
font-size:22px
}

.brand-name{
font-size:21px;
font-weight:850;
letter-spacing:-.5px
}

.theme{
width:40px;
height:40px;
border:0;
border-radius:13px;
background:rgba(255,255,255,.15);
color:#fff
}

.hero{
position:relative;
z-index:2;
margin-top:25px
}

.hero h1{
margin:0;
font-size:30px;
line-height:1.08;
letter-spacing:-.8px
}

.hero p{
margin:8px 0 0;
font-size:13px;
color:rgba(255,255,255,.8)
}

/* CONTENT */
.content{padding:18px}

.card{
padding:17px;
margin-bottom:14px;
background:var(--card);
border:1px solid var(--line);
border-radius:21px;
box-shadow:var(--shadow)
}

.title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px
}

.title h2{
margin:0;
font-size:15px
}

.title span{
font-size:10px;
color:var(--muted)
}

/* OVERVIEW METRICS BLOCK GRID */
.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px
}

.stat{
padding:14px 7px;
text-align:center;
background:var(--bg);
border-radius:14px;
border:1px solid var(--line)
}

.stat strong{
display:block;
font-size:19px;
letter-spacing:-0.5px
}

.stat.highlight strong{
color:var(--green)
}

.stat span{
display:block;
margin-top:4px;
font-size:9px;
color:var(--muted);
text-transform:uppercase;
font-weight:700
}

/* RECEIPT ITEMS LEDGER LIST */
.receipt-item {
display:flex;
align-items:center;
gap:12px;
padding:12px 0;
border-bottom:1px solid var(--line)
}
.receipt-item:last-child{border-bottom:0}

.item-icon {
width:40px;
height:40px;
border-radius:12px;
background:var(--bg);
display:grid;
place-items:center;
font-size:18px;
flex-shrink:0
}

.item-details {
flex:1;
min-width:0
}

.item-title {
font-size:13px;
font-weight:750;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.item-meta {
font-size:9px;
color:var(--muted);
margin-top:3px
}

.item-cost-column {
text-align:right;
display:flex;
flex-direction:column;
align-items:flex-end;
gap:4px
}

.item-amount {
font-size:14px;
font-weight:800;
color:var(--text)
}

.btn-delete-row {
background:transparent;
border:0;
color:var(--danger);
font-size:10px;
font-weight:700;
padding:2px 5px
}

/* FLOATING ACTION INTERACTION TRIGGERS */
.fab{
position:fixed;
right:max(22px,calc((100vw - 430px)/2 + 22px));
bottom:23px;
width:59px;
height:59px;
border:0;
border-radius:20px;
background:var(--primary);
color:white;
font-size:28px;
box-shadow:0 12px 28px rgba(37,99,235,.28);
z-index:10;
display:flex;
align-items:center;
justify-content:center
}

/* MODAL DRAWER PATTERNS */
.overlay{
position:fixed;
inset:0;
z-index:20;
display:none;
align-items:flex-end;
justify-content:center;
background:rgba(0,0,0,.6)
}
.overlay.show{display:flex}

.modal{
width:min(430px,100%);
max-height:92vh;
overflow:auto;
padding:23px 18px 30px;
background:var(--card);
border-radius:28px 28px 0 0;
border-top:1px solid var(--line)
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:17px
}

.modal-head h2{
margin:0;
font-size:19px
}

.close{
width:35px;
height:35px;
border:0;
border-radius:10px;
background:var(--bg);
color:var(--text)
}

.field{margin-bottom:12px}

.field label{
display:block;
margin-bottom:6px;
font-size:11px;
font-weight:750;
color:var(--muted)
}

.field input,
.field select{
width:100%;
padding:13px;
border:1px solid var(--line);
border-radius:12px;
outline:none;
background:var(--bg);
color:var(--text)
}

.save{
width:100%;
padding:14px;
border:0;
border-radius:13px;
background:var(--primary);
color:white;
font-weight:800
}

.empty-state {
text-align:center;
padding:35px 15px;
color:var(--muted)
}
.empty-icon { font-size:40px; margin-bottom:6px; }

/* LIGHT THEME INVERSION OVERRIDE */
body.light-theme {
--bg:#f1f5f9;
--card:#ffffff;
--text:#0f172a;
--muted:#64748b;
--line:#cbd5e1;
--soft:#dbeafe;
--shadow:0 10px 30px rgba(51,65,85,0.06)
}
</style>
</head>head>

<body>

<div class="app">

<header class="header">
<div class="topbar">
<div class="brand">
<div class="brand-icon">🧾</div>
<div class="brand-name">ReceiptPocket</div>
</div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">☀️</button>
</div>

<div class="hero">
<h1>Track Outlays.<br>Simplify Expenses.</h1>
<p>Log purchase slips, trace categorization weights, and calculate costs locally.</p>
</div>
</header>

<main class="content">

<!-- LEDGER OVERVIEW SUMMARY CARDS -->
<section class="card">
<div class="stats">
<div class="stat highlight">
<strong id="totalSpent">$0.00</strong>
<span>Total Expenses</span>
</div>
<div class="stat">
<strong id="itemCount">0 Slips</strong>
<span>Logged Count</span>
</div>
</div>
</section>

<!-- EXPENDITURES LIST BLOCK -->
<section class="card">
<div class="title">
<h2>📊 Logged Entries Ledger</h2>
<span id="ledgerCountSpan">0 logged</span>
</div>

<div id="receiptsLogContainer">
<!-- Rendered dynamically by Javascript logic runtime execution -->
</div>
</section>

</main>

<!-- FLOATING INJECTION ACTION TRIGGER KEY -->
<button class="fab" onclick="openModal()">+</button>

<!-- EXPENSE CAPTURE CONTROL DRAWER OVERLAY -->
<div class="overlay" id="overlay">
<div class="modal">
<div class="modal-head">
<h2>Log New Purchase Slip</h2>
<button class="close" onclick="closeModal()">✕</button>
</div>

<div class="field">
<label>STORE / VENDOR ESTABLISHMENT NAME</label>
<input type="text" id="slipVendor" placeholder="e.g., Walmart Supercenter">
</div>

<div class="field">
<label>PURCHASE TRANSACTION DATE</label>
<input type="date" id="slipDate">
</div>

<div class="field">
<label>OUTLAY AMOUNT TOTAL ($)</label>
<input type="number" id="slipAmount" step="0.01" min="0" placeholder="0.00">
</div>

<div class="field">
<label>TRACKING LOG CATEGORY</label>
<select id="slipCategory">
<option value="Groceries">🛒 Groceries & Food</option>
<option value="Utilities">💡 Household Utilities</option>
<option value="Dining">🍔 Restaurants & Dining</option>
<option value="Travel">🚗 Transit & Travel</option>
<option value="Other">📦 Miscellaneous Misc</option>
</select>
</div>

<button class="save" onclick="logReceiptSlip()">Commit Entry to Log</button>
</div>
</div>

</div>

<script>
// Dictionary mapper configuration mapping categories to graphic elements icons
const categoryIcons = { Groceries: "🛒", Utilities: "💡", Dining: "🍔", Travel: "🚗", Other: "📦" };

// Fetch sandbox operational memory persistence lists
let transactions = JSON.parse(localStorage.getItem("receipt_pocket_slips")) || [
    { id: 1, vendor: "Whole Foods Market", date: "2026-08-24", amount: 64.25, category: "Groceries" },
    { id: 2, vendor: "Starbucks Coffee", date: "2026-08-25", amount: 12.80, category: "Dining" }
];

function toggleTheme() {
    document.body.classList.toggle("light-theme");
    const btn = document.getElementById("themeBtn");
    btn.innerText = document.body.classList.contains("light-theme") ? "🌙" : "☀️";
}

function openModal() {
    document.getElementById("overlay").classList.add("show");
    // Default system date form parameter initialization loop assignment configuration values shortcut
    document.getElementById("slipDate").valueAsDate = new Date();
}
function closeModal() { document.getElementById("overlay").classList.remove("show"); }

function logReceiptSlip() {
    const vendor = document.getElementById("slipVendor").value.trim();
    const date = document.getElementById("slipDate").value;
    const amount = parseFloat(document.getElementById("slipAmount").value);
    const category = document.getElementById("slipCategory").value;

    if (!vendor || !date || isNaN(amount) || amount <= 0) {
        return alert("Please supply complete, correct entry details configurations.");
    }

    transactions.push({ id: Date.now(), vendor, date, amount, category });
    saveAndRender();
    closeModal();

    // Reset input collection fields elements variables boundaries back to normal standard
    document.getElementById("slipVendor").value = "";
    document.getElementById("slipAmount").value = "";
}

function deleteTransaction(id) {
    transactions = transactions.filter(t => t.id !== id);
    saveAndRender();
}

function saveAndRender() {
    localStorage.setItem("receipt_pocket_slips", JSON.stringify(transactions));
    render();
}

function render() {
    const container = document.getElementById("receiptsLogContainer");
    
    // Accumulate total calculation calculations pipeline execution loop
    const grandSum = transactions.reduce((acc, curr) => acc + curr.amount, 0);
    
    document.getElementById("totalSpent").innerText = `$${grandSum.toFixed(2)}`;
document.getElementById("itemCount").innerText = ${transactions.length} Slips;document.getElementById("ledgerCountSpan").innerText = ${transactions.length} items;if(transactions.length === 0) {container.innerHTML =  <div class="empty-state"> <div class="empty-icon">📉</div> <h3>Ledger Empty</h3> <p>Tap the bottom drawer trigger key to append your first receipt asset log.</p> </div>;return;}container.innerHTML = transactions.map(t => <div class="receipt-item"> <div class="item-icon">${categoryIcons[t.category] || "📦"}</div> <div class="item-details"> <div class="item-title">${t.vendor}</div> <div class="item-meta">${t.date} • ${t.category}</div> </div> <div class="item-cost-column"> <div class="item-amount">$${t.amount.toFixed(2)}</div> <button class="btn-delete-row" onclick="deleteTransaction(${t.id})">Delete</button> </div> </div>).join("");}// Initial bootstrap trigger allocation processingrender(); </script></body> </html>
