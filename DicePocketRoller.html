<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#b91c1c">
<title>DicePocket Roller</title>

<style>
/* BRAND NEW CSS PALETTE: Retro Vegas Crimson & Gold Style Look */
:root{
--bg:#450a0a;
--card:#7f1d1d;
--text:#fef2f2;
--muted:#fca5a5;
--line:#b91c1c;
--primary:#eab308;
--primary2:#fde047;
--soft:#713f12;
--green:#10b981;
--green-soft:#064e3b;
--danger:#ef4444;
--shadow:0 10px 30px rgba(69,10,10,.6)
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text)
}

button,input,select{font:inherit}
button{cursor:pointer}

.app{
width:100%;
max-width:430px;
min-height:100vh;
margin:auto;
overflow:hidden
}

/* HEADER - SIGNATURE VEGAS ROUGE GRADIENT */
.header{
position:relative;
padding:21px 18px 31px;
color:white;
background:linear-gradient(145deg,#7f1d1d,#b91c1c 55%,#ea580c);
border-radius:0 0 31px 31px;
overflow:hidden;
border-bottom:3px solid var(--primary)
}

.header:before{
content:"";
position:absolute;
width:190px;
height:190px;
right:-90px;
top:-105px;
border-radius:50%;
background:rgba(255,255,255,.07)
}

.topbar{
position:relative;
z-index:2;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:9px
}

.brand-icon{
width:41px;
height:41px;
display:grid;
place-items:center;
border-radius:13px;
background:rgba(255,255,255,.15);
font-size:22px
}

.brand-name{
font-size:21px;
font-weight:850;
letter-spacing:-.5px
}

.theme{
width:40px;
height:40px;
border:0;
border-radius:13px;
background:rgba(255,255,255,.15);
color:#fff
}

.hero{
position:relative;
z-index:2;
margin-top:25px
}

.hero h1{
margin:0;
font-size:30px;
line-height:1.08;
letter-spacing:-.8px
}

.hero p{
margin:8px 0 0;
font-size:13px;
color:rgba(255,255,255,.8)
}

/* CONTENT */
.content{padding:18px}

.card{
padding:17px;
margin-bottom:14px;
background:var(--card);
border:1px solid var(--line);
border-radius:21px;
box-shadow:var(--shadow)
}

.title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px
}

.title h2{
margin:0;
font-size:15px
}

/* INTERACTIVE DICE SCREEN ELEMENT */
.dice-box-panel {
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:20px 0;
position:relative
}

.vegas-die {
width:90px;
height:90px;
background:#fef2f2;
color:#450a0a;
border-radius:18px;
display:grid;
place-items:center;
font-size:46px;
font-weight:900;
box-shadow:0 8px 20px rgba(0,0,0,0.3);
border:3px solid var(--primary);
transition:transform 0.15s ease-out;
user-select:none
}

.vegas-die.rolling-animation {
transform:scale(0.9) rotate(45deg);
opacity:0.8
}

/* DICE MACRO SELECTOR BUTTONS SEGMENT */
.die-selectors-grid {
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
margin-top:2px
}

.btn-die-type {
padding:11px 2px;
border:1px solid var(--line);
border-radius:11px;
background:var(--bg);
color:var(--muted);
font-size:12px;
font-weight:800;
text-align:center
}
.btn-die-type.active {
background:var(--primary);
color:var(--bg);
border-color:var(--primary)
}

.btn-trigger-roll {
width:100%;
padding:14px;
border:0;
border-radius:14px;
background:var(--primary);
color:var(--bg);
font-weight:850;
font-size:15px;
transition:opacity 0.2s
}
.btn-trigger-roll:active { opacity:0.9 }

/* LOG ROLL HISTORY MATRIX STACK */
.history-row {
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
border-bottom:1px solid var(--line);
font-size:13px
}
.history-row:last-child { border-bottom:0 }

.history-label { font-weight:750; color:var(--text); }
.history-val { font-size:15px; font-weight:900; color:var(--primary2); }

/* LIGHT SAND STYLESHEET OVERRIDE SKIN INVERSION */
body.light-theme {
--bg:#fff7ed;
--card:#ffedd5;
--text:#7c2d12;
--muted:#ea580c;
--line:#fed7aa;
--soft:#ffedd5;
--shadow:0 10px 30px rgba(234,88,12,0.06)
}
body.light-theme .vegas-die {
background:#7c2d12;
color:#fff7ed
}
</style>
</head>

<body>

<div class="app">

<header class="header">
<div class="topbar">
<div class="brand">
<div class="brand-icon">🎲</div>
<div class="brand-name">DicePocket</div>
</div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">☀️</button>
</div>

<div class="hero">
<h1>Vegas Roller.<br>Random Probability.</h1>
<p>Simulate polyhedral multi-sided dice tosses with secure system probability matrix loops.</p>
</div>
</header>

<main class="content">

<!-- DICE CANVAS VIEW DISPLAY SCREEN -->
<section class="card">
<div class="dice-box-panel">
<div id="dieVisualNode" class="vegas-die">6</div>
</div>
</section>

<!-- LAUNCH CONTROLLER TRIGGER KEY CONTAINER -->
<section class="card">
<button class="btn-trigger-roll" onclick="fireRandomRollSession()">Throw Polyhedral Die</button>
</section>

<!-- CONFIGURE DIE TYPE SIDE MODES PARAMETERS -->
<section class="card">
<div class="title">
<h2>⚙️ Select Polyhedral Geometry</h2>
</div>
<div class="die-selectors-grid">
<button class="btn-die-type active" id="dieD6" onclick="setPolyhedralSides(6)">D6</button>
<button class="btn-die-type" id="dieD10" onclick="setPolyhedralSides(10)">D10</button>
<button class="btn-die-type" id="dieD12" onclick="setPolyhedralSides(12)">D12</button>
<button class="btn-die-type" id="dieD20" onclick="setPolyhedralSides(20)">D20</button>
</div>
</section>

<!-- RECENT TOSS LEDGER BOX TRACKER -->
<section class="card">
<div class="title">
<h2>📜 Recent Roll Log Stream</h2>
</div>
<div id="diceHistoryLogBox">
<!-- Generated dynamically via Javascript actions loops -->
</div>
</section>

</main>

</div>

<script>
let activePolyhedralSideTarget = 6;
let rollingLockoutState = false;
let rolledHistoriesArray = [];

function toggleTheme() {
    document.body.classList.toggle("light-theme");
    const btn = document.getElementById("themeBtn");
    btn.innerText = document.body.classList.contains("light-theme") ? "🌙" : "☀️";
}

function setPolyhedralSides(sidesCount) {
    if(rollingLockoutState) return;
    activePolyhedralSideTarget = sidesCount;
    
    // Toggle design highlight state loops configurations parameters
    document.querySelectorAll(".btn-die-type").forEach(btn => btn.classList.remove("active"));
    document.getElementById(`dieD${sidesCount}`).classList.add("active");
    
    document.getElementById("dieVisualNode").innerText = sidesCount;
}

function fireRandomRollSession() {
    if(rollingLockoutState) return;
    rollingLockoutState = true;
    
    const node = document.getElementById("dieVisualNode");
    node.classList.add("rolling-animation");
    
    // Synthesis localized rolling bleep sound metrics frequency safely
    triggerSynthesizedTickTone(440);

    let animationTicsCount = 0;
    const rollingIntervalEngine = setInterval(() => {
        // Toggle flashing random numbers loops for sensory feedback actions
        node.innerText = Math.floor(Math.random() * activePolyhedralSideTarget) + 1;
        animationTicsCount++;
        
        if (animationTicsCount >= 4) {
            clearInterval(rollingIntervalEngine);
            
            // Core generation probability engine sequence call
            const ultimateResultScore = Math.floor(Math.random() * activePolyhedralSideTarget) + 1;
            node.innerText = ultimateResultScore;
            node.classList.remove("rolling-animation");
            
            triggerSynthesizedTickTone(587); // High resolution pitch landing feedback sound node
            
            // Append outcome metrics straight to rolling log streams memory lists
            rolledHistoriesArray.unshift({
                id: Date.now(),
                label: `D${activePolyhedralSideTarget} Geometry Roll`,
                result: ultimateResultScore
            });
            
            rollingLockoutState = false;
            redrawLogHistoryView();
        }
    }, 90);
}

function triggerSynthesizedTickTone(frequencyHzValue) {
    if (window.AudioContext || window.webkitAudioContext) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = "sine";
            osc.frequency.setValueAtTime(frequencyHzValue, ctx.currentTime);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
        } catch (e) {}
    }
}

function redrawLogHistoryView() {
    const container = document.getElementById("diceHistoryLogBox");
    
    if(rolledHistoriesArray.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:10px; color:var(--muted); font-size:12px;">Roll the die to populate records history streams.</div>`;
        return;
    }
    
    // Clamp slice array items limits to preserve look heights footprint bounds
    const topSlices = rolledHistoriesArray.slice(0, 4);
    container.innerHTML = topSlices.map(log => `
        <div class="history-row">
            <span class="history-label">🎲 ${log.label}</span>
            <span class="history-val">Score: ${log.result}</span>
        </div>
    `).join("");
}

// Initial placeholder display synchronization load loop checks triggers
redrawLogHistoryView();
</script>

</body>
</html>
