<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#22c55e">
<title>RollerCode Crypto Desk</title>

<style>
/* BRAND NEW CSS PALETTE: Matrix Terminal Green & Onyx Slate Look */
:root{
--bg:#020617;
--card:#0f172a;
--text:#22c55e;
--text-bright:#4ade80;
--muted:#475569;
--line:#1e293b;
--primary:#22c55e;
--primary2:#86efac;
--soft:#052e16;
--danger:#ef4444;
--shadow:0 12px 35px rgba(34,197,94,0.1)
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:"Courier New", Courier, monospace;
background:var(--bg);
color:var(--text);
font-weight:700
}

button,input,select{font:inherit}
button{cursor:pointer}

.app{
width:100%;
max-width:430px;
min-height:100vh;
margin:auto;
overflow:hidden
}

/* HEADER - TERMINAL RADAR NEON GLOW GRADIENT */
.header{
position:relative;
padding:21px 18px 31px;
color:white;
background:linear-gradient(145deg,#020617,#0f172a 65%,#14532d);
border-radius:0 0 31px 31px;
overflow:hidden;
border-bottom:3px solid var(--primary)
}

.header:before{
content:"";
position:absolute;
width:190px;
height:190px;
right:-90px;
top:-105px;
border-radius:50%;
background:rgba(34,197,94,0.06);
border:1px dashed var(--primary)
}

.topbar{
position:relative;
z-index:2;
display:flex;
align-items:center;
justify-content:space-between;
font-family:system-ui, -apple-system, sans-serif
}

.brand{
display:flex;
align-items:center;
gap:9px
}

.brand-icon{
width:41px;
height:41px;
display:grid;
place-items:center;
border-radius:13px;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.15);
font-size:20px
}

.brand-name{
font-size:21px;
font-weight:900;
letter-spacing:-.5px;
color:var(--primary2)
}

.theme{
width:40px;
height:40px;
border:0;
border-radius:13px;
background:rgba(255,255,255,.04);
color:#fff
}

.hero{
position:relative;
z-index:2;
margin-top:25px
}

.hero h1{
margin:0;
font-size:28px;
line-height:1.1;
text-transform:uppercase;
letter-spacing:-0.5px
}

.hero p{
margin:8px 0 0;
font-size:12px;
font-family:system-ui, sans-serif;
color:#94a3b8
}

/* CONTENT CONTAINER */
.content{padding:18px}

.card{
padding:17px;
margin-bottom:14px;
background:var(--card);
border:1px solid var(--line);
border-radius:21px;
box-shadow:var(--shadow)
}

.title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px;
font-family:system-ui, sans-serif
}

.title h2{
margin:0;
font-size:13px;
text-transform:uppercase;
color:#94a3b8;
letter-spacing:0.5px
}

/* CODE DIGITS TERMINAL BLOCK DISPLAY PANEL */
.terminal-display-panel {
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:20px 0;
position:relative;
cursor:pointer;
background:var(--bg);
border:1px solid var(--line);
border-radius:16px
}

.token-digits {
font-size:46px;
font-weight:900;
color:var(--text-bright);
letter-spacing:4px;
text-shadow:0 0 12px rgba(34,197,94,0.4);
text-align:center
}

/* REALTIME AUTOMATED EXPIRATION TICKER PROGRESS BAR */
.expiration-track-container {
width:80%;
height:6px;
background:var(--line);
border-radius:20px;
margin-top:14px;
overflow:hidden
}

.expiration-fill-bar {
width:100%;
height:100%;
background:var(--primary);
box-shadow:0 0 8px var(--text-bright);
transition:width 0.1s linear
}

/* FIELD MODIFICATION SLIDERS CONFIG */
.field{
margin-bottom:6px;
display:flex;
flex-direction:column;
gap:6px;
font-family:system-ui, sans-serif
}

.field label{
font-size:11px;
font-weight:750;
color:#94a3b8;
text-transform:uppercase;
letter-spacing:0.5px
}

.slider-track-box {
display:flex;
align-items:center;
gap:12px
}

.slider-track-box input[type="range"]{
flex:1;
accent-color:var(--primary);
cursor:pointer
}

.length-lbl {
font-size:15px;
font-weight:900;
font-family:"Courier New",Courier,monospace;
color:var(--text-bright);
min-width:20px
}

/* LEDGER LOG HISTORIES STACK FEED */
.log-row {
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
border-bottom:1px solid var(--line);
font-size:13px
}
.log-row:last-child { border-bottom:0 }

.log-label { font-weight:700; color:#94a3b8; }
.log-val { font-family:"Courier New",Courier,monospace; font-weight:900; color:var(--text-bright); letter-spacing:1px; }

/* RECTIFIED GLITCH NOTIFICATION TOAST OVERLAY */
.toast{
position:fixed;
left:50%;
bottom:40px;
z-index:50;
transform:translate(-50%,20px);
opacity:0;
padding:11px 15px;
border-radius:12px;
background:var(--text-bright);
color:var(--bg);
font-size:11px;
font-weight:900;
white-space:nowrap;
transition:.25s;
pointer-events:none;
box-shadow:0 10px 25px rgba(34,197,94,0.3);
font-family:system-ui, sans-serif;
text-transform:uppercase
}

.toast.show{
opacity:1;
transform:translate(-50%,0)
}

/* CYBER ALLOY SKIN LIGHT OVERRIDE */
body.light-theme {
--bg:#f0fdf4;
--card:#ffffff;
--text:#166534;
--text-bright:#15803d;
--line:#dcfce7;
--shadow:0 10px 25px rgba(22,101,52,0.04)
}
</style>
</head>

<body>

<div class="app">

<header class="header">
<div class="topbar">
<div class="brand">
<div class="brand-icon">📟</div>
<div class="brand-name">RollerCode</div>
</div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">☀️</button>
</div>

<div class="hero">
<h1>MFA Cipher Generator.<br>Dynamic Core Rotation.</h1>
<p>Compute synchronized access tokens locally using automatic periodic timestamp arrays.</p>
</div>
</header>

<main class="content">

<!-- INTERACTIVE DISPLAY NODE SCREEN BACKDROP -->
<section class="card" style="padding:10px;">
<div class="terminal-display-panel" onclick="copyTokenToClipboardRegistry()" title="Tap to copy token code">
<div id="tokenDigitsDisplayNode" class="token-digits">------</div>
<div class="expiration-track-container">
<div id="expirationFillNode" class="expiration-fill-bar"></div>
</div>
</div>
<div style="text-align:center; margin-top:8px; font-size:10px; color:var(--muted); font-family:system-ui, sans-serif; font-weight:700;">TAP CONTROLLER PANEL TO COPY TOKEN</div>
</section>

<!-- ADJUST PARAMETERS CONFIG SYSTEM CARDS -->
<section class="card">
<div class="field">
<label>Token Character String Length</label>
<div class="slider-track-box">
<input type="range" id="tokenLengthSliderInput" min="4" max="8" value="6" oninput="handleLengthAdjustmentUpdate(this.value)">
<span class="length-lbl" id="lblLengthIndicator">6</span>
</div>
</div>
</section>

<!-- RECENT HISTORY REGISTRY LEDGER STACK FEED -->
<section class="card">
<div class="title">
<h2>📜 Archived Rotation Stream</h2>
</div>
<div id="rotationHistoryLogBox">
<!-- Generated dynamically via Javascript actions loops execution -->
</div>
</section>

</main>

<!-- COMPLETED ACTION CONFIRMATION TOAST POPUP -->
<div class="toast" id="toast">Token secure copied!</div>

</div>

<script>
const TOTAL_CYCLE_DURATION_SECONDS = 30;

let rotationIntervalId = null;
let countdownIntervalId = null;
let currentTokenLengthSetting = 6;
let secondsRemainingInActiveCycle = TOTAL_CYCLE_DURATION_SECONDS;
let historicalRotatedTokensArray = [];

function toggleTheme() {
    document.body.classList.toggle("light-theme");
    const btn = document.getElementById("themeBtn");
    btn.innerText = document.body.classList.contains("light-theme") ? "🌙" : "☀️";
}

function handleLengthAdjustmentUpdate(lengthValueInt) {
    currentTokenLengthSetting = parseInt(lengthValueInt);
    document.getElementById("lblLengthIndicator").innerText = currentTokenLengthSetting;
    executeTokenRotationCycle(); // Instant drop code transformation recalculation loops
}

function executeTokenRotationCycle() {
    const charactersPoolStr = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // Removed confusing lookalike items (0, 1, I, O)
    let generatedTokenString = "";
    
    for (let i = 0; i < currentTokenLengthSetting; i++) {
        const randomIndex = Math.floor(Math.random() * charactersPoolStr.length);
        generatedTokenString += charactersPoolStr[randomIndex];
    }
    
    document.getElementById("tokenDigitsDisplayNode").innerText = generatedTokenString;
    
    // Inject expired token straight down onto analytics history feeds lists
    const timeStr = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    historicalRotatedTokensArray.unshift({
        id: Date.now(),
        time: timeStr,
        valueCode: generatedTokenString
    });
    
    // Safety check array parameters bounds sizing
    if (historicalRotatedTokensArray.length > 4) historicalRotatedTokensArray.pop();
    
    secondsRemainingInActiveCycle = TOTAL_CYCLE_DURATION_SECONDS;
    redrawHistoricalRotationLogView();
    triggerTerminalTactileChime(880, 0.04); // Core rotation sync indicator beep node
}

function startTickerCountdownEngine() {
    if (rotationIntervalId) clearInterval(rotationIntervalId);
    if (countdownIntervalId) clearInterval(countdownIntervalId);

    executeTokenRotationCycle();

    countdownIntervalId = setInterval(() => {
        secondsRemainingInActiveCycle--;
        
        // Formulate relative percentages widths mappings metrics transformations values
        const ratioPercent = (secondsRemainingInActiveCycle / TOTAL_CYCLE_DURATION_SECONDS) * 100;
        document.getElementById("expirationFillNode").style.width = `${ratioPercent}%`;
        
        if (secondsRemainingInActiveCycle <= 0) {
            executeTokenRotationCycle();
        }
    }, 1000);
}

function copyTokenToClipboardRegistry() {
    const codeString = document.getElementById("tokenDigitsDisplayNode").innerText;
    if (codeString === "------") return;

    navigator.clipboard.writeText(codeString);
    
    const toast = document.getElementById("toast");
    toast.innerText = `Token [ ${codeString} ] Copied!`;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2000);
    
    triggerTerminalTactileChime(1200, 0.03); // Fast verification high feedback tone chime
}

function triggerTerminalTactileChime(frequencyHzValue, durationSecondsValue) {if (window.AudioContext || window.webkitAudioContext) {try {const ctx = new (window.AudioContext || window.webkitAudioContext)();const osc = ctx.createOscillator();const gain = ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type = "sine";osc.frequency.setValueAtTime(frequencyHzValue, ctx.currentTime);gain.gain.setValueAtTime(0.08, ctx.currentTime);osc.start();osc.stop(ctx.currentTime + durationSecondsValue);} catch (e) {}}}function redrawHistoricalRotationLogView() {const container = document.getElementById("rotationHistoryLogBox");if (historicalRotatedTokensArray.length <= 1) {container.innerHTML = <div style="text-align:center; padding:10px; color:var(--muted); font-size:12px;">Waiting for time tokens progression rotation streams logs...</div>;return;}// Discard index zero since it matches the active monitor view layout parameters character values boundsconst historicalSlices = historicalRotatedTokensArray.slice(1);container.innerHTML = historicalSlices.map(log => <div class="log-row"> <span class="log-label">📟 Cycle Sync at ${log.time}</span> <span class="log-val">${log.valueCode}</span> </div>).join("");}// Launch continuous execution rotation processes right on boot bootstrap lifecyclestartTickerCountdownEngine();</script></body></html>
