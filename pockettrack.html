<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PocketTrack</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f8f5;
    color: #1d2923;
}

.app {
    max-width: 420px;
    min-height: 100vh;
    margin: auto;
    padding-bottom: 90px;
}

/* Header */

.header {
    padding: 28px 20px 27px;
    color: white;
    background: linear-gradient(135deg, #167c52, #35a875);
    border-radius: 0 0 30px 30px;
}

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.month {
    font-size: 12px;
    background: rgba(255,255,255,.18);
    padding: 8px 11px;
    border-radius: 20px;
}

.header h1 {
    margin: 28px 0 5px;
    font-size: 30px;
}

.header p {
    margin: 0;
    opacity: .82;
}

/* Balance */

.balance {
    margin: -3px 20px 0;
    padding: 19px;
    background: white;
    border-radius: 22px;
    box-shadow: 0 8px 25px rgba(25,80,55,.10);
}

.balance-label {
    color: #89948e;
    font-size: 12px;
}

.balance-value {
    margin-top: 5px;
    font-size: 29px;
    font-weight: 800;
}

.balance-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.money-box {
    padding: 12px;
    border-radius: 14px;
    background: #f6faf7;
}

.money-box small {
    color: #8b958f;
    display: block;
    margin-bottom: 4px;
}

.income {
    color: #1a9a61;
}

.expense {
    color: #e15b4f;
}

/* Content */

.content {
    padding: 20px;
}

.section-title {
    font-size: 18px;
    margin: 8px 0 13px;
}

/* Search */

.search {
    position: relative;
}

.search input {
    width: 100%;
    padding: 15px 17px 15px 44px;
    border: 0;
    background: white;
    border-radius: 16px;
    outline: none;
    box-shadow: 0 5px 17px rgba(20,70,45,.06);
}

.search span {
    position: absolute;
    left: 15px;
    top: 14px;
}

/* Filters */

.filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 15px 0 3px;
}

.filter {
    white-space: nowrap;
    border: 0;
    background: white;
    padding: 10px 14px;
    border-radius: 13px;
    cursor: pointer;
    color: #68736d;
}

.filter.active {
    background: #167c52;
    color: white;
}

/* Summary */

.summary {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 9px;
    margin-top: 18px;
}

.summary-box {
    background: white;
    border-radius: 17px;
    padding: 14px 5px;
    text-align: center;
}

.summary-box strong {
    display: block;
    font-size: 18px;
}

.summary-box small {
    color: #8b958f;
    font-size: 10px;
}

/* Transaction */

.transaction {
    display: flex;
    align-items: center;
    gap: 12px;
    background: white;
    padding: 15px;
    margin-top: 10px;
    border-radius: 18px;
    box-shadow: 0 4px 14px rgba(20,70,45,.04);
}

.transaction-icon {
    width: 46px;
    height: 46px;
    border-radius: 15px;
    background: #eef8f3;
    display: grid;
    place-items: center;
    font-size: 22px;
}

.transaction-info {
    flex: 1;
    min-width: 0;
}

.transaction-info strong {
    display: block;
    font-size: 14px;
}

.transaction-info small {
    display: block;
    color: #929b96;
    margin-top: 5px;
    font-size: 10px;
}

.amount {
    font-weight: 800;
}

.amount.income {
    color: #1a9a61;
}

.amount.expense {
    color: #e15b4f;
}

.transaction-actions {
    display: flex;
    gap: 4px;
    margin-top: 6px;
}

.transaction-actions button {
    border: 0;
    background: transparent;
    font-size: 11px;
    color: #8b958f;
    cursor: pointer;
}

/* Empty */

.empty {
    text-align: center;
    color: #89948e;
    padding: 50px 20px;
}

.empty-icon {
    font-size: 48px;
}

/* Floating button */

.add {
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 60px;
    height: 60px;
    border: 0;
    border-radius: 20px;
    background: #167c52;
    color: white;
    font-size: 30px;
    box-shadow: 0 10px 25px rgba(22,124,82,.3);
    cursor: pointer;
}

/* Modal */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: flex-end;
    justify-content: center;
}

.overlay.show {
    display: flex;
}

.modal {
    width: min(420px,100%);
    background: white;
    padding: 24px 20px 30px;
    border-radius: 28px 28px 0 0;
}

.modal h2 {
    margin-top: 0;
}

.type-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.type-button {
    flex: 1;
    border: 1px solid #dfe5e1;
    background: white;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
}

.type-button.active {
    background: #eaf8f1;
    border-color: #167c52;
    color: #167c52;
}

.modal input,
.modal select {
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid #dfe5e1;
    border-radius: 13px;
    outline: none;
}

.save {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 14px;
    background: #167c52;
    color: white;
    font-weight: bold;
}

.cancel {
    width: 100%;
    border: 0;
    background: transparent;
    padding: 14px;
    color: #777;
}
</style>
</head>

<body>

<div class="app">

    <!-- Header -->

    <header class="header">

        <div class="header-top">

            <div class="logo">
                💰 PocketTrack
            </div>

            <div class="month" id="month">
                This month
            </div>

        </div>

        <h1>Know your money.</h1>

        <p>
            Keep track of every small expense.
        </p>

    </header>


    <!-- Balance -->

    <section class="balance">

        <div class="balance-label">
            CURRENT BALANCE
        </div>

        <div
            class="balance-value"
            id="balance"
        >
            ৳0
        </div>

        <div class="balance-stats">

            <div class="money-box">

                <small>
                    ↗ Income
                </small>

                <strong
                    class="income"
                    id="income"
                >
                    ৳0
                </strong>

            </div>

            <div class="money-box">

                <small>
                    ↘ Expenses
                </small>

                <strong
                    class="expense"
                    id="expenses"
                >
                    ৳0
                </strong>

            </div>

        </div>

    </section>


    <main class="content">

        <!-- Search -->

        <div class="search">

            <span>🔍</span>

            <input
                id="search"
                type="text"
                placeholder="Search transactions..."
                oninput="renderTransactions()"
            >

        </div>


        <!-- Filters -->

        <div class="filters">

            <button
                class="filter active"
                onclick="setFilter('all', this)"
            >
                All
            </button>

            <button
                class="filter"
                onclick="setFilter('income', this)"
            >
                ↗ Income
            </button>

            <button
                class="filter"
                onclick="setFilter('expense', this)"
            >
                ↘ Expenses
            </button>

        </div>


        <!-- Summary -->

        <div class="summary">

            <div class="summary-box">

                <strong id="transactionCount">
                    0
                </strong>

                <small>
                    Transactions
                </small>

            </div>

            <div class="summary-box">

                <strong id="average">
                    ৳0
                </strong>

                <small>
                    Average
                </small>

            </div>

            <div class="summary-box">

                <strong id="topCategory">
                    —
                </strong>

                <small>
                    Top category
                </small>

            </div>

        </div>


        <h2 class="section-title">
            Recent transactions
        </h2>


        <section id="transactions"></section>

    </main>

</div>


<!-- Add -->

<button
    class="add"
    onclick="openModal()"
>
    +
</button>


<!-- Modal -->

<div
    class="overlay"
    id="overlay"
>

    <div class="modal">

        <h2 id="modalTitle">
            Add Transaction
        </h2>


        <div class="type-buttons">

            <button
                class="type-button active"
                id="expenseButton"
                onclick="setType('expense')"
            >
                ↘ Expense
            </button>

            <button
                class="type-button"
                id="incomeButton"
                onclick="setType('income')"
            >
                ↗ Income
            </button>

        </div>


        <input
            id="title"
            type="text"
            placeholder="What was it?"
        >

        <input
            id="amount"
            type="number"
            min="0"
            placeholder="Amount"
        >

        <select id="category">

            <option value="Food">
                🍔 Food
            </option>

            <option value="Transport">
                🚗 Transport
            </option>

            <option value="Shopping">
                🛍️ Shopping
            </option>

            <option value="Bills">
                🧾 Bills
            </option>

            <option value="Health">
                ❤️ Health
            </option>

            <option value="Other">
                📦 Other
            </option>

        </select>


        <input
            id="date"
            type="date"
        >


        <button
            class="save"
            onclick="saveTransaction()"
        >
            Save Transaction
        </button>

        <button
            class="cancel"
            onclick="closeModal()"
        >
            Cancel
        </button>

    </div>

</div>


<script>

/*
    PocketTrack
    Simple personal finance tracker
*/


const defaultTransactions = [

    {
        id: 1,
        title: "Lunch",
        amount: 180,
        type: "expense",
        category: "Food",
        date: "2026-08-23"
    },

    {
        id: 2,
        title: "Freelance payment",
        amount: 5000,
        type: "income",
        category: "Other",
        date: "2026-08-22"
    },

    {
        id: 3,
        title: "Bus fare",
        amount: 60,
        type: "expense",
        category: "Transport",
        date: "2026-08-21"
    }

];


let transactions =
    JSON.parse(
        localStorage.getItem("pocketTrackTransactions")
    ) || defaultTransactions;


let activeFilter = "all";

let transactionType = "expense";

let editingId = null;


/* Currency */

function money(value) {

    return "৳" +
        Number(value)
            .toLocaleString("en-BD");

}


/* Save */

function saveData() {

    localStorage.setItem(
        "pocketTrackTransactions",
        JSON.stringify(transactions)
    );

}


/* Category icon */

function getCategoryIcon(category) {

    const icons = {

        Food: "🍔",

        Transport: "🚗",

        Shopping: "🛍️",

        Bills: "🧾",

        Health: "❤️",

        Other: "📦"

    };

    return icons[category] || "📦";

}


/* Render transactions */

function renderTransactions() {

    const container =
        document.getElementById("transactions");

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    let filtered =
        transactions.filter(item => {

            const matchesFilter =
                activeFilter === "all" ||
                item.type === activeFilter;


            const matchesSearch =
                item.title
                    .toLowerCase()
                    .includes(search)

                ||

                item.category
                    .toLowerCase()
                    .includes(search);


            return (
                matchesFilter &&
                matchesSearch
            );

        });


    if (filtered.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    💸
                </div>

                <h3>
                    No transactions found
                </h3>

                <p>
                    Add your first transaction.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML =
        filtered.map(item => `

            <article class="transaction">

                <div class="transaction-icon">
                    ${getCategoryIcon(item.category)}
                </div>

                <div class="transaction-info">

                    <strong>
                        ${escapeHTML(item.title)}
                    </strong>

                    <small>
                        ${escapeHTML(item.category)}
                        ·
                        ${formatDate(item.date)}
                    </small>

                    <div class="transaction-actions">

                        <button
                            onclick="editTransaction(${item.id})"
                        >
                            ✏️ Edit
                        </button>

                        <button
                            onclick="deleteTransaction(${item.id})"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                </div>

                <div
                    class="amount ${item.type}"
                >
                    ${item.type === "income" ? "+" : "-"}
                    ${money(item.amount)}
                </div>

            </article>

        `).join("");

}


/* Calculate summary */

function updateSummary() {

    const income =
        transactions
            .filter(item => item.type === "income")
            .reduce(
                (sum, item) =>
                    sum + Number(item.amount),
                0
            );


    const expenses =
        transactions
            .filter(item => item.type === "expense")
            .reduce(
                (sum, item) =>
                    sum + Number(item.amount),
                0
            );


    const balance =
        income - expenses;


    document.getElementById("balance").innerText =
        money(balance);

    document.getElementById("income").innerText =
        money(income);

    document.getElementById("expenses").innerText =
        money(expenses);


    document.getElementById("transactionCount").innerText =
        transactions.length;


    const average =
        transactions.length
            ? (
                transactions.reduce(
                    (sum, item) =>
                        sum + Number(item.amount),
                    0
                ) / transactions.length
            )
            : 0;


    document.getElementById("average").innerText =
        money(Math.round(average));


    const categoryTotals = {};


    transactions
        .filter(item => item.type === "expense")
        .forEach(item => {

            categoryTotals[item.category] =
                (
                    categoryTotals[item.category] || 0
                ) +
                Number(item.amount);

        });


    let top =
        "—";

    let highest =
        0;


    Object.keys(categoryTotals)
        .forEach(category => {

            if (
                categoryTotals[category] >
                highest
            ) {

                highest =
                    categoryTotals[category];

                top =
                    category;

            }

        });


    document.getElementById("topCategory").innerText =
        top;

}


/* Filter */

function setFilter(filter, button) {

    activeFilter =
        filter;


    document
        .querySelectorAll(".filter")
        .forEach(item =>
            item.classList.remove("active")
        );


    button.classList.add("active");


    renderTransactions();

}


/* Type */

function setType(type) {

    transactionType =
        type;


    document
        .getElementById("expenseButton")
        .classList.toggle(
            "active",
            type === "expense"
        );


    document
        .getElementById("incomeButton")
        .classList.toggle(
            "active",
            type === "income"
        );

}


/* Open modal */

function openModal() {

    editingId = null;

    transactionType = "expense";


    document.getElementById("modalTitle").innerText =
        "Add Transaction";


    document.getElementById("title").value =
        "";

    document.getElementById("amount").value =
        "";

    document.getElementById("category").value =
        "Food";

    document.getElementById("date").value =
        new Date()
            .toISOString()
            .split("T")[0];


    setType("expense");


    document
        .getElementById("overlay")
        .classList.add("show");

}


/* Close */

function closeModal() {

    document
        .getElementById("overlay")
        .classList.remove("show");

}


/* Save */

function saveTransaction() {

    const title =
        document
            .getElementById("title")
            .value
            .trim();


    const amount =
        Number(
            document
                .getElementById("amount")
                .value
        );


    const category =
        document
            .getElementById("category")
            .value;


    const date =
        document
            .getElementById("date")
            .value;


    if (!title || !amount || amount <= 0) {

        alert(
            "Please enter a title and valid amount."
        );

        return;

    }


    if (editingId !== null) {

        const item =
            transactions.find(
                item => item.id === editingId
            );


        if (item) {

            item.title =
                title;

            item.amount =
                amount;

            item.type =
                transactionType;

            item.category =
                category;

            item.date =
                date;

        }

    } else {

        transactions.unshift({

            id: Date.now(),

            title:

                title,

            amount:

                amount,

            type:

                transactionType,

            category:

                category,

            date:

                date

        });

    }


    saveData();

    closeModal();

    renderAll();

}


/* Edit */

function editTransaction(id) {

    const item =
        transactions.find(
            item => item.id === id
        );


    if (!item) return;


    editingId =
        id;


    document.getElementById("modalTitle").innerText =
        "Edit Transaction";


    document.getElementById("title").value =
        item.title;


    document.getElementById("amount").value =
        item.amount;


    document.getElementById("category").value =
        item.category;


    document.getElementById("date").value =
        item.date;


    setType(item.type);


    document
        .getElementById("overlay")
        .classList.add("show");

}


/* Delete */

function deleteTransaction(id) {

    const item =
        transactions.find(
            item => item.id === id
        );


    if (!item) return;


    if (
        !confirm(
            'Delete "' +
            item.title +
            '"?'
        )
    ) {

        return;

    }


    transactions =
        transactions.filter(
            item => item.id !== id
        );


    saveData();

    renderAll();

}


/* Format date */

function formatDate(date) {

    const today =
        new Date()
            .toISOString()
            .split("T")[0];


    if (date === today) {

        return "Today";

    }


    return new Date(date)
        .toLocaleDateString(
            undefined,
            {
                month: "short",
                day: "numeric"
            }
        );

}


/* Escape HTML */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* Render all */

function renderAll() {

    renderTransactions();

    updateSummary();

}


/* Modal outside click */

document
    .getElementById("overlay")
    .addEventListener(
        "click",
        function(event) {

            if (event.target === this) {

                closeModal();

            }

        }
    );


/* Month */

document.getElementById("month").innerText =
    new Date().toLocaleDateString(
        undefined,
        {
            month: "long",
            year: "numeric"
        }
    );


/* Start */

renderAll();

</script>

</body>
</html>
