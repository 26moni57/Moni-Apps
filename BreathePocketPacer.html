<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0d9488">
<title>BreathePocket Pacer</title>

<style>
/* BRAND NEW CSS PALETTE: Zen Teal & Lavender Silk Calm Look */
:root{
--bg:#071412;
--card:#0f2421;
--text:#f0fdfa;
--muted:#99f6e4;
--line:#115e59;
--primary:#0d9488;
--primary2:#2dd4bf;
--soft:#8b5cf6;
--soft-glow:rgba(139,92,246,0.25);
--danger:#f43f5e;
--shadow:0 10px 30px rgba(7,20,18,0.6)
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text)
}

button,input,select{font:inherit}
button{cursor:pointer}

.app{
width:100%;
max-width:430px;
min-height:100vh;
margin:auto;
overflow:hidden
}

/* HEADER - TRANQUIL TEAL TO PURPLE SILK GRADIENT */
.header{
position:relative;
padding:21px 18px 31px;
color:white;
background:linear-gradient(145deg,#115e59,#0d9488 45%,#8b5cf6);
border-radius:0 0 31px 31px;
overflow:hidden;
border-bottom:2px solid var(--primary2)
}

.header:before{
content:"";
position:absolute;
width:190px;
height:190px;
right:-90px;
top:-105px;
border-radius:50%;
background:rgba(255,255,255,.06)
}

.topbar{
position:relative;
z-index:2;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:9px
}

.brand-icon{
width:41px;
height:41px;
display:grid;
place-items:center;
border-radius:13px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.12);
font-size:20px
}

.brand-name{
font-size:21px;
font-weight:850;
letter-spacing:-.5px
}

.theme{
width:40px;
height:40px;
border:0;
border-radius:13px;
background:rgba(255,255,255,.08);
color:#fff
}

.hero{
position:relative;
z-index:2;
margin-top:25px
}

.hero h1{
margin:0;
font-size:30px;
line-height:1.08;
letter-spacing:-.8px
}

.hero p{
margin:8px 0 0;
font-size:13px;
color:rgba(255,255,255,.7)
}

/* CONTENT */
.content{padding:18px}

.card{
padding:17px;
margin-bottom:14px;
background:var(--card);
border:1px solid var(--line);
border-radius:21px;
box-shadow:var(--shadow)
}

.title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px
}

.title h2{
margin:0;
font-size:15px
}

/* PACER CANVAS DESIGN WORKSPACE */
.pacer-container {
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:30px 0;
min-height:240px
}

.breathing-orb {
width:120px;
height:120px;
border-radius:50%;
background:radial-gradient(circle, var(--primary2), var(--primary));
box-shadow:0 0 40px var(--soft-glow);
display:grid;
place-items:center;
transition:transform 4s cubic-bezier(0.4, 0, 0.2, 1);
will-change:transform
}

/* Dynamic pacing layout modifier transformations */
.breathing-orb.expand {
transform:scale(1.75);
background:radial-gradient(circle, #a78bfa, var(--soft))
}

.breathing-orb.contract {
transform:scale(1.0)
}

.pacer-instruction {
font-size:22px;
font-weight:900;
margin-top:24px;
color:var(--text);
letter-spacing:-0.5px;
text-align:center;
min-height:30px
}

/* ACTION CONTROLLER FIELD KEYS */
.btn-action-trigger {
width:100%;
padding:14px;
border:0;
border-radius:14px;
background:var(--soft);
color:white;
font-weight:850;
font-size:15px;
transition:opacity 0.2s
}
.btn-action-trigger.active-state {
background:var(--line);
color:var(--muted)
}
.btn-action-trigger:active { opacity:0.9 }

/* LOG REPORT STATS GRID */
.metrics-row {
display:flex;
justify-content:space-between;
align-items:center;
padding:6px 0;
font-size:13px
}

.metric-lbl { font-weight:700; color:var(--muted); }
.metric-val { font-family:"Courier New",Courier,monospace; font-weight:900; color:var(--primary2); }

/* CRISP SILK CERAMIC LIGHT OVERRIDE SKIN */
body.light-theme {
--bg:#f0fdfa;
--card:#ffffff;
--text:#115e59;
--muted:#0d9488;
--line:#ccfbf1;
--soft:#8b5cf6;
--soft-glow:rgba(139,92,246,0.1);
--shadow:0 10px 30px rgba(13,148,136,0.05)
}
</style>
</head>

<body>

<div class="app">

<header class="header">
<div class="topbar">
<div class="brand">
<div class="brand-icon">🧘‍♂️</div>
<div class="brand-name">BreathePocket</div>
</div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">☀️</button>
</div>

<div class="hero">
<h1>Zen Breathing.<br>Calm Mind Sync.</h1>
<p>Regulate nervous pathways with an interactive, responsive bio-rhythm guide template.</p>
</div>
</header>

<main class="content">

<!-- INTERACTIVE PACER CIRCLE SCREEN -->
<section class="card">
<div class="pacer-container">
<div id="orbNode" class="breathing-orb"></div>
<div id="instructionNode" class="pacer-instruction">Ready to Start</div>
</div>
</section>

<!-- LAUNCH CONTROLLER TRIGGER REGION -->
<section class="card">
<button id="pacerTriggerBtn" class="btn-action-trigger" onclick="toggleBreathingSessionState()">Begin Zen Session</button>
</section>

<!-- REPORT SESSION METRICS STATS CARD -->
<section class="card">
<div class="title">
<h2>📊 Session Summary Metrics</h2>
</div>
<div class="metrics-row">
<span class="metric-lbl">Total Completed Cycles</span>
<span id="lblCyclesCounter" class="metric-val">0 Cycles</span>
</div>
</section>

</main>

</div>

<script>
let executionTimelineId = null;
let currentCyclesCompletedCount = parseInt(localStorage.getItem("breathe_pocket_cycles")) || 0;
let isSessionRunningState = false;

function toggleTheme() {
    document.body.classList.toggle("light-theme");
    const btn = document.getElementById("themeBtn");
    btn.innerText = document.body.classList.contains("light-theme") ? "🌙" : "☀️";
}

function updateCyclesCounterText() {
    document.getElementById("lblCyclesCounter").innerText = `${currentCyclesCompletedCount} Cycles`;
}

function toggleBreathingSessionState() {
    const btn = document.getElementById("pacerTriggerBtn");
    const orb = document.getElementById("orbNode");
    const label = document.getElementById("instructionNode");

    if (isSessionRunningState) {
        // Halt sequence tracking state cleanly
        clearTimeout(executionTimelineId);
        isSessionRunningState = false;
        btn.innerText = "Begin Zen Session";
        btn.className = "btn-action-trigger";
        orb.className = "breathing-orb contract";
        label.innerText = "Session Paused";
    } else {
        isSessionRunningState = true;
        btn.innerText = "Halt Zen Pacer";
        btn.className = "btn-action-trigger active-state";
        executePacerStepLoop();
    }
}

function executePacerStepLoop() {
    if (!isSessionRunningState) return;

    const orb = document.getElementById("orbNode");
    const label = document.getElementById("instructionNode");

    // PHASE 1: BREATHE IN (4 Seconds duration curve expansion)
    label.innerText = "🌬️ Breathe In...";
    orb.style.transitionDuration = "4s";
    orb.className = "breathing-orb expand";
    triggerZenSineTone(330, 0.4); // Mild base entry tone signal

    executionTimelineId = setTimeout(() => {
        if (!isSessionRunningState) return;

        // PHASE 2: HOLD REST BREATH (4 Seconds duration stability)
        label.innerText = "🛑 Hold Breath...";
        
        executionTimelineId = setTimeout(() => {
            if (!isSessionRunningState) return;

            // PHASE 3: BREATHE OUT (4 Seconds duration curve contraction)
            label.innerText = "💨 Breathe Out...";
            orb.style.transitionDuration = "4s";
            orb.className = "breathing-orb contract";
            triggerZenSineTone(261, 0.4); // Deeper release grounding chime

            executionTimelineId = setTimeout(() => {
                if (!isSessionRunningState) return;

                // Loop milestone processing increment updates
                currentCyclesCompletedCount++;
                localStorage.setItem("breathe_pocket_cycles", currentCyclesCompletedCount);
                updateCyclesCounterText();

                // Recursively fire subsequent loop structures indefinitely until halted
                executePacerStepLoop();
            }, 4000);
        }, 4000);
    }, 4000);
}

function triggerZenSineTone(frequencyHzValue, durationSeconds) {
    if (window.AudioContext || window.webkitAudioContext) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = "sine";
            osc.frequency.setValueAtTime(frequencyHzValue, ctx.currentTime);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + durationSeconds);
            osc.start();
            osc.stop(ctx.currentTime + durationSeconds);
        } catch (e) {}
    }
}

// Ensure interface displays structural counts cleanly upon boot execution setup
updateCyclesCounterText();
</script>

</body>
</html>
