<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BillSplit</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f8f6;
    color: #26332c;
}

.app {
    max-width: 420px;
    min-height: 100vh;
    margin: auto;
    padding-bottom: 50px;
}

/* HEADER */

.header {
    padding: 28px 20px 32px;
    color: white;
    background: linear-gradient(135deg, #059669, #10b981);
    border-radius: 0 0 32px 32px;
}

.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.badge {
    padding: 8px 11px;
    border-radius: 20px;
    background: rgba(255,255,255,.18);
    font-size: 10px;
}

.header h1 {
    margin: 28px 0 5px;
    font-size: 30px;
}

.header p {
    margin: 0;
    opacity: .85;
}

/* CONTENT */

.content {
    padding: 20px;
}

/* CARD */

.card {
    background: white;
    padding: 19px;
    border-radius: 21px;
    margin-bottom: 14px;
    box-shadow: 0 5px 18px rgba(30,70,50,.06);
}

.card-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 13px;
}

/* INPUT */

.input-wrap {
    position: relative;
}

.currency {
    position: absolute;
    left: 14px;
    top: 14px;
    color: #8a978f;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 14px;
    border: 1px solid #dce6e0;
    border-radius: 13px;
    outline: none;
    background: white;
    font-family: inherit;
}

.currency + input {
    padding-left: 32px;
}

/* PEOPLE */

.people-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.counter {
    display: flex;
    align-items: center;
    gap: 12px;
}

.counter button {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 12px;
    background: #e8f7f1;
    color: #059669;
    font-size: 20px;
    cursor: pointer;
}

.people-number {
    min-width: 35px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

/* TIP */

.tip-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

.tip {
    padding: 11px 5px;
    border: 0;
    border-radius: 11px;
    background: #f1f5f3;
    color: #66736c;
    cursor: pointer;
}

.tip.active {
    background: #059669;
    color: white;
}

/* RESULTS */

.result {
    color: white;
    background: linear-gradient(135deg, #047857, #10b981);
    padding: 22px;
    border-radius: 23px;
    margin-bottom: 14px;
}

.result-label {
    opacity: .8;
    font-size: 11px;
}

.total {
    font-size: 40px;
    font-weight: 800;
    margin: 5px 0 18px;
}

.per-person {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 15px;
    border-top: 1px solid rgba(255,255,255,.2);
}

.per-person strong {
    font-size: 23px;
}

/* SUMMARY */

.summary-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #edf1ee;
    font-size: 13px;
}

.summary-row:last-child {
    border-bottom: 0;
}

.summary-row span:last-child {
    font-weight: bold;
}

/* RESET */

.reset {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 14px;
    background: #fff0f0;
    color: #c85b5b;
    cursor: pointer;
}

/* SAVE */

.save {
    width: 100%;
    margin-top: 10px;
    padding: 14px;
    border: 0;
    border-radius: 14px;
    background: #e8f7f1;
    color: #047857;
    font-weight: bold;
    cursor: pointer;
}

/* SPLIT PEOPLE */

.person-list {
    margin-top: 12px;
}

.person {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid #edf1ee;
}

.person:last-child {
    border-bottom: 0;
}

.person-left {
    display: flex;
    align-items: center;
    gap: 9px;
}

.avatar {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: #e8f7f1;
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="top">

            <div class="logo">
                🧾 BillSplit
            </div>

            <div class="badge">
                Easy split
            </div>

        </div>

        <h1>
            Split the bill.
        </h1>

        <p>
            No awkward math with friends.
        </p>

    </header>


    <main class="content">

        <!-- BILL -->

        <section class="card">

            <div class="card-title">
                💰 Bill amount
            </div>

            <div class="input-wrap">

                <span class="currency">
                    ৳
                </span>

                <input
                    id="bill"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="0.00"
                    oninput="calculate()"
                >

            </div>

        </section>


        <!-- PEOPLE -->

        <section class="card">

            <div class="people-row">

                <div class="card-title" style="margin:0">
                    👥 People
                </div>

                <div class="counter">

                    <button
                        onclick="changePeople(-1)"
                    >
                        −
                    </button>

                    <div
                        class="people-number"
                        id="people"
                    >
                        2
                    </div>

                    <button
                        onclick="changePeople(1)"
                    >
                        +
                    </button>

                </div>

            </div>

        </section>


        <!-- TAX -->

        <section class="card">

            <div class="card-title">
                🧮 Tax
            </div>

            <div class="input-wrap">

                <input
                    id="tax"
                    type="number"
                    min="0"
                    value="0"
                    step="0.1"
                    oninput="calculate()"
                    placeholder="Tax %"
                >

            </div>

        </section>


        <!-- TIP -->

        <section class="card">

            <div class="card-title">
                ❤️ Tip
            </div>

            <div class="tip-buttons">

                <button
                    class="tip"
                    onclick="setTip(0,this)"
                >
                    0%
                </button>

                <button
                    class="tip"
                    onclick="setTip(5,this)"
                >
                    5%
                </button>

                <button
                    class="tip active"
                    onclick="setTip(10,this)"
                >
                    10%
                </button>

                <button
                    class="tip"
                    onclick="setTip(15,this)"
                >
                    15%
                </button>

            </div>

            <input
                id="customTip"
                type="number"
                min="0"
                value="10"
                step="0.1"
                style="margin-top:10px"
                oninput="customTip()"
                placeholder="Custom tip %"
            >

        </section>


        <!-- RESULT -->

        <section class="result">

            <div class="result-label">
                TOTAL BILL
            </div>

            <div
                class="total"
                id="total"
            >
                ৳0.00
            </div>

            <div class="per-person">

                <div>

                    <div class="result-label">
                        EACH PERSON
                    </div>

                    <strong id="each">
                        ৳0.00
                    </strong>

                </div>

                <div style="font-size:35px">
                    👥
                </div>

            </div>

        </section>


        <!-- SUMMARY -->

        <section class="card">

            <div class="card-title">
                📊 Breakdown
            </div>

            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <span id="subtotal">
                    ৳0.00
                </span>

            </div>

            <div class="summary-row">

                <span>
                    Tax
                </span>

                <span id="taxAmount">
                    ৳0.00
                </span>

            </div>

            <div class="summary-row">

                <span>
                    Tip
                </span>

                <span id="tipAmount">
                    ৳0.00
                </span>

            </div>

            <div class="summary-row">

                <span>
                    People
                </span>

                <span id="peopleSummary">
                    2
                </span>

            </div>

        </section>


        <!-- PEOPLE SPLIT -->

        <section class="card">

            <div class="card-title">
                👥 Individual share
            </div>

            <div
                class="person-list"
                id="personList"
            ></div>

        </section>


        <button
            class="save"
            onclick="saveCalculation()"
        >
            💾 Save Calculation
        </button>

        <button
            class="reset"
            onclick="resetApp()"
        >
            ↻ Reset
        </button>

    </main>

</div>


<script>

let people =
    2;

let tipPercent =
    10;


/* MONEY */

function money(value) {

    return "৳" +
        Number(value)
            .toLocaleString(
                "en-BD",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );

}


/* PEOPLE */

function changePeople(change) {

    people += change;

    if (people < 1) {
        people = 1;
    }

    if (people > 50) {
        people = 50;
    }

    document.getElementById("people")
        .innerText =
        people;

    document.getElementById("peopleSummary")
        .innerText =
        people;

    calculate();

}


/* TIP */

function setTip(value, button) {

    tipPercent =
        value;

    document.getElementById("customTip")
        .value =
        value;


    document
        .querySelectorAll(".tip")
        .forEach(
            b =>
                b.classList.remove("active")
        );

    button.classList.add("active");

    calculate();

}


/* CUSTOM TIP */

function customTip() {

    tipPercent =
        Number(
            document.getElementById(
                "customTip"
            ).value
        ) || 0;


    document
        .querySelectorAll(".tip")
        .forEach(
            b =>
                b.classList.remove("active")
        );

    calculate();

}


/* CALCULATE */

function calculate() {

    const bill =
        Number(
            document.getElementById(
                "bill"
            ).value
        ) || 0;


    const taxPercent =
        Number(
            document.getElementById(
                "tax"
            ).value
        ) || 0;


    const tax =
        bill *
        taxPercent /
        100;


    const tip =
        bill *
        tipPercent /
        100;


    const total =
        bill +
        tax +
        tip;


    const each =
        total /
        people;


    document.getElementById("subtotal")
        .innerText =
        money(bill);


    document.getElementById("taxAmount")
        .innerText =
        money(tax);


    document.getElementById("tipAmount")
        .innerText =
        money(tip);


    document.getElementById("total")
        .innerText =
        money(total);


    document.getElementById("each")
        .innerText =
        money(each);


    renderPeople(each);

}


/* PEOPLE LIST */

function renderPeople(each) {

    const container =
        document.getElementById(
            "personList"
        );


    let html = "";


    for (
        let i = 1;
        i <= people;
        i++
    ) {

        html += `

            <div class="person">

                <div class="person-left">

                    <div class="avatar">
                        ${getEmoji(i)}
                    </div>

                    <span>
                        Person ${i}
                    </span>

                </div>

                <strong>
                    ${money(each)}
                </strong>

            </div>

        `;

    }


    container.innerHTML =
        html;

}


/* AVATARS */

function getEmoji(index) {

    const emojis = [
        "😀",
        "😎",
        "🤓",
        "🥳",
        "😊",
        "😄",
        "🙂",
        "🤩"
    ];

    return emojis[
        (index - 1) %
        emojis.length
    ];

}


/* SAVE */

function saveCalculation() {

    const bill =
        Number(
            document.getElementById("bill")
                .value
        ) || 0;


    if (bill <= 0) {

        alert(
            "Enter a bill amount first."
        );

        return;

    }


    const calculation = {

        bill: bill,

        tax:
            Number(
                document.getElementById("tax")
                    .value
            ) || 0,

        tip:
            tipPercent,

        people:
            people,

        date:
            new Date()
                .toLocaleString()

    };


    localStorage.setItem(
        "billSplitLast",
        JSON.stringify(
            calculation
        )
    );


    alert(
        "Calculation saved!"
    );

}


/* RESET */

function resetApp() {

    document.getElementById("bill")
        .value =
        "";

    document.getElementById("tax")
        .value =
        "0";

    document.getElementById("customTip")
        .value =
        "10";


    people =
        2;

    tipPercent =
        10;


    document.getElementById("people")
        .innerText =
        "2";


    document.getElementById("peopleSummary")
        .innerText =
        "2";


    document
        .querySelectorAll(".tip")
        .forEach(
            b =>
                b.classList.remove("active")
        );


    document
        .querySelectorAll(".tip")[2]
        .classList.add("active");


    calculate();

}


/* START */

calculate();

</script>

</body>
</html>
