<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>SecretNote Vault</title>

<style>
/* UNIFORM MIDNIGHT OCEAN STYLE */
:root{
--bg:#0f172a;
--card:#1e293b;
--text:#f8fafc;
--muted:#94a3b8;
--line:#334155;
--primary:#2563eb;
--primary2:#3b82f6;
--soft:#1e3a8a;
--green:#10b981;
--green-soft:#064e3b;
--danger:#ef4444;
--shadow:0 10px 30px rgba(15,23,42,.4)
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text)
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{
width:100%;
max-width:430px;
min-height:100vh;
margin:auto;
overflow:hidden
}

/* HEADER */
.header{
position:relative;
padding:21px 18px 31px;
color:white;
background:linear-gradient(145deg,#1e3a8a,#2563eb 55%,#0d9488);
border-radius:0 0 31px 31px;
overflow:hidden
}

.header:before{
content:"";
position:absolute;
width:190px;
height:190px;
right:-90px;
top:-105px;
border-radius:50%;
background:rgba(255,255,255,.08)
}

.topbar{
position:relative;
z-index:2;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:9px
}

.brand-icon{
width:41px;
height:41px;
display:grid;
place-items:center;
border-radius:13px;
background:rgba(255,255,255,.15);
font-size:22px
}

.brand-name{
font-size:21px;
font-weight:850;
letter-spacing:-.5px
}

.theme{
width:40px;
height:40px;
border:0;
border-radius:13px;
background:rgba(255,255,255,.15);
color:#fff
}

.hero{
position:relative;
z-index:2;
margin-top:25px
}

.hero h1{
margin:0;
font-size:30px;
line-height:1.08;
letter-spacing:-.8px
}

.hero p{
margin:8px 0 0;
font-size:13px;
color:rgba(255,255,255,.8)
}

/* CONTENT */
.content{padding:18px}

.card{
padding:17px;
margin-bottom:14px;
background:var(--card);
border:1px solid var(--line);
border-radius:21px;
box-shadow:var(--shadow)
}

.title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px
}

.title h2{
margin:0;
font-size:15px
}

.title span{
font-size:10px;
color:var(--muted)
}

/* NOTE CHIPS STREAM FEED */
.note-item {
padding:14px 0;
border-bottom:1px solid var(--line);
display:flex;
flex-direction:column;
gap:6px
}
.note-item:last-child{border-bottom:0}

.note-head {
display:flex;
justify-content:space-between;
align-items:center
}

.note-title {
font-size:14px;
font-weight:750;
color:var(--text)
}

.note-body {
font-size:12px;
color:var(--muted);
line-height:1.5;
word-break:break-word;
transition: filter 0.2s
}

/* Blur effect text mask class pattern */
.note-body.masked {
filter: blur(5px);
user-select: none
}

.note-footer {
display:flex;
justify-content:space-between;
align-items:center;
margin-top:4px
}

.note-date {
font-size:9px;
color:var(--muted)
}

.note-actions {
display:flex;
gap:12px
}

.action-text-btn {
background:transparent;
border:0;
font-size:11px;
font-weight:700;
padding:2px 0;
color:var(--primary2)
}
.action-text-btn.danger-text {
color:var(--danger)
}

/* FLOATING INJECTION TRIGGER BUTTON */
.fab{
position:fixed;
right:max(22px,calc((100vw - 430px)/2 + 22px));
bottom:23px;
width:59px;
height:59px;
border:0;
border-radius:20px;
background:var(--primary);
color:white;
font-size:28px;
box-shadow:0 12px 28px rgba(37,99,235,.28);
z-index:10;
display:flex;
align-items:center;
justify-content:center
}

/* EXPANSION PANEL DRAWER */
.overlay{
position:fixed;
inset:0;
z-index:20;
display:none;
align-items:flex-end;
justify-content:center;
background:rgba(0,0,0,.6)
}
.overlay.show{display:flex}

.modal{
width:min(430px,100%);
max-height:92vh;
overflow:auto;
padding:23px 18px 30px;
background:var(--card);
border-radius:28px 28px 0 0;
border-top:1px solid var(--line)
}

.modal-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:17px
}

.modal-head h2{
margin:0;
font-size:19px
}

.close{
width:35px;
height:35px;
border:0;
border-radius:10px;
background:var(--bg);
color:var(--text)
}

.field{margin-bottom:12px}

.field label{
display:block;
margin-bottom:6px;
font-size:11px;
font-weight:750;
color:var(--muted)
}

.field input,
.field textarea{
width:100%;
padding:13px;
border:1px solid var(--line);
border-radius:12px;
outline:none;
background:var(--bg);
color:var(--text)
}

.field textarea {
height:110px;
resize:none
}

.save{
width:100%;
padding:14px;
border:0;
border-radius:13px;
background:var(--primary);
color:white;
font-weight:800
}

.empty-state {
text-align:center;
padding:35px 15px;
color:var(--muted)
}
.empty-icon { font-size:40px; margin-bottom:6px; }

/* LIGHT THEME OVERRIDE */
body.light-theme {
--bg:#f1f5f9;
--card:#ffffff;
--text:#0f172a;
--muted:#64748b;
--line:#cbd5e1;
--soft:#dbeafe;
--shadow:0 10px 30px rgba(51,65,85,0.06)
}
</style>
</head>

<body>

<div class="app">

<header class="header">
<div class="topbar">
<div class="brand">
<div class="brand-icon">🕵️‍♂️</div>
<div class="brand-name">SecretNote</div>
</div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">☀️</button>
</div>

<div class="hero">
<h1>Private Journal.<br>Screen Safe.</h1>
<p>Log encrypted data points, password keys, or journals with blur privacy shields.</p>
</div>
</header>

<main class="content">

<!-- VAULT LOG FEED STACK -->
<section class="card">
<div class="title">
<h2>🔐 Encrypted Memo Stack</h2>
<span id="noteCountSpan">0 saved</span>
</div>

<div id="notesVaultContainer">
<!-- Injected dynamically by Javascript -->
</div>
</section>

</main>

<!-- FLOATING TRIGGER ACTUATOR BANNER KEY -->
<button class="fab" onclick="openModal()">+</button>

<!-- ENTRY GENERATION POPUP DRAWER SHEET -->
<div class="overlay" id="overlay">
<div class="modal">
<div class="modal-head">
<h2>Lock Memo Into Vault</h2>
<button class="close" onclick="closeModal()">✕</button>
</div>

<div class="field">
<label>MEMO TOPIC HEADER</label>
<input type="text" id="noteTitle" placeholder="e.g., WiFi Router Security Pass">
</div>

<div class="field">
<label>SECRET NOTE CONTENT BODY</label>
<textarea id="noteContent" placeholder="Type confidential data records here..."></textarea>
</div>

<button class="save" onclick="commitSecretNote()">Commit Secure Note</button>
</div>
</div>

</div>

<script>
// Load initialization items array sequence map straight from sandbox variables lists local storage
let itemsVault = JSON.parse(localStorage.getItem("secret_pocket_notes")) || [
    { id: 1, title: "Server Root Credentials", text: "User: admin_root | Pass: k8s#M9!zPx2", date: "2026-08-24 09:12", masked: true },
    { id: 2, title: "Private Locker Combination", text: "Left 24, Right 12, Left 06", date: "2026-08-26 15:40", masked: true }
];

function toggleTheme() {
    document.body.classList.toggle("light-theme");
    const btn = document.getElementById("themeBtn");
    btn.innerText = document.body.classList.contains("light-theme") ? "🌙" : "☀️";
}

function openModal() { document.getElementById("overlay").classList.add("show"); }
function closeModal() { document.getElementById("overlay").classList.remove("show"); }

function commitSecretNote() {
    const title = document.getElementById("noteTitle").value.trim();
    const text = document.getElementById("noteContent").value.trim();

    if (!title || !text) return alert("Please fill out both data fields fully.");

    const d = new Date();
    const formattedDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

    itemsVault.push({ id: Date.now(), title, text, date: formattedDate, masked: true });
    saveAndRender();
    closeModal();

    // Reset default text properties inputs
    document.getElementById("noteTitle").value = "";
    document.getElementById("noteContent").value = "";
}

function toggleMaskVisibility(id) {
    const memo = itemsVault.find(n => n.id === id);
    if (memo) {
        memo.masked = !memo.masked;
        render(); // Local instant redraw loop call to apply style changes fast
    }
}

function deleteSecretNote(id) {
    if (confirm("Permanently wipe this record from device storage memory?")) {
        itemsVault = itemsVault.filter(n => n.id !== id);
        saveAndRender();
    }
}

function saveAndRender() {
    localStorage.setItem("secret_pocket_notes", JSON.stringify(itemsVault));
    render();
}

function render() {
    const container = document.getElementById("notesVaultContainer");
    document.getElementById("noteCountSpan").innerText = itemsVault.length + " saved";

    if (itemsVault.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">🛡️</div>
                <h3>Vault Is Clear</h3>
                <p>Tap the bottom drawer trigger key to append your first encrypted node block.</p>
            </div>`;
        return;
    }

    container.innerHTML = itemsVault.map(n => `
        <div class="note-item">
            <div class="note-head">
                <div class="note-title">${n.title}</div>
            </div>
            <div id="body-${n.id}" class="note-body ${n.masked ? 'masked' : ''}">${n.text}</div>
            <div class="note-footer">
                <div class="note-date">${n.date}</div>
                <div class="note-actions">
                    <button class="action-text-btn" onclick="toggleMaskVisibility(${n.id})">
                        ${n.masked ? 'Reveal' : 'Hide'}
                    </button>
                    <button class="action-text-btn danger-text" onclick="deleteSecretNote(${n.id})">Wipe</button>
                </div>
            </div>
        </div>
    `).join("");
}

// Fire application view render loop initial parsing processing layout setup
render();
</script>

</body>
</html>
