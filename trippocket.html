<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0891b2">
<title>TripPocket — Offline Trip Planner</title>

<style>
:root{
  --bg:#f4f8fa;
  --card:#fff;
  --text:#132027;
  --muted:#71808a;
  --line:#e0e8eb;
  --primary:#0891b2;
  --primary-dark:#0e7490;
  --soft:#e6f8fc;
  --danger:#dc2626;
  --green:#16a34a;
  --shadow:0 14px 38px rgba(10,55,70,.08);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

.app{
  width:100%;
  max-width:650px;
  min-height:100vh;
  margin:auto;
  background:var(--bg);
}

/* HEADER */

.header{
  position:relative;
  overflow:hidden;
  padding:18px 18px 29px;
  color:#fff;
  border-radius:0 0 31px 31px;
  background:linear-gradient(145deg,#164e63,#0891b2 58%,#06b6d4);
}

.header:before,
.header:after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.09);
}

.header:before{
  width:320px;
  height:320px;
  right:-180px;
  top:-230px;
}

.header:after{
  width:210px;
  height:210px;
  left:-130px;
  bottom:-160px;
}

.topbar{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:rgba(255,255,255,.15);
  font-size:21px;
}

.brand b{
  display:block;
  font-size:18px;
}

.brand span{
  display:block;
  margin-top:2px;
  color:#cffafe;
  font-size:7px;
  letter-spacing:.4px;
}

.theme{
  width:40px;
  height:40px;
  border:0;
  border-radius:13px;
  color:#fff;
  background:rgba(255,255,255,.15);
}

.hero{
  position:relative;
  z-index:2;
  margin-top:21px;
}

.hero-label{
  color:#cffafe;
  font-size:8px;
  font-weight:800;
}

.title{
  margin-top:4px;
  font-size:30px;
  line-height:1;
  font-weight:900;
  letter-spacing:-1px;
}

.hero p{
  margin:7px 0 0;
  color:#cffafe;
  font-size:8px;
}

/* CONTENT */

.content{
  padding:15px;
}

.card{
  margin-bottom:13px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--card);
  box-shadow:var(--shadow);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.stat{
  padding:11px 4px;
  border-radius:14px;
  text-align:center;
  background:var(--bg);
}

.stat .ico{
  font-size:16px;
}

.stat b{
  display:block;
  margin-top:3px;
  font-size:13px;
}

.stat span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:6.5px;
}

.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:11px;
}

.head h2{
  margin:0;
  font-size:14px;
}

.head span{
  color:var(--muted);
  font-size:8px;
}

.search{
  position:relative;
}

.search input{
  width:100%;
  height:42px;
  padding:0 38px;
  border:1px solid var(--line);
  border-radius:11px;
  outline:none;
  background:var(--bg);
  color:var(--text);
  font-size:9px;
}

.search-icon{
  position:absolute;
  left:13px;
  top:12px;
}

.clear{
  position:absolute;
  right:4px;
  top:4px;
  width:32px;
  height:32px;
  border:0;
  background:transparent;
  color:var(--muted);
}

.filters{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:9px 0 2px;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:0 0 auto;
  padding:7px 11px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--card);
  color:var(--muted);
  font-size:7px;
  font-weight:800;
}

.filter.active{
  border-color:var(--primary);
  background:var(--primary);
  color:#fff;
}

.primary{
  width:100%;
  height:40px;
  margin-top:9px;
  border:0;
  border-radius:10px;
  background:var(--primary);
  color:#fff;
  font-size:8px;
  font-weight:900;
}

.primary:hover{
  background:var(--primary-dark);
}

/* TRIP LIST */

.trip-list{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.trip{
  position:relative;
  overflow:hidden;
  padding:15px;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--card);
}

.trip-cover{
  position:relative;
  height:105px;
  margin:-15px -15px 13px;
  display:flex;
  align-items:flex-end;
  padding:12px;
  color:#fff;
  background:linear-gradient(135deg,#155e75,#06b6d4);
}

.trip-cover:after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  right:-55px;
  top:-75px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
}

.trip-emoji{
  position:relative;
  z-index:2;
  font-size:30px;
}

.trip-fav{
  position:absolute;
  z-index:3;
  right:10px;
  top:10px;
  width:31px;
  height:31px;
  border:0;
  border-radius:9px;
  background:rgba(0,0,0,.2);
  color:#fff;
}

.trip-fav.active{
  color:#fde047;
}

.trip-name{
  font-size:14px;
  font-weight:900;
}

.trip-destination{
  margin-top:4px;
  color:var(--muted);
  font-size:8px;
}

.trip-meta{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:10px;
}

.tag{
  padding:5px 7px;
  border-radius:7px;
  background:var(--bg);
  color:var(--muted);
  font-size:6px;
  font-weight:800;
}

.status{
  color:#fff;
}

.status-planned{
  background:#2563eb;
}

.status-progress{
  background:#0891b2;
}

.status-completed{
  background:#16a34a;
}

.status-cancelled{
  background:#dc2626;
}

.trip-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.trip-budget{
  font-size:8px;
  font-weight:800;
}

.trip-actions{
  display:flex;
  gap:5px;
}

.small{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:var(--bg);
  color:var(--muted);
}

.small:hover{
  color:var(--primary);
  background:var(--soft);
}

.empty{
  padding:32px 10px;
  text-align:center;
}

.empty .emoji{
  font-size:42px;
}

.empty b{
  display:block;
  margin-top:7px;
  font-size:10px;
}

.empty p{
  max-width:290px;
  margin:5px auto;
  color:var(--muted);
  font-size:8px;
  line-height:1.5;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:15px;
  background:rgba(7,30,38,.62);
  backdrop-filter:blur(5px);
}

.modal.show{
  display:flex;
}

.box{
  width:100%;
  max-width:590px;
  max-height:93vh;
  overflow:auto;
  padding:18px;
  border-radius:24px;
  background:var(--card);
  box-shadow:0 25px 80px rgba(0,0,0,.25);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-head h3{
  margin:0;
  font-size:15px;
}

.close{
  width:32px;
  height:32px;
  border:0;
  border-radius:9px;
  background:var(--bg);
  color:var(--muted);
}

.field{
  margin-bottom:11px;
}

.field label{
  display:block;
  margin-bottom:5px;
  font-size:8px;
  font-weight:900;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:10px;
  border:1px solid var(--line);
  border-radius:10px;
  outline:none;
  background:var(--bg);
  color:var(--text);
  font-size:9px;
}

.field input,
.field select{
  height:40px;
}

.field textarea{
  min-height:65px;
  resize:vertical;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.modal-actions{
  display:flex;
  gap:7px;
  margin-top:15px;
}

.modal-actions button{
  flex:1;
  height:40px;
  border:0;
  border-radius:10px;
  font-size:9px;
  font-weight:900;
}

.cancel{
  background:var(--bg);
  color:var(--text);
}

.save{
  background:var(--primary);
  color:#fff;
}

/* DETAILS */

.detail-cover{
  position:relative;
  height:135px;
  display:flex;
  align-items:flex-end;
  padding:15px;
  overflow:hidden;
  border-radius:17px;
  color:#fff;
  background:linear-gradient(135deg,#164e63,#06b6d4);
}

.detail-cover:after{
  content:"";
  position:absolute;
  width:210px;
  height:210px;
  right:-80px;
  top:-100px;
  border-radius:50%;
  background:rgba(255,255,255,.11);
}

.detail-cover .emoji{
  position:relative;
  z-index:2;
  font-size:42px;
}

.detail-title{
  position:relative;
  z-index:2;
  margin-left:11px;
}

.detail-title b{
  display:block;
  font-size:18px;
}

.detail-title span{
  display:block;
  margin-top:4px;
  color:#cffafe;
  font-size:8px;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:13px;
}

.detail-item{
  padding:10px;
  border-radius:11px;
  background:var(--bg);
}

.detail-item span{
  display:block;
  color:var(--muted);
  font-size:6px;
}

.detail-item b{
  display:block;
  margin-top:4px;
  font-size:8px;
}

.detail-section{
  margin-top:13px;
}

.detail-section h4{
  margin:0 0 7px;
  font-size:9px;
}

.detail-note{
  padding:11px;
  border-radius:11px;
  background:var(--bg);
  font-size:8px;
  line-height:1.5;
}

/* ITINERARY */

.day{
  margin-top:7px;
  padding:9px;
  border-radius:10px;
  background:var(--bg);
}

.day strong{
  font-size:8px;
}

.day p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:7px;
  line-height:1.4;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  z-index:100;
  max-width:calc(100% - 30px);
  padding:11px 15px;
  border-radius:11px;
  background:#102027;
  color:#fff;
  font-size:9px;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,20px);
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* DARK */

body.dark{
  --bg:#0d1518;
  --card:#172126;
  --text:#f4fafb;
  --muted:#9cabb0;
  --line:#29383d;
  --soft:#102d35;
  --shadow:0 15px 40px rgba(0,0,0,.34);
}

@media(min-width:700px){

  body{
    padding:20px 0;
  }

  .app{
    min-height:calc(100vh - 40px);
    overflow:hidden;
    border-radius:30px;
    box-shadow:0 20px 60px rgba(10,50,60,.14);
  }

  .modal{
    align-items:center;
  }
}

@media(max-width:400px){

  .two{
    grid-template-columns:1fr;
    gap:0;
  }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="topbar">

    <div class="brand">

      <div class="logo">🧳</div>

      <div>
        <b>TripPocket</b>
        <span>YOUR OFFLINE TRAVEL PLANNER</span>
      </div>

    </div>

    <button
      class="theme"
      id="themeBtn"
      onclick="toggleTheme()"
    >🌙</button>

  </div>

  <div class="hero">

    <div class="hero-label">
      PLAN • PACK • EXPLORE
    </div>

    <div class="title">
      TripPocket
    </div>

    <p>
      Keep your trips, plans, budgets and itineraries together.
    </p>

  </div>

</header>


<main class="content">

<section class="card">

  <div class="stats">

    <div class="stat">
      <div class="ico">🧳</div>
      <b id="tripCount">0</b>
      <span>Trips</span>
    </div>

    <div class="stat">
      <div class="ico">⭐</div>
      <b id="favoriteCount">0</b>
      <span>Favorites</span>
    </div>

    <div class="stat">
      <div class="ico">💰</div>
      <b id="budgetTotal">$0</b>
      <span>Total Budget</span>
    </div>

  </div>

</section>


<section class="card">

  <div class="head">

    <h2>🗺️ My Trips</h2>

    <span id="resultCount">
      0 trips
    </span>

  </div>


  <div class="search">

    <span class="search-icon">🔍</span>

    <input
      id="search"
      placeholder="Search trips or destinations..."
      oninput="renderTrips()"
    >

    <button
      class="clear"
      onclick="clearSearch()"
    >×</button>

  </div>


  <div
    class="filters"
    id="filters"
  ></div>


  <button
    class="primary"
    onclick="openEditor()"
  >
    + Plan New Trip
  </button>

</section>


<section class="card">

  <div
    class="trip-list"
    id="tripList"
  ></div>

</section>

</main>


<footer style="
padding:5px 15px 25px;
text-align:center;
color:var(--muted);
font-size:7px
">
🔒 TripPocket stores your travel plans locally on this device.
</footer>

</div>


<!-- EDITOR MODAL -->

<div
  class="modal"
  id="editorModal"
>

<div class="box">

  <div class="modal-head">

    <h3 id="editorTitle">
      🧳 Plan New Trip
    </h3>

    <button
      class="close"
      onclick="closeEditor()"
    >×</button>

  </div>


  <div class="field">

    <label>TRIP NAME</label>

    <input
      id="tripName"
      maxlength="100"
      placeholder="e.g. Summer in Japan"
    >

  </div>


  <div class="field">

    <label>DESTINATION</label>

    <input
      id="destination"
      maxlength="120"
      placeholder="e.g. Tokyo, Japan"
    >

  </div>


  <div class="two">

    <div class="field">

      <label>START DATE</label>

      <input
        id="startDate"
        type="date"
      >

    </div>

    <div class="field">

      <label>END DATE</label>

      <input
        id="endDate"
        type="date"
      >

    </div>

  </div>


  <div class="two">

    <div class="field">

      <label>STATUS</label>

      <select id="status">

        <option value="Planned">
          📅 Planned
        </option>

        <option value="In Progress">
          ✈️ In Progress
        </option>

        <option value="Completed">
          ✅ Completed
        </option>

        <option value="Cancelled">
          ❌ Cancelled
        </option>

      </select>

    </div>


    <div class="field">

      <label>BUDGET</label>

      <input
        id="budget"
        type="number"
        min="0"
        step="0.01"
        placeholder="0.00"
      >

    </div>

  </div>


  <div class="field">

    <label>ACCOMMODATION</label>

    <input
      id="hotel"
      maxlength="120"
      placeholder="Hotel, Airbnb or accommodation"
    >

  </div>


  <div class="field">

    <label>TRANSPORT</label>

    <input
      id="transport"
      maxlength="120"
      placeholder="Flight, train, car, bus..."
    >

  </div>


  <div class="field">

    <label>ITINERARY</label>

    <textarea
      id="itinerary"
      maxlength="1500"
      placeholder="Day 1 — Arrival&#10;Day 2 — Explore the city&#10;Day 3 — Museum and shopping"
    ></textarea>

  </div>


  <div class="field">

    <label>PACKING LIST</label>

    <textarea
      id="packing"
      maxlength="1200"
      placeholder="Passport&#10;Charger&#10;Clothes&#10;Toiletries"
    ></textarea>

  </div>


  <div class="field">

    <label>NOTES</label>

    <textarea
      id="notes"
      maxlength="1200"
      placeholder="Reservations, reminders, places to visit..."
    ></textarea>

  </div>


  <div class="modal-actions">

    <button
      class="cancel"
      onclick="closeEditor()"
    >
      Cancel
    </button>

    <button
      class="save"
      onclick="saveTrip()"
    >
      Save Trip
    </button>

  </div>

</div>

</div>


<!-- DETAIL MODAL -->

<div
  class="modal"
  id="detailModal"
>

<div class="box">

  <div class="modal-head">

    <h3>
      🗺️ Trip Details
    </h3>

    <button
      class="close"
      onclick="closeDetail()"
    >×</button>

  </div>

  <div id="detailContent"></div>

  <div class="modal-actions">

    <button
      class="cancel"
      onclick="closeDetail()"
    >
      Close
    </button>

    <button
      class="save"
      id="detailEditBtn"
    >
      ✏️ Edit Trip
    </button>

  </div>

</div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>
"use strict";

const STORAGE_KEY = "tripPocketData";
const THEME_KEY = "tripPocketTheme";

let data =
  JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "null"
  );

if(!data || typeof data !== "object"){
  data = {trips:[]};
}

if(!Array.isArray(data.trips)){
  data.trips = [];
}

let editingId = null;
let activeStatus = "All";
let activeDetailId = null;


/* HELPERS */

function uid(){
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2,8);
}

function save(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function money(value){
  const n = Number(value) || 0;

  return "$" + n.toLocaleString(
    undefined,
    {
      minimumFractionDigits:0,
      maximumFractionDigits:2
    }
  );
}

function formatDate(value){

  if(!value) return "Not set";

  const d =
    new Date(value + "T00:00:00");

  if(Number.isNaN(d.getTime())){
    return value;
  }

  return d.toLocaleDateString(
    undefined,
    {
      year:"numeric",
      month:"short",
      day:"numeric"
    }
  );
}

function dateRange(trip){

  if(!trip.startDate && !trip.endDate){
    return "Dates not set";
  }

  if(
    trip.startDate &&
    trip.endDate
  ){
    return `${formatDate(trip.startDate)} — ${formatDate(trip.endDate)}`;
  }

  return formatDate(
    trip.startDate || trip.endDate
  );
}

function toast(message){

  const t =
    document.getElementById("toast");

  t.textContent = message;

  t.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(
      ()=>t.classList.remove("show"),
      2200
    );
}


/* EDITOR */

function openEditor(trip=null){

  editingId =
    trip?.id || null;

  document.getElementById("editorTitle")
    .textContent =
      trip
        ? "✏️ Edit Trip"
        : "🧳 Plan New Trip";

  document.getElementById("tripName")
    .value =
      trip?.name || "";

  document.getElementById("destination")
    .value =
      trip?.destination || "";

  document.getElementById("startDate")
    .value =
      trip?.startDate || "";

  document.getElementById("endDate")
    .value =
      trip?.endDate || "";

  document.getElementById("status")
    .value =
      trip?.status || "Planned";

  document.getElementById("budget")
    .value =
      trip?.budget ?? "";

  document.getElementById("hotel")
    .value =
      trip?.hotel || "";

  document.getElementById("transport")
    .value =
      trip?.transport || "";

  document.getElementById("itinerary")
    .value =
      trip?.itinerary || "";

  document.getElementById("packing")
    .value =
      trip?.packing || "";

  document.getElementById("notes")
    .value =
      trip?.notes || "";

  document
    .getElementById("editorModal")
    .classList.add("show");
}

function closeEditor(){

  document
    .getElementById("editorModal")
    .classList.remove("show");

  editingId = null;
}


/* SAVE TRIP */

function saveTrip(){

  const name =
    document.getElementById("tripName")
      .value.trim();

  const destination =
    document.getElementById("destination")
      .value.trim();

  const startDate =
    document.getElementById("startDate")
      .value;

  const endDate =
    document.getElementById("endDate")
      .value;

  const status =
    document.getElementById("status")
      .value;

  const budget =
    Number(
      document.getElementById("budget")
        .value
    ) || 0;

  const hotel =
    document.getElementById("hotel")
      .value.trim();

  const transport =
    document.getElementById("transport")
      .value.trim();

  const itinerary =
    document.getElementById("itinerary")
      .value.trim();

  const packing =
    document.getElementById("packing")
      .value.trim();

  const notes =
    document.getElementById("notes")
      .value.trim();


  if(!name){

    toast("Please enter a trip name.");

    return;
  }


  const existing =
    editingId
      ? data.trips.find(
          x=>x.id===editingId
        )
      : null;


  const trip = {

    id:
      editingId || uid(),

    name,

    destination,

    startDate,

    endDate,

    status,

    budget,

    hotel,

    transport,

    itinerary,

    packing,

    notes,

    favorite:
      existing?.favorite || false,

    created:
      existing?.created || Date.now()

  };


  if(editingId){

    const index =
      data.trips.findIndex(
        x=>x.id===editingId
      );

    if(index >= 0){
      data.trips[index] = trip;
    }

    toast("✏️ Trip updated.");

  }else{

    data.trips.unshift(trip);

    toast("🧳 Trip added.");

  }


  save();

  closeEditor();

  render();
}


/* DELETE */

function deleteTrip(id){

  const trip =
    data.trips.find(
      x=>x.id===id
    );

  if(!trip)return;

  if(!confirm(
    `Delete "${trip.name}"?`
  )){
    return;
  }

  data.trips =
    data.trips.filter(
      x=>x.id!==id
    );

  save();

  closeDetail();

  render();

  toast("🗑️ Trip deleted.");
}


/* FAVORITE */

function toggleFavorite(id){

  const trip =
    data.trips.find(
      x=>x.id===id
    );

  if(!trip)return;

  trip.favorite =
    !trip.favorite;

  save();

  renderTrips();

  renderStats();

  toast(
    trip.favorite
      ? "⭐ Trip added to favorites."
      : "☆ Removed from favorites."
  );
}


/* FILTERS */

function getStatuses(){

  return [
    "All",
    "Planned",
    "In Progress",
    "Completed",
    "Cancelled"
  ];
}

function renderFilters(){

  const box =
    document.getElementById("filters");

  box.innerHTML =
    getStatuses()
      .map(status=>`

        <button
          class="
            filter
            ${activeStatus===status
              ?"active":""
            }
          "
          onclick="setStatus(${JSON.stringify(status)})"
        >
          ${esc(status)}
        </button>

      `)
      .join("");
}

function setStatus(status){

  activeStatus = status;

  renderFilters();

  renderTrips();
}


/* STATUS */

function statusClass(status){

  if(status==="In Progress"){
    return "status-progress";
  }

  if(status==="Completed"){
    return "status-completed";
  }

  if(status==="Cancelled"){
    return "status-cancelled";
  }

  return "status-planned";
}


/* RENDER TRIPS */

function renderTrips(){

  const query =
    document.getElementById("search")
      .value
      .trim()
      .toLowerCase();


  let trips =
    data.trips.filter(trip=>{

      const text =
        [
          trip.name,
          trip.destination,
          trip.hotel,
          trip.transport,
          trip.notes,
          trip.itinerary
        ]
        .join(" ")
        .toLowerCase();


      const matchesSearch =
        !query ||
        text.includes(query);


      const matchesStatus =
        activeStatus==="All" ||
        trip.status===activeStatus;


      return (
        matchesSearch &&
        matchesStatus
      );

    });


  trips.sort(
    (a,b)=>
      Number(b.favorite) -
      Number(a.favorite)
  );


  document.getElementById("resultCount")
    .textContent =
      `${trips.length} ${
        trips.length===1
          ?"trip"
          :"trips"
      }`;


  const list =
    document.getElementById("tripList");


  if(!trips.length){

    list.innerHTML = `

      <div class="empty">

        <div class="emoji">
          🧳
        </div>

        <b>
          No trips found
        </b>

        <p>
          Start planning your next adventure
          by creating your first trip.
        </p>

      </div>

    `;

    return;
  }


  list.innerHTML =
    trips.map(trip=>`

      <div class="trip">

        <div class="trip-cover">

          <div class="trip-emoji">
            🧳
          </div>

          <button
            class="
              trip-fav
              ${trip.favorite?"active":""}
            "
            onclick="toggleFavorite('${trip.id}')"
          >
            ${trip.favorite?"★":"☆"}
          </button>

        </div>


        <div class="trip-name">
          ${esc(trip.name)}
        </div>

        <div class="trip-destination">
          📍 ${esc(
            trip.destination ||
            "Destination not set"
          )}
        </div>


        <div class="trip-meta">

          <span class="tag">
            📅 ${esc(
              dateRange(trip)
            )}
          </span>

          <span
            class="
              tag
              status
              ${statusClass(trip.status)}
            "
          >
            ${esc(trip.status)}
          </span>

          ${
            trip.hotel
              ? `
                <span class="tag">
                  🏨 ${esc(trip.hotel)}
                </span>
              `
              : ""
          }

        </div>


        <div class="trip-bottom">

          <div class="trip-budget">
            💰 Budget:
            ${money(trip.budget)}
          </div>


          <div class="trip-actions">

            <button
              class="small"
              title="View"
              onclick="openDetail('${trip.id}')"
            >
              👁️
            </button>

            <button
              class="small"
              title="Edit"
              onclick="openEditor(data.trips.find(x=>x.id==='${trip.id}'))"
            >
              ✏️
            </button>

            <button
              class="small"
              title="Delete"
              onclick="deleteTrip('${trip.id}')"
            >
              🗑️
            </button>

          </div>

        </div>

      </div>

    `)
    .join("");
}


/* DETAILS */

function formatMultiline(text){

  if(!text){
    return `<div style="color:var(--muted)">Nothing added yet.</div>`;
  }

  const lines =
    text
      .split(/\n+/)
      .map(x=>x.trim())
      .filter(Boolean);


  if(!lines.length){
    return `<div style="color:var(--muted)">Nothing added yet.</div>`;
  }


  return lines
    .map((line,i)=>`

      <div class="day">

        <strong>
          ${
            /^day\s*\d+/i.test(line)
              ? esc(line)
              : `• ${esc(line)}`
          }
        </strong>

      </div>

    `)
    .join("");
}


function openDetail(id){

  const trip =
    data.trips.find(
      x=>x.id===id
    );

  if(!trip)return;

  activeDetailId = id;


  document.getElementById("detailContent")
    .innerHTML = `

      <div class="detail-cover">

        <div class="emoji">
          🧳
        </div>

        <div class="detail-title">

          <b>
            ${esc(trip.name)}
          </b>

          <span>
            📍 ${esc(
              trip.destination ||
              "Destination not set"
            )}
          </span>

        </div>

      </div>


      <div class="detail-grid">

        <div class="detail-item">
          <span>Status</span>
          <b>
            ${esc(trip.status)}
          </b>
        </div>

        <div class="detail-item">
          <span>Budget</span>
          <b>
            ${money(trip.budget)}
          </b>
        </div>

        <div class="detail-item">
          <span>Start</span>
          <b>
            ${formatDate(trip.startDate)}
          </b>
        </div>

        <div class="detail-item">
          <span>End</span>
          <b>
            ${formatDate(trip.endDate)}
          </b>
        </div>

        <div class="detail-item">
          <span>Accommodation</span>
          <b>
            ${esc(trip.hotel || "Not set")}
          </b>
        </div>

        <div class="detail-item">
          <span>Transport</span>
          <b>
            ${esc(trip.transport || "Not set")}
          </b>
        </div>

      </div>


      <div class="detail-section">

        <h4>🗺️ Itinerary</h4>

        <div>
          ${formatMultiline(trip.itinerary)}
        </div>

      </div>


      <div class="detail-section">

        <h4>🎒 Packing List</h4>

        <div>
          ${formatMultiline(trip.packing)}
        </div>

      </div>


      ${
        trip.notes
          ? `
            <div class="detail-section">

              <h4>📝 Notes</h4>

              <div class="detail-note">
                ${esc(trip.notes)}
              </div>

            </div>
          `
          : ""
      }

    `;


  document.getElementById("detailEditBtn")
    .onclick = ()=>{

      closeDetail();

      openEditor(trip);

    };


  document
    .getElementById("detailModal")
    .classList.add("show");
}


function closeDetail(){

  document
    .getElementById("detailModal")
    .classList.remove("show");

  activeDetailId = null;
}


/* STATS */

function renderStats(){

  const total =
    data.trips.reduce(
      (sum,trip)=>
        sum +
        (Number(trip.budget)||0),
      0
    );


  document.getElementById("tripCount")
    .textContent =
      data.trips.length;


  document.getElementById("favoriteCount")
    .textContent =
      data.trips.filter(
        x=>x.favorite
      ).length;


  document.getElementById("budgetTotal")
    .textContent =
      money(total);
}


/* SEARCH */

function clearSearch(){

  document.getElementById("search")
    .value="";

  renderTrips();
}


/* THEME */

function toggleTheme(){

  document.body
    .classList
    .toggle("dark");


  const dark =
    document.body.classList
      .contains("dark");


  localStorage.setItem(
    THEME_KEY,
    dark ? "1" : "0"
  );


  document.getElementById("themeBtn")
    .textContent =
      dark ? "☀️" : "🌙";
}


function loadTheme(){

  if(
    localStorage.getItem(THEME_KEY)
    === "1"
  ){

    document.body
      .classList
      .add("dark");

    document.getElementById("themeBtn")
      .textContent="☀️";

  }
}


/* MODAL OUTSIDE CLICK */

document
  .getElementById("editorModal")
  .addEventListener("click",e=>{

    if(e.target.id==="editorModal"){
      closeEditor();
    }

  });


document
  .getElementById("detailModal")
  .addEventListener("click",e=>{

    if(e.target.id==="detailModal"){
      closeDetail();
    }

  });


/* ESC */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Escape"){

      closeEditor();

      closeDetail();

    }

  }
);


/* INITIALIZE */

loadTheme();

renderStats();

renderFilters();

renderTrips();

</script>

</body>
</html>
