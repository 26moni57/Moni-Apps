<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#7c3aed">
<title>ClickSpeed Arcade</title>

<style>
/* BRAND NEW CSS PALETTE: Electric Grape & Neon Lemon Arcade Style Look */
:root{
--bg:#0b031a;
--card:#1a0b36;
--text:#f5f3ff;
--muted:#c084fc;
--line:#3b1175;
--primary:#7c3aed;
--primary2:#a78bfa;
--accent:#eab308;
--accent2:#fde047;
--green:#10b981;
--danger:#ef4444;
--shadow:0 12px 35px rgba(124,58,237,0.2)
}

*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text);
user-select:none
}

button,input{font:inherit}
button{cursor:pointer}

.app{
width:100%;
max-width:430px;
min-height:100vh;
margin:auto;
overflow:hidden
}

/* HEADER - ARCADE ELECTRIC NEON GLOW GRADIENT */
.header{
position:relative;
padding:21px 18px 31px;
color:white;
background:linear-gradient(145deg,#3b1175,#1a0b36 55%,#db2777);
border-radius:0 0 31px 31px;
overflow:hidden;
border-bottom:3px solid var(--accent)
}

.header:before{
content:"";
position:absolute;
width:190px;
height:190px;
right:-90px;
top:-105px;
border-radius:50%;
background:rgba(234,179,8,0.06);
border:1px dashed var(--accent)
}

.topbar{
position:relative;
z-index:2;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:9px
}

.brand-icon{
width:41px;
height:41px;
display:grid;
place-items:center;
border-radius:13px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.15);
font-size:22px
}

.brand-name{
font-size:21px;
font-weight:900;
letter-spacing:-.5px
}

.theme{
width:40px;
height:40px;
border:0;
border-radius:13px;
background:rgba(255,255,255,.05);
color:#fff
}

.hero{
position:relative;
z-index:2;
margin-top:25px
}

.hero h1{
margin:0;
font-size:30px;
line-height:1.08;
letter-spacing:-.8px
}

.hero p{
margin:8px 0 0;
font-size:13px;
color:rgba(255,255,255,.7)
}

/* CONTENT CONTAINER */
.content{padding:18px}

.card{
padding:17px;
margin-bottom:14px;
background:var(--card);
border:1px solid var(--line);
border-radius:21px;
box-shadow:var(--shadow)
}

.title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px
}

.title h2{
margin:0;
font-size:15px;
text-transform:uppercase;
font-weight:800;
letter-spacing:0.5px;
color:var(--muted)
}

/* BIG ARCADE METRICS MONITOR SUB-PANEL */
.monitor-grid {
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:5px
}

.monitor-node {
padding:12px 6px;
background:var(--bg);
border:1px solid var(--line);
border-radius:14px;
text-align:center
}

.monitor-digits {
font-size:32px;
font-weight:900;
font-family:"Courier New",Courier,monospace;
color:var(--accent);
text-shadow:0 0 10px rgba(234,179,8,0.2)
}

.monitor-label {
display:block;
margin-top:4px;
font-size:9px;
color:var(--muted);
text-transform:uppercase;
font-weight:750
}

/* HUGE INTERACTIVE PRESSURE SENSITIVE TAP PAD */
.arcade-click-pad {
width:100%;
height:180px;
background:linear-gradient(180deg, var(--line), var(--bg));
border:3px solid var(--primary);
border-radius:18px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:inset 0 4px 15px rgba(0,0,0,0.5);
transition:transform 0.05s, border-color 0.1s;
text-align:center
}

.arcade-click-pad:active {
transform:scale(0.97);
border-color:var(--accent)
}

.pad-title {
font-size:24px;
font-weight:900;
text-transform:uppercase;
color:var(--text);
letter-spacing:-0.5px
}

.pad-sub {
font-size:11px;
color:var(--muted);
margin-top:4px;
text-transform:uppercase;
font-weight:700
}

.btn-reset {
width:100%;
padding:14px;
border:0;
border-radius:14px;
background:var(--line);
color:var(--text);
font-weight:800;
transition:opacity 0.2s
}
.btn-reset:active { opacity:0.9 }

/* NEON INVERSION STYLE SKIN LIGHT OVERRIDE */
body.light-theme {
--bg:#faf5ff;
--card:#ffffff;
--text:#1a0b36;
--muted:#7c3aed;
--line:#e9d5ff;
--shadow:0 10px 25px rgba(124,58,237,0.04)
}
</style>
</head>

<body>

<div class="app">

<header class="header">
<div class="topbar">
<div class="brand">
<div class="brand-icon">⚡</div>
<div class="brand-name">ClickSpeed</div>
</div>
<button class="theme" id="themeBtn" onclick="toggleTheme()">☀️</button>
</div>

<div class="hero">
<h1>Arcade CPS.<br>Test Human Reflexes.</h1>
<p>Measure clicks per second speeds locally with precise window clock loops timers.</p>
</div>
</header>

<main class="content">

<!-- STATS MONITORS GRID PANEL -->
<section class="card">
<div class="monitor-grid">
<div class="monitor-node">
<div id="lblTimeLeft" class="monitor-digits">10.0s</div>
<span class="monitor-label">Timer Track</span>
</div>
<div class="monitor-node">
<div id="lblClickCount" class="monitor-digits">0</div>
<span class="monitor-label">Total Clicks</span>
</div>
<div class="monitor-node">
<div id="lblCurrentCps" class="monitor-digits">0.0</div>
<span class="monitor-label">Clicks / Sec</span>
</div>
<div class="monitor-node">
<div id="lblHighScore" class="monitor-digits">0.0</div>
<span class="monitor-label">Record CPS</span>
</div>
</div>
</section>

<!-- MAIN TAP TARGET TRACK RIG -->
<section class="card" style="padding:10px;">
<div id="clickPadNode" class="arcade-click-pad" onclick="registerPadClickAction()">
<div id="lblPadText" class="pad-title">TAP TO START</div>
<div class="pad-sub">10 Second Speed Challenge</div>
</div>
</section>

<button class="btn-reset" onclick="resetChallengeState()">Reset Challenge Desk</button>

</main>

</div>

<script>
const TOTAL_DURATION_SECONDS = 10;

let gameTimerIntervalId = null;
let clickCounterTally = 0;
let timeRemainingDeciseconds = TOTAL_DURATION_SECONDS * 10;

let challengeActiveState = false;
let challengeFinishedState = false;

let recordHighCpsScore = parseFloat(localStorage.getItem("arcade_cps_highscore")) || 0.0;

function toggleTheme() {
    document.body.classList.toggle("light-theme");
    const btn = document.getElementById("themeBtn");
    btn.innerText = document.body.classList.contains("light-theme") ? "🌙" : "☀️";
}

function registerPadClickAction() {
    if (challengeFinishedState) return;

    if (!challengeActiveState) {
        // Launch Challenge Loop Tracks
        challengeActiveState = true;
        document.getElementById("lblPadText").innerText = "CLICK FASTER!";
        triggerRetroBeepTone(440, 0.08); // Start Signal sound
        
        gameTimerIntervalId = setInterval(() => {
            timeRemainingDeciseconds--;
            
            // Math dynamic calculations pipeline
            const secondsPassed = (TOTAL_DURATION_SECONDS * 10 - timeRemainingDeciseconds) / 10;
            const liveCpsRate = clickCounterTally / secondsPassed;
            
            document.getElementById("lblTimeLeft").innerText = `${(timeRemainingDeciseconds / 10).toFixed(1)}s`;
            document.getElementById("lblCurrentCps").innerText = liveCpsRate.toFixed(1);

            if (timeRemainingDeciseconds <= 0) {
                clearInterval(gameTimerIntervalId);
                terminateChallengeSession();
            }
        }, 100);
    }

    clickCounterTally++;
    document.getElementById("lblClickCount").innerText = clickCounterTally;
    triggerRetroBeepTone(600, 0.03); // Quick tap feel sound wave
}

function terminateChallengeSession() {
    challengeActiveState = false;
    challengeFinishedState = true;
    
    document.getElementById("lblPadText").innerText = "TIME UP!";
    const totalCpsResult = clickCounterTally / TOTAL_DURATION_SECONDS;
    document.getElementById("lblCurrentCps").innerText = totalCpsResult.toFixed(1);
    document.getElementById("lblTimeLeft").innerText = "0.0s";

    // Assess local profile high score parameters weights
    if (totalCpsResult > recordHighCpsScore) {
        recordHighCpsScore = totalCpsResult;
        localStorage.setItem("arcade_cps_highscore", recordHighCpsScore.toFixed(1));
        triggerRetroBeepTone(880, 0.3); // High record melody tone
        alert(`🎉 New High Score Record Locked: ${recordHighCpsScore.toFixed(1)} CPS!`);
    } else {
        triggerRetroBeepTone(220, 0.25); // Challenge finished standard buzzer low wave
    }
    
    synchronizeDashboardScores();
}

function resetChallengeState() {
    if (gameTimerIntervalId) clearInterval(gameTimerIntervalId);
    
    clickCounterTally = 0;
    timeRemainingDeciseconds = TOTAL_DURATION_SECONDS * 10;
    challengeActiveState = false;
    challengeFinishedState = false;

    document.getElementById("lblPadText").innerText = "TAP TO START";
    document.getElementById("lblClickCount").innerText = "0";
    document.getElementById("lblCurrentCps").innerText = "0.0";
    document.getElementById("lblTimeLeft").innerText = `${TOTAL_DURATION_SECONDS.toFixed(1)}s`;
    
    synchronizeDashboardScores();
}

function triggerRetroBeepTone(frequencyHzValue, durationSecondsValue) {
    if (window.AudioContext || window.webkitAudioContext) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = "sine";
            osc.frequency.setValueAtTime(frequencyHzValue, ctx.currentTime);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + durationSecondsValue);
        } catch (e) {}
    }
}

function synchronizeDashboardScores() {
    document.getElementById("lblHighScore").innerText = recordHighCpsScore.toFixed(1);
}

// Initial structural synchronization pass initially on boot up initialization updates
synchronizeDashboardScores();
</script>

</body>
</html>
